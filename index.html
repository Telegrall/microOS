<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-version="v11-pro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>microOS 11</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#0078d4;--accent-rgb:0,120,212;--radius:10px;--radius-w:10px;--radius-b:6px;--tb-h:48px}
html[data-theme="dark"]{--bg:#0d0d0d;--text:#fff;--dim:#a8a8a8;--win:rgba(32,32,32,.95);--solid:#202020;--panel:rgba(28,28,28,.92);--border:rgba(255,255,255,.09);--hover:rgba(255,255,255,.07);--input:rgba(255,255,255,.06);--shadow:0 12px 40px rgba(0,0,0,.6);--shadow-sm:0 2px 10px rgba(0,0,0,.4)}
html[data-theme="light"]{--bg:#f3f3f3;--text:#1b1b1b;--dim:#5c5c5c;--win:rgba(250,250,250,.96);--solid:#fafafa;--panel:rgba(243,243,243,.94);--border:rgba(0,0,0,.1);--hover:rgba(0,0,0,.06);--input:rgba(0,0,0,.05);--shadow:0 12px 40px rgba(0,0,0,.3);--shadow-sm:0 2px 10px rgba(0,0,0,.12)}
html[data-version^="v10"]{--radius-w:4px;--radius-b:3px}
html[data-version^="v10"] #tbCenter{position:static;transform:none;margin-left:8px}
html[data-version^="v10"] #taskbar{justify-content:flex-start}
html[data-version^="v10"] #tbTray{margin-left:auto}
html[data-version^="v10"] #startMenu{left:8px;transform:none;width:420px;height:auto;max-height:600px}
html[data-version^="v10"] #startMenu.closed{transform:translateY(16px) scale(.97)}
html[data-version="v10-std"]{--win:rgba(240,240,240,.95);--solid:#f0f0f0;--text:#1a1a1a;--dim:#555;--border:rgba(0,0,0,.12)}
html[data-version="v10-ultra"]{--bg:#0a0818;--text:#e8f4ff;--win:rgba(15,10,30,.94);--solid:#0f0a1e;--border:rgba(0,180,216,.25)}
html[data-version="v11-std"]{--win:rgba(250,250,250,.95);--solid:#fafafa;--text:#1a1a1a;--dim:#555}
html[data-version="v11-ultra"]{--radius-w:14px;--accent:#7B68EE;--accent-rgb:123,104,238;--bg:#0a0520;--text:#f0e8ff;--win:rgba(20,15,40,.88);--solid:#140f28;--border:rgba(123,104,238,.3)}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
body{color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
input,textarea,select{background:var(--input);border:1px solid var(--border);border-radius:6px;padding:7px 10px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.5);border-radius:4px}
.hidden{display:none!important}
.switch{width:40px;height:22px;border-radius:11px;background:rgba(128,128,128,.45);position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:4px;left:4px;transition:transform .2s}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(18px)}

/* BOOTLOADER */
#bootloader{position:fixed;inset:0;z-index:3000;background:#0a0a0a;color:#e0e0e0;display:flex;align-items:center;justify-content:center;font-family:Consolas,monospace;overflow:hidden}
#bootloader.hidden{display:none}
#bootloader .boot-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,0,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,0,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.boot-inner{text-align:center;padding:20px;position:relative;z-index:1}
.boot-title{font-size:42px;letter-spacing:3px;color:#fff;text-shadow:0 0 20px rgba(0,255,100,.6);margin-bottom:8px;animation:bg 2s infinite alternate}
@keyframes bg{to{text-shadow:0 0 30px rgba(0,255,100,.9),0 0 60px rgba(0,255,100,.5)}}
.boot-version{font-size:13px;color:#7a8a7a;margin-bottom:40px}
.boot-progress{width:400px;max-width:80vw;height:4px;background:#1a1a1a;border-radius:2px;margin:0 auto 18px;overflow:hidden}
.boot-progress>div{height:100%;width:0;background:linear-gradient(90deg,#00ff64,#00a844);transition:width .05s linear}
.boot-status{font-size:12px;color:#7a8a7a}
.blink{animation:bl 1s infinite}
@keyframes bl{50%{opacity:0}}

/* ACTIVATION */
#activationFlow{position:fixed;inset:0;z-index:2900;background:#0d0d0d;color:#e0e0e0;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
#activationFlow.hidden{display:none}
.act-screen,.act-verify,.act-greeting{width:100%;max-width:560px;padding:40px;text-align:center}
.act-icon{font-size:56px;margin-bottom:20px}
.act-title{font-size:24px;font-weight:300;margin-bottom:12px;color:#fff}
.act-subtitle{font-size:14px;opacity:.75;margin-bottom:28px}
.act-input{width:100%;padding:14px 18px;font-family:Consolas,monospace;font-size:14px;background:#181818;border:2px solid #333;border-radius:8px;color:#fff;outline:none;text-align:center}
.act-input:focus{border-color:#4aa3ff}
.act-btn{width:100%;margin-top:18px;padding:13px;border-radius:8px;background:#0078d4;color:#fff;font-size:15px;font-weight:500;cursor:pointer;border:none}
.act-btn:hover{background:#1a8ae4}
.act-btn:disabled{opacity:.5;cursor:not-allowed}
.act-error{color:#f48771;font-size:13px;min-height:20px;margin-top:12px}
.act-hint{font-size:11px;color:#555;margin-top:16px;cursor:pointer;text-decoration:underline;opacity:.6}
.act-hint:hover{opacity:1;color:#7cc4ff}
.act-verify-progress{width:100%;height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin-bottom:16px}
.act-verify-progress>div{height:100%;width:0;background:linear-gradient(90deg,#0078d4,#4aa3ff);transition:width .15s linear}
.act-verify-pct{font-size:12px;color:#888;margin-bottom:8px}
.act-verify-msg{font-size:13px;color:#aaa;min-height:20px}
.act-verify-msg.done{color:#2ecc71}
.act-shutdown{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#fff}
.act-shutdown-spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.act-greeting-title{font-size:48px;font-weight:300;margin-bottom:16px;background:linear-gradient(135deg,#4aa3ff,#a06bff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.act-greeting-sub{font-size:16px;opacity:.8;margin-bottom:40px}

/* VERSION SELECT */
.version-screen{width:100%;height:100%;display:flex;flex-direction:column;padding:20px;overflow-y:auto;background:#0d0d0d;color:#fff}
.version-header{text-align:center;padding:20px 0}
.version-step{font-size:14px;color:#7cc4ff;margin-bottom:8px}
.version-title{font-size:30px;font-weight:300;margin-bottom:10px}
.version-sub{font-size:14px;opacity:.7}
.version-license{display:inline-block;padding:6px 14px;border-radius:20px;font-size:12px;margin-bottom:16px;background:rgba(74,163,255,.2);border:1px solid #4aa3ff}
.version-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.version-tab{padding:10px 20px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff}
.version-tab.active{background:rgba(74,163,255,.25);border-color:#4aa3ff}
.version-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-width:1400px;margin:0 auto;width:100%;padding:0 10px 20px}
.version-card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:16px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:8px;transition:all .2s}
.version-card:hover:not(.locked){transform:translateY(-2px);background:rgba(255,255,255,.1)}
.version-card.selected{border-color:#4aa3ff;box-shadow:0 0 0 3px rgba(74,163,255,.3)}
.version-card.locked{opacity:.4;cursor:not-allowed}
.version-card.locked::after{content:'🔒';position:absolute;top:12px;right:12px;font-size:20px}
.version-preview{height:110px;border-radius:8px;position:relative;overflow:hidden;border:1px solid}
.version-ptb{position:absolute;left:0;right:0;height:16px;bottom:0}
.version-pwin{position:absolute;top:22px;left:20px;right:20px;bottom:26px;border-radius:4px}
.version-name{font-size:14px;font-weight:600}
.version-model{font-size:10.5px;color:#7cc4ff;text-transform:uppercase}
.version-desc{font-size:11px;opacity:.7;line-height:1.4;min-height:30px}
.version-tags{display:flex;flex-wrap:wrap;gap:4px}
.version-tag{font-size:9.5px;padding:2px 6px;border-radius:4px;font-weight:600}
.version-check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#4aa3ff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.version-footer{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px;border-top:1px solid rgba(255,255,255,.1);max-width:1400px;margin:auto auto 0;width:100%}
.version-btn{padding:10px 24px;border-radius:8px;border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;cursor:pointer}
.version-btn.primary{background:#0078d4;border:none;font-weight:500}
.version-btn:disabled{opacity:.4;cursor:not-allowed}

/* DESKTOP & WINDOWS */
#wallpaper{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;transition:filter .3s}
#desktop{position:fixed;inset:0;z-index:1}
#icons{position:absolute;inset:0}
.dicon{position:absolute;width:88px;padding:8px 4px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;cursor:pointer;transition:background .15s}
.dicon:hover{background:var(--hover)}
.dicon.sel{background:rgba(var(--accent-rgb),.3);outline:1px solid rgba(var(--accent-rgb),.5)}
.dicon .em{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.dicon .em img{width:42px;height:42px;border-radius:10px;object-fit:cover}
.dicon .lb{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.2;max-width:84px;word-break:break-word}
#windowLayer{position:fixed;inset:0;z-index:10;pointer-events:none}
.window{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--win);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius-w);box-shadow:var(--shadow-sm);overflow:hidden;min-width:320px;min-height:200px;transition:opacity .18s,transform .18s,box-shadow .18s}
.window.active{box-shadow:var(--shadow);border-color:rgba(var(--accent-rgb),.35)}
.window.opening{animation:winIn .2s ease}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.window.closing{opacity:0;transform:scale(.94) translateY(10px)}
.window.minimized{opacity:0;transform:scale(.7) translateY(60vh);pointer-events:none}
.win-tb{height:38px;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border-bottom:1px solid var(--border);flex:none}
.win-ic{font-size:15px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.win-ic img{width:18px;height:18px;border-radius:4px}
.win-title{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-ctr{display:flex;gap:2px}
.win-btn{width:36px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .15s}
.win-btn:hover{background:var(--hover)}
.win-btn.close:hover{background:#e81123;color:#fff}
.win-body{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0;position:relative}

/* TASKBAR */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:100;background:var(--panel);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 8px}
#tbCenter{display:flex;align-items:center;gap:3px;position:absolute;left:50%;transform:translateX(-50%)}
.tb-btn{width:44px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;transition:background .15s}
.tb-btn:hover{background:var(--hover)}
.tb-btn img{width:24px;height:24px;border-radius:5px;object-fit:cover}
.tb-btn.running::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:var(--accent)}
.tb-btn.focused::after{width:16px}
.tb-logo{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.tb-logo i{background:var(--accent);border-radius:1px;display:block}
#tbTray{margin-left:auto;display:flex;align-items:center;gap:2px}
.tray-btn{height:36px;min-width:34px;padding:0 10px;border-radius:6px;display:flex;align-items:center;gap:6px;font-size:13px;transition:background .15s}
.tray-btn:hover{background:var(--hover)}
#trayClock{flex-direction:column;font-size:11px;line-height:1.15;padding:0 10px}
#trayClock .t{font-weight:500}
#trayClock .d{font-size:10px;color:var(--dim)}
.install-btn{background:rgba(var(--accent-rgb),.15);border:1px solid rgba(var(--accent-rgb),.35);font-weight:600}
.install-btn:hover{background:rgba(var(--accent-rgb),.3)}

/* PANELS */
.panel{position:fixed;z-index:200;background:var(--panel);backdrop-filter:blur(28px);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);transition:opacity .2s,transform .2s;transform-origin:bottom center}
.panel.closed{opacity:0;transform:translateY(16px) scale(.97);pointer-events:none}
#startMenu{left:50%;bottom:56px;transform:translateX(-50%);width:620px;max-width:calc(100vw - 24px);height:620px;max-height:calc(100vh - 90px);padding:18px 20px 0;display:flex;flex-direction:column}
#startMenu.closed{transform:translateX(-50%) translateY(16px) scale(.97)}
.sm-search input{width:100%;padding:9px 14px;border-radius:20px;margin-bottom:14px;font-size:13px}
.sm-scroll{flex:1;overflow-y:auto;margin-bottom:8px}
.sm-h{font-size:12px;font-weight:600;color:var(--dim);margin:10px 0 8px}
.sm-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:8px;font-size:11px;transition:background .15s;cursor:pointer;text-align:center}
.sm-app:hover{background:var(--hover)}
.sm-app .em{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:26px}
.sm-app .em img{width:26px;height:26px;border-radius:6px;object-fit:cover}
.sm-list{display:flex;flex-direction:column;gap:2px}
.sm-row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer;transition:background .15s}
.sm-row:hover{background:var(--hover)}
.sm-row .em{font-size:19px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.sm-row .em img{width:22px;height:22px;border-radius:4px;object-fit:cover}
.sm-footer{display:flex;align-items:center;gap:8px;padding:12px 0;margin:0 -20px;padding-left:20px;padding-right:20px;border-top:1px solid var(--border);background:rgba(128,128,128,.07)}
.sm-user{display:flex;align-items:center;gap:10px;flex:1;padding:4px 8px;border-radius:6px}
.sm-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}
.sm-power{width:36px;height:36px;border-radius:6px;font-size:16px;display:flex;align-items:center;justify-content:center}
.sm-power:hover{background:var(--hover)}

#notifs{position:fixed;right:12px;bottom:60px;z-index:300;display:flex;flex-direction:column;gap:8px;width:340px;max-width:calc(100vw - 24px);pointer-events:none}
.notif{background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;pointer-events:auto;font-size:12.5px;animation:notifIn .25s ease}
.notif.out{animation:notifOut .2s forwards}
@keyframes notifIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes notifOut{to{opacity:0;transform:translateX(60px)}}
.notif .em{font-size:20px}
.notif b{display:block;font-size:13px;margin-bottom:2px}

/* DIALOGS */
.dialog-overlay{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dialog{background:var(--solid);border:1px solid var(--border);border-radius:10px;min-width:400px;max-width:620px;width:100%;box-shadow:var(--shadow);overflow:hidden;color:var(--text);max-height:90vh;display:flex;flex-direction:column}
.dialog-head{padding:14px 18px;background:linear-gradient(135deg,rgba(var(--accent-rgb),.15),rgba(var(--accent-rgb),.05));border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600}
.dialog-body{padding:20px;font-size:13px;line-height:1.55;overflow-y:auto;flex:1}
.dialog-foot{padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;background:rgba(128,128,128,.05);border-top:1px solid var(--border);flex:none}
.dialog-foot button{padding:8px 20px;border-radius:6px;border:1px solid var(--border);background:var(--input);font-size:12.5px;cursor:pointer}
.dialog-foot button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:500}
.dialog-foot button:hover{filter:brightness(1.15)}
.dialog-foot button:disabled{opacity:.5;cursor:not-allowed}

/* COMMON APP */
.toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:rgba(128,128,128,.05)}
.tbtn{min-width:30px;height:28px;padding:0 8px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12.5px;cursor:pointer;border:1px solid transparent}
.tbtn:hover{background:var(--hover)}
.tbtn.on{background:rgba(var(--accent-rgb),.25);border-color:var(--accent)}
.btn{padding:7px 16px;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;border:none}
.btn:hover{filter:brightness(1.15)}
.btn.sec{background:var(--input);color:var(--text);border:1px solid var(--border)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid var(--border);font-size:13px}
.row:last-child{border-bottom:none}
.card{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px}

/* PAINT */
.paint-canvas{flex:1;background:#fff;cursor:crosshair;display:block;margin:0 auto;max-width:100%;max-height:100%}
.paint-tools{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;background:rgba(128,128,128,.05)}
.paint-color{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid var(--border)}
.paint-color.on{outline:2px solid var(--accent);outline-offset:1px}

/* NOTEPAD */
.np{flex:1;padding:14px;outline:none;font-size:14px;line-height:1.5;resize:none;background:var(--solid);border:none;width:100%;height:100%;color:var(--text)}
.np-tb{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;background:rgba(128,128,128,.05)}

/* TERMINAL */
.term{flex:1;background:#0c0c0c;color:#ccc;font-family:Consolas,monospace;font-size:13px;padding:12px;overflow-y:auto;line-height:1.5}
.term .line{white-space:pre-wrap;word-break:break-word}
.term .prompt{color:#4ec9b0}
.term .err{color:#f48771}
.term .ok{color:#b5cea8}
.term input{background:transparent;border:none;color:#ccc;font-family:inherit;font-size:13px;padding:0;width:70%;outline:none}

/* SETTINGS */
.set{display:flex;height:100%}
.set-nav{width:200px;flex:none;border-right:1px solid var(--border);padding:10px 8px;overflow-y:auto}
.set-nav .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;font-size:13px;cursor:pointer;transition:background .15s}
.set-nav .it:hover{background:var(--hover)}
.set-nav .it.sel{background:rgba(var(--accent-rgb),.22);font-weight:600}
.set-body{flex:1;overflow-y:auto;padding:24px 28px}
.set-body h2{font-size:20px;margin-bottom:16px}
.set-body h3{font-size:14px;margin:20px 0 10px}

/* EXPLORER */
.exp{display:flex;flex-direction:column;height:100%}
.exp-tb{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;background:rgba(128,128,128,.05)}
.exp-crumb{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12.5px;display:flex;gap:4px;flex-wrap:wrap}
.exp-crumb span{padding:3px 6px;border-radius:4px;cursor:pointer}
.exp-crumb span:hover{background:var(--hover)}
.exp-grid{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start}
.exp-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:6px;font-size:12px;cursor:pointer;text-align:center;transition:background .15s}
.exp-item:hover{background:var(--hover)}
.exp-item.sel{background:rgba(var(--accent-rgb),.28);outline:1px solid rgba(var(--accent-rgb),.5)}
.exp-item .em{font-size:32px}

/* CALC */
.calc{flex:1;display:flex;flex-direction:column;padding:12px;gap:8px;background:var(--solid)}
.calc-disp{padding:16px;text-align:right;font-size:32px;font-weight:300;min-height:64px;background:var(--input);border-radius:8px;word-break:break-all;font-variant-numeric:tabular-nums}
.calc-tabs{display:flex;gap:4px}
.calc-tabs button{padding:6px 14px;border-radius:6px;font-size:12px;background:var(--input);border:1px solid var(--border);cursor:pointer}
.calc-tabs button.on{background:var(--accent);color:#fff;border-color:transparent}
.calc-keys{display:grid;gap:5px;flex:1;min-height:0}
.calc-keys.std{grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr}
.calc-keys.sci{grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr}
.ckey{border-radius:6px;background:var(--input);font-size:16px;cursor:pointer;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;transition:background .15s}
.ckey:hover{background:var(--hover)}
.ckey.op{background:rgba(128,128,128,.18)}
.ckey.eq{background:var(--accent);color:#fff;border-color:transparent}

/* CLOCK */
.clock-app{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
.big-clock{font-size:52px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.tabs2{display:flex;gap:4px;background:var(--input);padding:4px;border-radius:8px}
.tabs2 button{padding:7px 18px;border-radius:6px;font-size:12.5px;cursor:pointer}
.tabs2 button.on{background:var(--accent);color:#fff}

/* MAIL */
.mail{display:flex;height:100%}
.mail-nav{width:180px;flex:none;border-right:1px solid var(--border);padding:10px 6px}
.mail-nav .folder{padding:8px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between}
.mail-nav .folder:hover{background:var(--hover)}
.mail-nav .folder.on{background:rgba(var(--accent-rgb),.22);font-weight:500}
.mail-list{width:280px;flex:none;border-right:1px solid var(--border);overflow-y:auto}
.mail-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12.5px}
.mail-item:hover{background:var(--hover)}
.mail-item.unread{font-weight:600;background:rgba(var(--accent-rgb),.05)}
.mail-view{flex:1;padding:20px;overflow-y:auto}
.mail-view .subject{font-size:17px;font-weight:600;margin-bottom:8px}
.mail-view .meta{font-size:12px;color:var(--dim);margin-bottom:16px}
.mail-view .body{font-size:13.5px;line-height:1.6;white-space:pre-wrap}

/* CAMERA */
.cam{flex:1;display:flex;flex-direction:column;background:#000}
.cam-view{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.cam-view video{width:100%;height:100%;object-fit:cover}
.cam-ctrl{padding:14px;display:flex;justify-content:center;gap:20px;background:#000}
.cam-shutter{width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid #999;cursor:pointer}

/* WEATHER */
.weather{flex:1;padding:24px;background:linear-gradient(180deg,#4a90e2,#2c5f9e);color:#fff;overflow-y:auto}
.w-now{text-align:center;margin-bottom:24px}
.w-temp{font-size:64px;font-weight:200;line-height:1}
.w-city{font-size:18px;margin-bottom:4px}
.w-desc{font-size:13px;opacity:.85}
.w-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-bottom:16px}
.w-day{background:rgba(255,255,255,.15);padding:12px;border-radius:10px;text-align:center;font-size:12px}

/* MAPS */
.maps{flex:1;position:relative;overflow:hidden;background:linear-gradient(135deg,#c8e6c9,#81c784)}
.maps-search{position:absolute;top:16px;left:16px;right:16px;background:#fff;border-radius:8px;padding:8px;box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:2}
.maps-search input{width:100%;border:none;outline:none;font-size:14px;color:#333;background:transparent}
.maps-pin{position:absolute;font-size:24px;cursor:pointer;transform:translate(-50%,-100%)}

/* PHOTOS */
.photos{flex:1;padding:16px;overflow-y:auto}
.photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.photos-grid .item{aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--input);display:flex;align-items:center;justify-content:center;font-size:36px}
.photos-grid .item img{width:100%;height:100%;object-fit:cover}

/* MEDIA */
.media{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;background:#000}

/* TELEGRAM */
.tg{display:flex;height:100%;background:#17212b;color:#e8e8e8}
.tg-side{width:280px;flex:none;border-right:1px solid #0e1621;display:flex;flex-direction:column}
.tg-side-head{padding:10px 12px;border-bottom:1px solid #0e1621}
.tg-side-head input{width:100%;background:#242f3d;border:none;border-radius:18px;padding:7px 12px;font-size:12px;color:#fff}
.tg-list{flex:1;overflow-y:auto}
.tg-chat{padding:10px 12px;display:flex;gap:10px;cursor:pointer;transition:background .15s}
.tg-chat:hover{background:#202b36}
.tg-chat.sel{background:#2b5278}
.tg-av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px}
.tg-info{flex:1;min-width:0}
.tg-name{font-size:13.5px;font-weight:600;color:#fff;display:flex;justify-content:space-between;margin-bottom:3px}
.tg-name .time{font-size:11px;color:#6c7883;font-weight:400}
.tg-prev{font-size:12px;color:#6c7883;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-main{flex:1;display:flex;flex-direction:column;background:#0e1621}
.tg-head{padding:10px 16px;background:#17212b;border-bottom:1px solid #0e1621;display:flex;align-items:center;gap:10px}
.tg-head .name{font-weight:600;font-size:14px}
.tg-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.tg-msg{max-width:70%;padding:7px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;word-break:break-word}
.tg-msg.in{background:#182533;align-self:flex-start;border-top-left-radius:4px}
.tg-msg.out{background:#2b5278;align-self:flex-end;border-top-right-radius:4px}
.tg-msg .time{font-size:10.5px;opacity:.6;margin-left:6px}
.tg-input{padding:10px 16px;background:#17212b;border-top:1px solid #0e1621;display:flex;gap:8px}
.tg-input input{flex:1;background:#242f3d;border:none;border-radius:18px;padding:8px 14px;font-size:13.5px;color:#fff}
.tg-send{width:36px;height:36px;border-radius:50%;background:#0088cc;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.tg-empty{flex:1;display:flex;align-items:center;justify-content:center;color:#6c7883;font-size:13px}

/* WHATSAPP */
.wa{display:flex;height:100%;background:#f0f2f5;color:#111}
.wa-side{width:280px;flex:none;background:#fff;border-right:1px solid #e0e0e0;display:flex;flex-direction:column}
.wa-side-head{padding:10px;background:#f0f2f5;border-bottom:1px solid #e0e0e0}
.wa-side-head input{width:100%;background:#fff;border:none;border-radius:18px;padding:7px 12px;font-size:12px;color:#111}
.wa-list{flex:1;overflow-y:auto}
.wa-chat{padding:10px 12px;display:flex;gap:10px;cursor:pointer}
.wa-chat:hover{background:#f5f5f5}
.wa-chat.sel{background:#e5ddd5}
.wa-av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px}
.wa-info{flex:1;min-width:0}
.wa-name{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;margin-bottom:3px}
.wa-name .time{font-size:11px;color:#667781}
.wa-prev{font-size:12px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-main{flex:1;display:flex;flex-direction:column;background:#e5ddd5}
.wa-head{padding:10px 16px;background:#f0f2f5;border-bottom:1px solid #e0e0e0}
.wa-head .name{font-weight:600;font-size:14px}
.wa-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px}
.wa-msg{max-width:70%;padding:6px 10px;border-radius:8px;font-size:13.5px;line-height:1.4;word-break:break-word}
.wa-msg.in{background:#fff;align-self:flex-start;border-top-left-radius:0}
.wa-msg.out{background:#dcf8c6;align-self:flex-end;border-top-right-radius:0}
.wa-msg .time{font-size:10px;color:#667781;margin-left:6px}
.wa-input{padding:8px 12px;background:#f0f2f5;display:flex;gap:8px}
.wa-input input{flex:1;background:#fff;border:none;border-radius:20px;padding:8px 14px;font-size:13.5px;color:#111}
.wa-send{width:36px;height:36px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}

/* YOUTUBE */
.yt{display:flex;flex-direction:column;height:100%;background:#0f0f0f;color:#fff}
.yt-head{padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #272727}
.yt-logo{font-weight:700;font-size:18px;color:#ff0000}
.yt-search{flex:1;max-width:500px;background:#121212;border:1px solid #303030;border-radius:20px;padding:7px 16px;color:#fff;outline:none}
.yt-feed{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;align-content:start}
.yt-card{cursor:pointer}
.yt-thumb{aspect-ratio:16/9;border-radius:8px;margin-bottom:8px;position:relative;overflow:hidden}
.yt-thumb .dur{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:2px 4px;border-radius:3px}
.yt-title{font-size:13.5px;font-weight:600;line-height:1.3;margin-bottom:4px}
.yt-meta{font-size:11.5px;color:#aaa}

/* INSTAGRAM */
.ig{display:flex;flex-direction:column;height:100%;background:#fafafa;color:#262626}
.ig-head{padding:10px 16px;border-bottom:1px solid #dbdbdb;display:flex;justify-content:space-between;align-items:center}
.ig-logo{font-family:'Segoe Script',cursive;font-size:22px;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700}
.ig-feed{flex:1;overflow-y:auto}
.ig-post{background:#fff;border-bottom:1px solid #dbdbdb;margin-bottom:8px}
.ig-post-h{padding:10px 14px;display:flex;align-items:center;gap:10px}
.ig-post-h .av{width:32px;height:32px;border-radius:50%;color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.ig-post-h .u{font-weight:600;font-size:13px}
.ig-img{aspect-ratio:1;width:100%}
.ig-acts{padding:10px 14px;display:flex;gap:14px;font-size:22px}
.ig-likes{padding:0 14px 4px;font-size:13px;font-weight:600}
.ig-cap{padding:0 14px 12px;font-size:13px}

/* VK */
.vk{display:flex;height:100%;background:#edeef0;color:#000}
.vk-side{width:180px;flex:none;background:#fff;border-right:1px solid #e0e0e0;padding:12px 6px}
.vk-side .item{padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:center}
.vk-side .item:hover{background:#f0f2f5}
.vk-side .item.on{background:#e5ebf1;color:#0077FF;font-weight:600}
.vk-main{flex:1;overflow-y:auto;padding:16px}
.vk-post{background:#fff;border-radius:8px;margin-bottom:12px;padding:14px}
.vk-post .hdr{display:flex;gap:10px;margin-bottom:10px}
.vk-post .hdr .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
.vk-post .hdr .name{font-weight:600;font-size:13px}
.vk-post .text{font-size:13.5px;line-height:1.5;margin-bottom:10px}

/* TIKTOK */
.tt{height:100%;background:#000;color:#fff;overflow:hidden;position:relative}
.tt-feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory}
.tt-video{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center}
.tt-video .grad{position:absolute;inset:0}
.tt-video .overlay{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding:20px}
.tt-side{position:absolute;right:12px;bottom:100px;z-index:3;display:flex;flex-direction:column;gap:20px;align-items:center}
.tt-action{display:flex;flex-direction:column;align-items:center;font-size:26px;cursor:pointer}
.tt-action span{font-size:11px;margin-top:2px}

/* MINESWEEPER / SNAKE / 2048 */
.game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;overflow:auto}
.game-hud{display:flex;gap:16px;align-items:center;font-size:13px;font-weight:600;flex-wrap:wrap}
.ms-grid{display:grid;gap:2px;background:var(--border);padding:2px;border-radius:4px}
.ms-cell{width:26px;height:26px;background:rgba(128,128,128,.28);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.ms-cell:hover{background:rgba(128,128,128,.45)}
.ms-cell.open{background:rgba(128,128,128,.1);cursor:default}
.ms-cell.mine{background:#e81123;color:#fff}
.ms-cell.flag{color:#e81123}
.snake-cv{border-radius:8px;background:#0d1a0d;display:block}
.g2048{display:grid;grid-template-columns:repeat(4,70px);gap:8px;background:#bbada0;padding:8px;border-radius:8px}
.g2048 .c{width:70px;height:70px;border-radius:4px;background:#cdc1b4;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#776e65}
.g2048 .c[data-v="2"]{background:#eee4da}
.g2048 .c[data-v="4"]{background:#ede0c8}
.g2048 .c[data-v="8"]{background:#f2b179;color:#fff}
.g2048 .c[data-v="16"]{background:#f59563;color:#fff}
.g2048 .c[data-v="32"]{background:#f67c5f;color:#fff}
.g2048 .c[data-v="64"]{background:#f65e3b;color:#fff}
.g2048 .c[data-v="128"]{background:#edcf72;color:#fff}
.g2048 .c[data-v="256"]{background:#edcc61;color:#fff}
.g2048 .c[data-v="512"]{background:#edc850;color:#fff}

/* DISASTERS */
.cp{position:fixed;right:8px;top:8px;bottom:calc(var(--tb-h) + 8px);width:320px;z-index:150;background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:cpIn .3s ease}
@keyframes cpIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}
.cp-head{padding:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cp-head h3{font-size:12.5px;font-weight:600;flex:1}
.cp-status{width:10px;height:10px;border-radius:50%;background:#2ecc71}
.cp-body{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cp-section{font-size:10.5px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 4px}
.cp-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:rgba(128,128,128,.1);border:1px solid var(--border);font-size:11.5px;cursor:pointer;text-align:left}
.cp-btn:hover{background:rgba(var(--accent-rgb),.18)}
.cp-btn.danger{background:rgba(231,76,60,.15);border-color:rgba(231,76,60,.3)}
.cp-btn.success{background:rgba(46,204,113,.15);border-color:rgba(46,204,113,.3)}
.cp-btn .em{font-size:16px;flex:none}
.cp-btn .lbl{flex:1}

/* VM / APK viewer */
.vm-viewer{display:flex;flex-direction:column;height:100%;background:var(--solid)}
.vm-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;gap:16px;align-items:center}
.vm-header .icon{width:64px;height:64px;border-radius:14px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:40px;flex:none;overflow:hidden}
.vm-header .icon img{width:100%;height:100%;object-fit:cover}
.vm-header .info{flex:1;min-width:0}
.vm-header h2{font-size:18px;font-weight:600;margin-bottom:4px;word-break:break-word}
.vm-header .sub{font-size:12px;color:var(--dim)}
.vm-tabs{display:flex;border-bottom:1px solid var(--border);background:rgba(128,128,128,.04);overflow-x:auto}
.vm-tab{padding:10px 16px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--dim);white-space:nowrap}
.vm-tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.vm-content{flex:1;overflow-y:auto;padding:20px}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:16px}
.info-row:last-child{border-bottom:none}
.info-row .k{color:var(--dim);flex:none}
.info-row .v{text-align:right;word-break:break-word;font-family:monospace;font-size:12px}
.perm{padding:4px 10px;background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.3);border-radius:12px;font-size:11px;margin:3px;display:inline-block;color:var(--accent);font-family:monospace}
.empty{padding:40px;text-align:center;color:var(--dim)}
.empty .em{font-size:56px;margin-bottom:12px}
.section-title{font-size:11px;text-transform:uppercase;color:var(--dim);margin:16px 0 8px;letter-spacing:.5px;font-weight:600}

/* MISC */
#fileInput{display:none}
#kbOverlay{position:fixed;bottom:calc(var(--tb-h)+8px);left:50%;transform:translateX(-50%);z-index:350;display:none;padding:8px 16px;background:#e74c3c;color:#fff;border-radius:6px;font-size:12px;font-weight:600}
#mouseBlock{position:fixed;inset:0;z-index:80;display:none;cursor:not-allowed;background:rgba(0,0,0,.15)}
#mouseBlock::after{content:'🖱 Устройство не отвечает';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:10px 20px;background:rgba(231,76,60,.9);color:#fff;border-radius:8px;font-size:13px;font-weight:600}
#dropOverlay{position:fixed;inset:0;z-index:900;background:rgba(var(--accent-rgb),.25);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;pointer-events:none}
#dropOverlay.hidden{display:none}
.drop-zone{border:3px dashed #fff;border-radius:20px;padding:60px 80px;text-align:center;color:#fff;background:rgba(0,0,0,.35)}
.drop-icon{font-size:72px;margin-bottom:12px}
.drop-text{font-size:20px;font-weight:600}

/* Installer */
.inst-overlay{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.inst-dialog{background:var(--solid);border:1px solid var(--border);min-width:480px;max-width:600px;width:100%;box-shadow:var(--shadow);overflow:hidden;color:var(--text);border-radius:var(--radius-w);display:flex;flex-direction:column;max-height:90vh}
.inst-head{padding:14px 18px;background:linear-gradient(135deg,rgba(var(--accent-rgb),.15),rgba(var(--accent-rgb),.05));border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.inst-head .em{font-size:26px}
.inst-head h3{font-size:14.5px;font-weight:600;flex:1}
.inst-body{padding:18px 20px;font-size:13px;line-height:1.55;overflow-y:auto;flex:1}
.inst-foot{padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;background:rgba(128,128,128,.05);border-top:1px solid var(--border);flex:none}
.inst-foot button{padding:7px 20px;border-radius:6px;border:1px solid var(--border);background:var(--input);font-size:12.5px;cursor:pointer}
.inst-foot button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:500}

<script>
'use strict';
window.microOS = {};
(function(M){

/* ==================== UTIL ==================== */
const U = M.Util = {
  $:(s,r=document)=>r.querySelector(s),
  $$:(s,r=document)=>Array.from(r.querySelectorAll(s)),
  el(t,c,txt){ const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; },
  lsGet(k,d){ try{const v=localStorage.getItem('microOS.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  lsSet(k,v){ try{localStorage.setItem('microOS.'+k,JSON.stringify(v));return true;}catch(e){return false;} },
  rand:(a,b)=>a+Math.random()*(b-a),
  pad:n=>String(n).padStart(2,'0'),
  debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; },
  fmtSize:b=>{ if(!b||b<1024)return (b||0)+' Б'; if(b<1048576)return (b/1024).toFixed(1)+' КБ'; if(b<1073741824)return (b/1048576).toFixed(2)+' МБ'; return (b/1073741824).toFixed(2)+' ГБ'; },
  esc:s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
};

/* ==================== DB ==================== */
const DB = M.DB = {
  db:null,
  async init(){
    if(this.db) return this.db;
    return new Promise((res,rej)=>{
      const req = indexedDB.open('microOS_v3', 1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains('apps')) d.createObjectStore('apps',{keyPath:'id',autoIncrement:true});
        if(!d.objectStoreNames.contains('files')) d.createObjectStore('files',{keyPath:'id',autoIncrement:true});
        if(!d.objectStoreNames.contains('appData')){
          const s = d.createObjectStore('appData',{keyPath:'id',autoIncrement:true});
          s.createIndex('appId','appId');
          s.createIndex('appIdKey',['appId','key'],{unique:true});
        }
        if(!d.objectStoreNames.contains('snapshots')){
          const s = d.createObjectStore('snapshots',{keyPath:'id',autoIncrement:true});
          s.createIndex('appId','appId');
        }
      };
      req.onsuccess = e => { this.db = e.target.result; res(this.db); };
      req.onerror = e => rej(e.target.error);
    });
  },
  async op(store,mode,fn){
    const db = await this.init();
    return new Promise((res,rej)=>{
      const tx = db.transaction(store,mode);
      const r = fn(tx.objectStore(store));
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  addApp:a=>DB.op('apps','readwrite',s=>s.add(a)),
  getApp:id=>DB.op('apps','readonly',s=>s.get(id)),
  getAllApps:()=>DB.op('apps','readonly',s=>s.getAll()),
  updateApp:a=>DB.op('apps','readwrite',s=>s.put(a)),
  deleteApp:id=>DB.op('apps','readwrite',s=>s.delete(id)),
  addFile:f=>DB.op('files','readwrite',s=>s.add(f)),
  getFile:id=>DB.op('files','readonly',s=>s.get(id)),
  deleteFile:id=>DB.op('files','readwrite',s=>s.delete(id)),
  addSnapshot:sn=>DB.op('snapshots','readwrite',s=>s.add(sn)),
  getSnapshots:appId=>DB.op('snapshots','readonly',s=>s.index('appId').getAll(appId)),
  deleteSnapshot:id=>DB.op('snapshots','readwrite',s=>s.delete(id))
};

const AppData = M.AppData = {
  async get(appId,key,def){
    try{
      const db = await DB.init();
      return new Promise(r=>{
        const tx = db.transaction('appData','readonly');
        const req = tx.objectStore('appData').index('appIdKey').get([appId,key]);
        req.onsuccess = () => r(req.result ? req.result.value : def);
        req.onerror = () => r(def);
      });
    }catch(e){ return def; }
  },
  async set(appId,key,value){
    try{
      const db = await DB.init();
      return new Promise(r=>{
        const tx = db.transaction('appData','readwrite');
        const st = tx.objectStore('appData');
        const req = st.index('appIdKey').get([appId,key]);
        req.onsuccess = e => {
          const ex = e.target.result;
          if(ex){ ex.value = value; st.put(ex); } else { st.add({appId,key,value}); }
        };
        tx.oncomplete = () => r(true);
        tx.onerror = () => r(false);
      });
    }catch(e){ return false; }
  },
  async deleteAll(appId){
    try{
      const db = await DB.init();
      return new Promise(r=>{
        const tx = db.transaction('appData','readwrite');
        const st = tx.objectStore('appData');
        const req = st.index('appId').getAllKeys(appId);
        req.onsuccess = e => { e.target.result.forEach(k => st.delete(k)); };
        tx.oncomplete = () => r(true);
      });
    }catch(e){ return false; }
  }
};

/* ==================== LICENSE ==================== */
const ACTIVATION_KEYS = {
  admin: "paykey1234567890adminopen",
  home:  "paykey1234567890homeopen"
};

const License = M.License = {
  type:null, key:null,
  load(){
    const s = U.lsGet('license',null);
    if(s && s.type && ACTIVATION_KEYS[s.type] === s.key){ this.type = s.type; this.key = s.key; return true; }
    return false;
  },
  save(){ U.lsSet('license',{type:this.type, key:this.key}); },
  validate(input){
    const t = (input||'').trim();
    if(!t) return null;
    if(t === ACTIVATION_KEYS.admin) return 'admin';
    if(t === ACTIVATION_KEYS.home) return 'home';
    return null;
  },
  activate(type,key){ this.type = type; this.key = key; this.save(); },
  clear(){ this.type = null; this.key = null; U.lsSet('license',null); },
  isAdmin(){ return this.type === 'admin'; },
  isHome(){ return this.type === 'home'; },
  isActivated(){ return this.type !== null; },
  getLabel(){ if(this.type === 'admin') return 'Администратор'; if(this.type === 'home') return 'Домашняя'; return 'Не активирована'; },
  getIcon(){ if(this.type === 'admin') return '👑'; if(this.type === 'home') return '🏠'; return '🔒'; },
  allowedVersions(){
    if(this.type === 'admin') return ['v10-std','v10-home','v10-pro','v10-pro-max','v10-ultra','v11-std','v11-home','v11-pro','v11-pro-max','v11-ultra'];
    if(this.type === 'home') return ['v10-home','v11-home'];
    return [];
  },
  canUseVersion(id){ return this.allowedVersions().includes(id); },
  canUseApp(appId){
    if(this.type === 'admin') return true;
    if(this.type === 'home'){
      const adminOnly = ['taskmgr','devmgmt','eventviewer','regedit','gpedit','services','diskmgmt','recovery','winget','defender','powershell','cmd'];
      return !adminOnly.includes(appId);
    }
    return false;
  },
  canUseDisasters(){ return this.type === 'admin'; },
  maxVMs(){ return this.type === 'admin' ? 5 : (this.type === 'home' ? 2 : 0); },
  maxWindows(){ return this.type === 'admin' ? 20 : (this.type === 'home' ? 6 : 0); }
};

/* ==================== VERSIONS ==================== */
const VERSIONS = M.VERSIONS = [
  { id:'v10-std', line:10, model:'Standard', name:'microOS 10 Standard', description:'Базовая линейка 10. Светлая.', accent:'#0078D7', tags:['Светлая','Radius 4'], theme:'light' },
  { id:'v10-home', line:10, model:'Home', name:'microOS 10 Home', description:'Домашняя с виджетами.', accent:'#0078D4', tags:['Виджеты','Домашняя'], theme:'light' },
  { id:'v10-pro', line:10, model:'Pro', name:'microOS 10 Pro', description:'Профессиональная. Тёмная.', accent:'#0078D4', tags:['Тёмная','Pro'], theme:'dark' },
  { id:'v10-pro-max', line:10, model:'Pro Max', name:'microOS 10 Pro Max', description:'Максимум в линейке 10.', accent:'#005A9E', tags:['Pro Max','Snap'], theme:'dark' },
  { id:'v10-ultra', line:10, model:'Ultra', name:'microOS 10 Ultra', description:'Топовая 10-я.', accent:'#00B4D8', tags:['Ultra','Неон'], theme:'dark' },
  { id:'v11-std', line:11, model:'Standard', name:'microOS 11 Standard', description:'Базовая 11-я.', accent:'#0078D4', tags:['Fluent','Radius 8'], theme:'light' },
  { id:'v11-home', line:11, model:'Home', name:'microOS 11 Home', description:'Домашняя 11-я.', accent:'#0078D4', tags:['Домашняя','Snap'], theme:'light' },
  { id:'v11-pro', line:11, model:'Pro', name:'microOS 11 Pro', description:'Профессиональная 11-я.', accent:'#0078D4', tags:['Тёмная','Fluent'], theme:'dark' },
  { id:'v11-pro-max', line:11, model:'Pro Max', name:'microOS 11 Pro Max', description:'Mica + Acrylic.', accent:'#0067C0', tags:['Pro Max','Mica'], theme:'dark' },
  { id:'v11-ultra', line:11, model:'Ultra', name:'microOS 11 Ultra', description:'Глассморфизм.', accent:'#7B68EE', tags:['Ultra','Glass'], theme:'dark' }
];

const Version = M.Version = {
  current:'v11-pro',
  load(){ this.current = U.lsGet('version','v11-pro'); if(!VERSIONS.find(v=>v.id===this.current)) this.current='v11-pro'; this.apply(); },
  get(){ return VERSIONS.find(v=>v.id===this.current) || VERSIONS[7]; },
  getId(){ return this.current; },
  set(id){ if(!VERSIONS.find(v=>v.id===id)) return; if(!License.canUseVersion(id)) return; this.current = id; U.lsSet('version',id); this.apply(); },
  apply(){
    document.documentElement.dataset.version = this.current;
    const v = this.get();
    if(v.accent){
      document.documentElement.style.setProperty('--accent', v.accent);
      const hex = v.accent.replace('#','');
      if(hex.length===6){
        const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
        document.documentElement.style.setProperty('--accent-rgb',`${r},${g},${b}`);
      }
    }
    if(M.Taskbar) M.Taskbar.render();
    if(M.StartMenu) M.StartMenu.render();
    if(M.Desktop) M.Desktop.render();
  }
};

/* ==================== SETTINGS ==================== */
const Settings = M.Settings = {
  defaults:{theme:'dark',wallpaper:'a',brightness:100},
  data:{},
  load(){ const r=U.lsGet('settings',null); this.data = Object.assign({},this.defaults,r||{}); },
  save(){ U.lsSet('settings',this.data); },
  get(k){ return this.data[k]; },
  set(k,v){ this.data[k]=v; this.save(); this.apply(); },
  apply(){
    document.documentElement.dataset.theme = this.data.theme;
  }
};

const WALLPAPERS = M.WALLPAPERS = {
  a:'radial-gradient(circle at 22% 18%,#2f7fdc 0%,#123a72 40%,#06162e 100%)',
  b:'radial-gradient(circle at 72% 28%,#8e46b8 0%,#331467 48%,#0a0620 100%)',
  c:'radial-gradient(circle at 50% 52%,#1e9078 0%,#0d4340 55%,#04191a 100%)',
  d:'radial-gradient(circle at 80% 22%,#e08a2e 0%,#7a320c 50%,#1a0a03 100%)',
  e:'radial-gradient(circle at 50% 20%,#ff6b9d 0%,#7a1a4a 55%,#1a0208 100%)',
  f:'radial-gradient(circle at 30% 70%,#00bcd4 0%,#005a6e 55%,#001a1e 100%)',
  g:'linear-gradient(135deg,#667eea 0%,#764ba2 100%)',
  h:'radial-gradient(circle at 50% 50%,#1a237e,#000 80%)'
};

function applyWallpaper(){
  const wp = document.getElementById('wallpaper');
  if(wp) wp.style.backgroundImage = WALLPAPERS[Settings.get('wallpaper')] || WALLPAPERS.a;
}

/* ==================== SYSTEM STATE ==================== */
const SystemState = M.SystemState = {
  cpu:12, ramMB:2400, ramMaxMB:8192, tempC:42, viruses:0, stability:100,
  listeners:[], tickHandle:null,
  start(){ if(this.tickHandle)return; this.tickHandle = setInterval(()=>this.tick(),800); },
  stop(){ if(this.tickHandle){ clearInterval(this.tickHandle); this.tickHandle = null; } },
  tick(){
    this.tempC += (42-this.tempC)*0.08;
    this.cpu += ((10+M.WM.wins.length*3)-this.cpu)*0.12 + (Math.random()-0.5)*4;
    this.cpu = Math.max(2, Math.min(100, this.cpu));
    this.tempC = Math.max(25, Math.min(105, this.tempC));
    this.recalcStability();
    this.emit();
  },
  recalcStability(){
    let s = 100;
    s -= Math.max(0,this.tempC-60)*0.9;
    s -= Math.max(0,this.cpu-70)*0.3;
    s -= this.viruses*9;
    this.stability = Math.max(0, Math.min(100, s));
  },
  emit(){ this.listeners.forEach(fn=>{try{fn(this);}catch(e){}}); },
  onChange(fn){ this.listeners.push(fn); }
};

/* ==================== AUDIO ==================== */
const AudioMgr = M.AudioMgr = {
  ctx:null,
  ensure(){ if(this.ctx)return true; try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); return true;}catch(e){return false;} },
  beep(f=800,d=0.1,t='square',v=0.04){
    if(!this.ensure())return;
    try{
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = t; o.frequency.value = f;
      g.gain.setValueAtTime(v, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime+d);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime+d+0.02);
    }catch(e){}
  },
  error(){ this.beep(220,0.12,'sawtooth',0.05); setTimeout(()=>this.beep(160,0.18,'sawtooth',0.05),150); },
  alert(){ this.beep(880,0.1,'square',0.05); setTimeout(()=>this.beep(660,0.1,'square',0.05),130); },
  bsod(){ this.beep(120,0.6,'sine',0.06); },
  greet(){ this.beep(660,0.15,'sine',0.05); setTimeout(()=>this.beep(880,0.2,'sine',0.05),180); setTimeout(()=>this.beep(1100,0.3,'sine',0.05),380); }
};

const WM = M.WM = {
  wins:[], zTop:100, counter:0, activeId:null,
  create(opts){
    if(WM.wins.length >= License.maxWindows()){
      ErrorMgr.dialog({title:'Лимит окон', icon:'⚠️', message:`Ваша лицензия поддерживает максимум ${License.maxWindows()} открытых окон.`});
      return null;
    }
    const id = 'w' + (++this.counter);
    const isMobile = window.innerWidth < 768;
    const W = isMobile ? window.innerWidth - 8 : Math.min(opts.width||720, window.innerWidth-40);
    const H = isMobile ? window.innerHeight - 60 : Math.min(opts.height||480, window.innerHeight-110);
    const n = this.wins.length;
    const left = isMobile ? 4 : Math.max(16, Math.round((window.innerWidth-W)/2)+(n%6)*30-75);
    const top = isMobile ? 4 : Math.max(16, Math.round((window.innerHeight-48-H)/2)+(n%6)*26-65);
    const win = U.el('div','window opening');
    if(opts.className) win.classList.add(opts.className);
    win.dataset.appId = opts.appId || '';
    win.style.cssText = `left:${left}px;top:${top}px;width:${W}px;height:${H}px`;
    const tb = U.el('div','win-tb');
    const ic = U.el('div','win-ic');
    if(opts.icon && String(opts.icon).startsWith('data:')){ const img = U.el('img'); img.src = opts.icon; ic.appendChild(img); }
    else ic.textContent = opts.icon || '🗔';
    const ti = U.el('div','win-title', opts.title || 'Окно');
    const ctr = U.el('div','win-ctr');
    const bMin = U.el('button','win-btn','─');
    const bMax = U.el('button','win-btn','□');
    const bCls = U.el('button','win-btn close','✕');
    ctr.append(bMin, bMax, bCls);
    tb.append(ic, ti, ctr);
    const body = U.el('div','win-body');
    win.append(tb, body);
    const api = {
      id, el:win, body, appId:opts.appId, title:opts.title,
      minimized:false, maximized:false, prevRect:null,
      focus:()=>this.focus(id), close:()=>this.close(id),
      minimize:()=>this.minimize(id), maximize:()=>this.maximize(id),
      setTitle:t=>{ ti.textContent = t; api.title = t; }
    };
    U.$('#windowLayer').appendChild(win);
    this.wins.push(api);
    win.addEventListener('mousedown', ()=>this.focus(id), true);
    tb.addEventListener('mousedown', e=>{ if(e.target.closest('.win-btn')) return; if(!isMobile) startDrag(e, win); });
    tb.addEventListener('dblclick', e=>{ if(e.target.closest('.win-btn')) return; this.maximize(id); });
    bMin.addEventListener('click', e=>{ e.stopPropagation(); this.minimize(id); });
    bMax.addEventListener('click', e=>{ e.stopPropagation(); this.maximize(id); });
    bCls.addEventListener('click', e=>{ e.stopPropagation(); this.close(id); });
    this.focus(id);
    setTimeout(()=>win.classList.remove('opening'), 240);
    M.Taskbar.render();
    if(typeof opts.build === 'function') opts.build(body, api);
    return api;
  },
  focus(id){
    const w = this.wins.find(x=>x.id===id); if(!w) return;
    if(w.minimized) this.restore(id);
    this.activeId = id; this.zTop++;
    w.el.style.zIndex = this.zTop;
    this.wins.forEach(x=>x.el.classList.toggle('active', x.id===id));
    M.Taskbar.render();
  },
  close(id){
    const i = this.wins.findIndex(x=>x.id===id); if(i<0) return;
    const w = this.wins[i];
    w.el.classList.add('closing');
    setTimeout(()=>{
      try{ if(w._cleanup) w._cleanup(); }catch(e){}
      w.el.remove();
      this.wins.splice(i, 1);
      if(this.activeId === id){
        const next = this.wins.filter(x=>!x.minimized).pop();
        this.activeId = next ? next.id : null;
        if(next) this.focus(next.id);
      }
      M.Taskbar.render();
    }, 200);
  },
  minimize(id){
    const w = this.wins.find(x=>x.id===id); if(!w) return;
    w.minimized = true; w.el.classList.add('minimized');
    if(this.activeId === id){
      const next = this.wins.filter(x=>!x.minimized && x.id!==id).pop();
      this.activeId = next ? next.id : null;
      if(next) this.focus(next.id);
    }
    M.Taskbar.render();
  },
  restore(id){ const w = this.wins.find(x=>x.id===id); if(w){ w.minimized = false; w.el.classList.remove('minimized'); } },
  maximize(id){
    const w = this.wins.find(x=>x.id===id); if(!w) return;
    if(w.maximized){
      const r = w.prevRect;
      w.el.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
      w.maximized = false;
    } else {
      w.prevRect = { left:parseFloat(w.el.style.left), top:parseFloat(w.el.style.top), width:parseFloat(w.el.style.width), height:parseFloat(w.el.style.height) };
      w.el.style.cssText = `left:0;top:0;width:${window.innerWidth}px;height:${window.innerHeight - 48}px`;
      w.maximized = true;
    }
    this.focus(id);
  },
  findApp(appId){ return this.wins.find(w=>w.appId === appId); }
};

function startDrag(e, win){
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY;
  const sl = parseFloat(win.style.left), st = parseFloat(win.style.top);
  const move = ev=>{
    win.style.left = (sl + ev.clientX - sx) + 'px';
    win.style.top = Math.max(0, st + ev.clientY - sy) + 'px';
  };
  const up = ()=>{ document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

const FS = M.FS = {
  root:null, trash:[],
  load(){ this.root = U.lsGet('fs',null); this.trash = U.lsGet('trash',[]); if(!this.root) this.reset(); },
  reset(){
    this.root = { name:'microOS', type:'folder', children:[
      { name:'Рабочий стол', type:'folder', children:[] },
      { name:'Документы', type:'folder', children:[{name:'readme.txt', type:'file', content:'Добро пожаловать в microOS!'}] },
      { name:'Загрузки', type:'folder', children:[] },
      { name:'Изображения', type:'folder', children:[] },
      { name:'Музыка', type:'folder', children:[] }
    ]};
    this.trash = []; this.save();
  },
  save(){ U.lsSet('fs', this.root); },
  saveTrash(){ U.lsSet('trash', this.trash); },
  resolve(path){ let n = this.root; for(const p of path){ if(!n.children) return null; n = n.children.find(c=>c.name===p); if(!n) return null; } return n; },
  mkdir(path, name){ const p = this.resolve(path); if(!p || p.children.some(c=>c.name===name)) return false; p.children.push({name, type:'folder', children:[]}); this.save(); return true; },
  writeFile(path, name, content){ const p = this.resolve(path); if(!p) return false; const ex = p.children.find(c=>c.name===name); if(ex){ if(ex.type!=='file') return false; ex.content = content; } else p.children.push({name, type:'file', content}); this.save(); return true; },
  readFile(path){ const n = this.resolve(path); return n && n.type==='file' ? n.content : null; },
  remove(path){ if(!path.length) return false; const parent = this.resolve(path.slice(0,-1)); if(!parent) return false; const idx = parent.children.findIndex(c=>c.name===path[path.length-1]); if(idx<0) return false; const [node] = parent.children.splice(idx,1); this.trash.push({node, from:path.slice(0,-1), at:Date.now()}); this.save(); this.saveTrash(); return true; }
};

/* ==================== FILE PARSERS ==================== */
const APKParser = M.APKParser = {
  async parse(file){
    const r = { fileName:file.name, fileSize:file.size, kind:'apk', packageName:null, versionName:null, appLabel:null, permissions:[], activities:[], icon:null, strings:{}, layouts:[], drawables:[], assets:[], warnings:[] };
    if(typeof JSZip === 'undefined'){ r.warnings.push('JSZip не загружен'); return r; }
    let zip;
    try{ zip = await JSZip.loadAsync(file); }catch(e){ r.warnings.push('Не ZIP: '+e.message); return r; }
    const mfFile = zip.file('AndroidManifest.xml');
    if(mfFile){
      try{
        const buf = await mfFile.async('arraybuffer');
        const text16 = new TextDecoder('utf-16le',{fatal:false}).decode(buf);
        const text8 = new TextDecoder('utf-8',{fatal:false}).decode(buf);
        const text = text16 + '\n' + text8;
        const pkgMatch = text.match(/([a-z][a-z0-9_]*\.){2,}[a-zA-Z][a-zA-Z0-9_]*/);
        if(pkgMatch) r.packageName = pkgMatch[0];
        const verMatches = text.match(/(\d+\.\d+(?:\.\d+)?)/g);
        if(verMatches){ const sorted = [...new Set(verMatches)].sort((a,b)=>b.length-a.length); if(sorted[0]) r.versionName = sorted[0]; }
        const perms = [...new Set(text.match(/android\.permission\.[A-Z_][A-Z0-9_]+/g) || [])];
        r.permissions = perms;
        const actRe = /(?:activity|\.Activity)[^a-zA-Z]*([a-z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)+)/g;
        let m; const acts = new Set();
        while((m = actRe.exec(text)) !== null){
          if(!m[1].startsWith('android.') && m[1].length < 100) acts.add(m[1]);
        }
        r.activities = [...acts].slice(0, 20);
      }catch(e){ r.warnings.push('Manifest: '+e.message); }
    } else { r.warnings.push('AndroidManifest.xml не найден'); }
    const iconPaths = Object.keys(zip.files).filter(f=>/^res\/mipmap/i.test(f) && /\.(png|webp|jpg)$/i.test(f));
    const iconData = [];
    for(const p of iconPaths){
      try{ const data = await zip.file(p).async('uint8array'); iconData.push({path:p, size:data.length, data}); }catch(e){}
    }
    iconData.sort((a,b)=>b.size-a.size);
    if(iconData.length){
      const largest = iconData[0];
      let binary = ''; for(let i=0; i<largest.data.length; i++) binary += String.fromCharCode(largest.data[i]);
      const ext = largest.path.split('.').pop().toLowerCase();
      const mime = ext === 'webp' ? 'image/webp' : ext === 'jpg' ? 'image/jpeg' : 'image/png';
      r.icon = `data:${mime};base64,${btoa(binary)}`;
    }
    // Strings
    const stringFiles = Object.keys(zip.files).filter(f=>/^res\/values[^/]*\/strings\.xml$/i.test(f));
    for(const sf of stringFiles){
      try{
        const xml = await zip.file(sf).async('string');
        const re = /<string[^>]*name="([^"]+)"[^>]*>([^<]*)<\/string>/g;
        let m;
        while((m = re.exec(xml)) !== null){ if(!r.strings[m[1]]) r.strings[m[1]] = m[2]; }
      }catch(e){}
    }
    if(r.strings.app_name) r.appLabel = r.strings.app_name;
    r.layouts = Object.keys(zip.files).filter(f=>/^res\/layout[^/]*\/.*\.xml$/i.test(f)).slice(0, 30);
    r.drawables = Object.keys(zip.files).filter(f=>/^res\/drawable[^/]*\/.*\.(png|jpg|webp|xml)$/i.test(f)).slice(0, 30);
    r.assets = Object.keys(zip.files).filter(f=>/^assets\//.test(f) && !zip.files[f].dir).slice(0, 50);
    return r;
  }
};

const PEParser = M.PEParser = {
  async parse(file){
    const r = { fileName:file.name, fileSize:file.size, kind:'exe', isMZ:false, isPE:false, machine:null, subsystem:null, sections:[], warnings:[] };
    try{
      const buf = await file.slice(0, 4096).arrayBuffer();
      const dv = new DataView(buf);
      const bytes = new Uint8Array(buf);
      if(bytes[0] !== 0x4D || bytes[1] !== 0x5A){ r.warnings.push('Не MZ (не EXE)'); return r; }
      r.isMZ = true;
      if(buf.byteLength < 0x40){ r.warnings.push('Слишком мал'); return r; }
      const peOffset = dv.getUint32(0x3C, true);
      if(peOffset + 4 > buf.byteLength){ r.warnings.push('PE за пределами'); return r; }
      if(bytes[peOffset] !== 0x50 || bytes[peOffset+1] !== 0x45){ r.warnings.push('Нет подписи PE'); return r; }
      r.isPE = true;
      const coffOff = peOffset + 4;
      if(coffOff + 20 <= buf.byteLength){
        const machine = dv.getUint16(coffOff, true);
        const numSections = dv.getUint16(coffOff+2, true);
        const timeDateStamp = dv.getUint32(coffOff+4, true);
        const machines = {0x14C:'x86', 0x8664:'x64', 0xAA64:'ARM64', 0x1C0:'ARM'};
        r.machine = machines[machine] || '0x'+machine.toString(16);
        r.numSections = numSections;
        r.timeDateStamp = new Date(timeDateStamp*1000).toISOString();
        const optOff = coffOff + 20;
        if(optOff + 68 <= buf.byteLength){
          const subsystem = dv.getUint16(optOff+68, true);
          const subsystems = {1:'Native', 2:'Windows GUI', 3:'Windows Console', 5:'OS/2', 7:'POSIX', 9:'Windows CE'};
          r.subsystem = subsystems[subsystem] || subsystem;
        }
        const sectOff = coffOff + 20 + (dv.getUint16(coffOff+16, true));
        for(let i=0; i<Math.min(numSections, 20); i++){
          const off = sectOff + i*40;
          if(off+40 > buf.byteLength) break;
          const nameBytes = new Uint8Array(buf, off, 8);
          let name = '';
          for(const b of nameBytes){ if(b===0) break; name += String.fromCharCode(b); }
          const vSize = dv.getUint32(off+8, true);
          const rSize = dv.getUint32(off+16, true);
          r.sections.push({name, virtualSize:vSize, rawSize:rSize});
        }
      }
    }catch(e){ r.warnings.push('Ошибка: '+e.message); }
    return r;
  }
};

const DIOParser = M.DIOParser = {
  async parse(file){
    const r = { fileName:file.name, fileSize:file.size, kind:'dio', manifest:null, warnings:[] };
    try{ r.manifest = JSON.parse(await file.text()); }catch(e){ r.warnings.push('Невалидный JSON: '+e.message); }
    return r;
  }
};

function detectTemplate(app){
  const pkg = (app.manifest && app.manifest.package) || app.packageName || '';
  const name = (app.name||'').toLowerCase();
  const file = (app.execName||'').toLowerCase();
  const all = (pkg + ' ' + name + ' ' + file).toLowerCase();
  if(/telegram|org\.telegram/.test(all)) return Templates.telegram;
  if(/whatsapp|com\.whatsapp/.test(all)) return Templates.whatsapp;
  if(/youtube|com\.google\.android\.youtube/.test(all)) return Templates.youtube;
  if(/instagram|com\.instagram/.test(all)) return Templates.instagram;
  if(/vkontakte|vk\.com|com\.vkontakte/.test(all)) return Templates.vk;
  if(/tiktok|musically|zhiliaoapp/.test(all)) return Templates.tiktok;
  return Templates.universal;
}

const VM = M.VM = {
  sessions:new Map(),
  async open(appId){
    const numericId = String(appId).startsWith('inst_') ? parseInt(appId.slice(5),10) : appId;
    const app = await DB.getApp(numericId);
    if(!app){ ErrorMgr.dialog({title:'Ошибка', icon:'❌', message:'Приложение не найдено'}); return; }
    if(VM.sessions.size >= License.maxVMs()){
      ErrorMgr.dialog({title:'Лимит ВМ', icon:'⚠️', message:`Ваша лицензия поддерживает максимум ${License.maxVMs()} одновременных приложений.`});
      return;
    }
    const existing = WM.findApp('vm_' + numericId);
    if(existing){ WM.focus(existing.id); return; }

    app.runCount = (app.runCount||0) + 1;
    await DB.updateApp(app).catch(()=>{});

    const template = detectTemplate(app);
    const session = { appId:numericId, app, startTime:Date.now() };
    VM.sessions.set(numericId, session);

    const win = WM.create({
      appId:'vm_' + numericId,
      title:app.name,
      icon:app.icon,
      width:900,
      height:640,
      build:(body,api)=>{
        body.style.cssText = 'padding:0;overflow:hidden;display:flex;flex-direction:column';
        Promise.resolve(template.render(body, app)).catch(e=>{
          console.error(e);
          body.innerHTML = '<div style="padding:30px;text-align:center;color:var(--dim)">Ошибка: '+U.esc(e.message)+'</div>';
        });
        api._cleanup = ()=>{ VM.sessions.delete(numericId); };
      }
    });
    if(win) win._cleanup = ()=>{ VM.sessions.delete(numericId); };
  }
};

const Installer = M.Installer = {
  async start(file){
    const ext = file.name.split('.').pop().toLowerCase();
    let parsed;
    if(ext === 'apk') parsed = await APKParser.parse(file);
    else if(ext === 'exe' || ext === 'msi') parsed = await PEParser.parse(file);
    else if(ext === 'dio') parsed = await DIOParser.parse(file);
    else { alert('Неподдерживаемый тип: .' + ext + '\n\nПоддерживаются: .apk, .exe, .msi, .dio'); return; }
    if(ext === 'apk'){
      parsed.displayName = parsed.appLabel || parsed.packageName || file.name.replace('.apk','');
      parsed.displayVersion = parsed.versionName || '1.0';
      parsed.displayPublisher = parsed.packageName ? parsed.packageName.split('.').slice(0,2).join('.') : 'Неизвестный';
    } else if(ext === 'exe' || ext === 'msi'){
      parsed.displayName = file.name.replace(/\.(exe|msi)$/i,'');
      parsed.displayVersion = '1.0';
      parsed.displayPublisher = 'Неизвестный';
    } else {
      const m = parsed.manifest || {};
      parsed.displayName = m.name || file.name.replace('.dio','');
      parsed.displayVersion = m.version || '1.0';
      parsed.displayPublisher = m.publisher || 'microOS';
      parsed.icon = m.icon || null;
    }
    parsed.file = file;
    this.preview(parsed);
  },
  preview(parsed){
    const ov = U.el('div','inst-overlay');
    const dlg = U.el('div','inst-dialog');
    const head = U.el('div','inst-head');
    head.innerHTML = '<div class="em">'+(parsed.kind==='apk'?'🤖':parsed.kind==='exe'?'💻':'💠')+'</div><h3>Установка — '+U.esc(parsed.fileName)+'</h3>';
    const body = U.el('div','inst-body');
    const fileInfo = U.el('div','inst-file');
    const iconBox = U.el('div','icon');
    if(parsed.icon){ const img = U.el('img'); img.src = parsed.icon; iconBox.appendChild(img); }
    else iconBox.textContent = parsed.kind === 'apk' ? '🤖' : parsed.kind === 'exe' ? '💻' : '💠';
    const meta = U.el('div','meta');
    meta.innerHTML = `<div class="nm">${U.esc(parsed.displayName)}</div><div class="sub">Версия: <b>${U.esc(parsed.displayVersion)}</b></div><div class="sub">Издатель: <b>${U.esc(parsed.displayPublisher)}</b></div><div class="sub">Размер: <b>${U.fmtSize(parsed.fileSize)}</b></div><div class="sub">Тип: <b>${parsed.kind.toUpperCase()}</b></div>`;
    fileInfo.append(iconBox, meta);
    body.appendChild(fileInfo);
    if(parsed.warnings && parsed.warnings.length){
      const w = U.el('div');
      w.style.cssText = 'padding:8px 12px;background:rgba(243,156,18,.1);border:1px solid rgba(243,156,18,.3);border-radius:6px;font-size:11.5px;color:#f39c12;margin-bottom:12px';
      w.innerHTML = '⚠️ ' + parsed.warnings.map(U.esc).join('<br>⚠️ ');
      body.appendChild(w);
    }
    body.innerHTML += '<div style="font-size:12px;color:var(--dim);margin-top:12px;padding:10px;background:rgba(var(--accent-rgb),.08);border-left:3px solid var(--accent);border-radius:4px">ℹ️ Приложение будет установлено. При запуске откроется рабочий интерфейс.</div>';
    const foot = U.el('div','inst-foot');
    const cancel = U.el('button',null,'Отмена');
    const install = U.el('button','primary','Установить');
    foot.append(cancel, install);
    dlg.append(head, body, foot);
    ov.appendChild(dlg);
    document.body.appendChild(ov);
    cancel.addEventListener('click', ()=>ov.remove());
    install.addEventListener('click', ()=>{ ov.remove(); this.doInstall(parsed); });
  },
  async doInstall(parsed){
    const ov = U.el('div','inst-overlay');
    const dlg = U.el('div','inst-dialog');
    dlg.innerHTML = '<div class="inst-head"><div class="em">⚙️</div><h3>Установка…</h3></div>';
    const body = U.el('div','inst-body');
    const pb = U.el('div','inst-progress');
    const fill = U.el('div'); pb.appendChild(fill);
    const status = U.el('div','', 'Сохранение…');
    status.style.cssText = 'font-size:12px;color:var(--dim);text-align:center;margin-top:8px';
    body.append(pb, status);
    dlg.appendChild(body);
    ov.appendChild(dlg);
    document.body.appendChild(ov);
    try{
      fill.style.width = '30%';
      const fileId = await DB.addFile({ name:parsed.fileName, size:parsed.fileSize, kind:parsed.kind, blob:parsed.file, createdAt:Date.now() });
      fill.style.width = '70%';
      status.textContent = 'Регистрация…';
      const appRec = {
        name:parsed.displayName, version:parsed.displayVersion, publisher:parsed.displayPublisher,
        kind:parsed.kind, icon:parsed.icon, fileId, fileName:parsed.fileName, fileSize:parsed.fileSize,
        packageName:parsed.packageName || null,
        permissions:parsed.permissions || [], activities:parsed.activities || [],
        strings:parsed.strings || {}, layouts:parsed.layouts || [], drawables:parsed.drawables || [], assets:parsed.assets || [],
        manifest:parsed.manifest || null,
        peInfo:parsed.kind === 'exe' ? { isPE:parsed.isPE, machine:parsed.machine, subsystem:parsed.subsystem, sections:parsed.sections } : null,
        installedAt:Date.now(), runCount:0
      };
      const appId = await DB.addApp(appRec);
      fill.style.width = '100%';
      status.textContent = 'Готово!';
      await new Promise(r=>setTimeout(r, 300));
      ov.remove();
      await Boot.registerInstalledApp(appId, appRec);
      Notify.push('✅ Установлено', parsed.displayName, '📦');
      if(confirm('Открыть приложение сейчас?')) VM.open('inst_' + appId);
    }catch(e){
      console.error(e);
      ov.remove();
      alert('Ошибка установки: '+e.message);
    }
  }
};

Apps.register({ id:'calculator', name:'Калькулятор', icon:'🧮', pinned:true, open(){
  openApp('calculator','Калькулятор','🧮',340,540,(b)=>{
    b.classList.add('calc');
    const disp = U.el('div','calc-disp','0');
    const tabs = U.el('div','calc-tabs');
    let mode = 'std';
    ['Стандарт','Научный'].forEach((n,i)=>{
      const t = U.el('button',i===0?'on':'',n);
      t.addEventListener('click', ()=>{ mode = i===0?'std':'sci'; U.$$('button',tabs).forEach((x,idx)=>x.classList.toggle('on', idx===i)); buildKeys(); });
      tabs.appendChild(t);
    });
    const keys = U.el('div','calc-keys std');
    b.append(tabs, disp, keys);
    let expr = '', lastResult = null;
    function buildKeys(){
      keys.innerHTML = '';
      keys.className = 'calc-keys ' + mode;
      const list = mode === 'sci'
        ? ['C','(','(',')','/','√','sin','cos','tan','^','7','8','9','*','log','4','5','6','-','ln','1','2','3','+','π','0','.','⌫','=','e']
        : ['C','(','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','⌫','='];
      // уникальные по 4 колонки для std, 5 для sci
      const unique = [...new Set(list)];
      const std = ['C','(','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','⌫','='];
      const finalList = mode === 'sci' ? ['C','(','(',')','/','√','sin','cos','tan','^','7','8','9','*','log','4','5','6','-','ln','1','2','3','+','π','0','.','⌫','=','e'] : std;
      finalList.forEach(k => {
        const btn = U.el('button','ckey' + ('+-*/'.includes(k)?' op':'') + (k==='='?' eq':''), k);
        btn.addEventListener('click', ()=>press(k));
        keys.appendChild(btn);
      });
    }
    function press(tok){
      if(tok === 'C'){ expr = ''; disp.textContent = '0'; return; }
      if(tok === '⌫'){ expr = expr.slice(0,-1); disp.textContent = expr || '0'; return; }
      if(tok === '='){
        try{
          const clean = expr.replace(/sqrt/g,'Math.sqrt').replace(/sin/g,'Math.sin').replace(/cos/g,'Math.cos').replace(/tan/g,'Math.tan').replace(/log/g,'Math.log10').replace(/ln/g,'Math.log').replace(/π/g,'Math.PI').replace(/e(?!x)/g,'Math.E').replace(/\^/g,'**');
          const r = Function('"use strict";return ('+clean+')')();
          if(!isFinite(r)) throw new Error('div by zero');
          expr = String(r); disp.textContent = expr; lastResult = r;
        }catch(e){ disp.textContent = 'Ошибка'; expr = ''; }
        return;
      }
      if(tok === '√'){ expr += 'sqrt('; disp.textContent = expr; return; }
      if(tok === 'π'){ expr += 'π'; disp.textContent = expr; return; }
      if(tok === 'e'){ expr += 'e'; disp.textContent = expr; return; }
      expr += tok;
      disp.textContent = expr;
    }
    buildKeys();
  });
}});

Apps.register({ id:'terminal', name:'Терминал', icon:'⌨️', pinned:true, open(){
  openApp('terminal','Терминал','⌨️',760,460,(b)=>{
    const term = U.el('div','term');
    b.appendChild(term);
    const write = (t,c)=>{ const l = U.el('div','line'+(c?' '+c:''), t); term.appendChild(l); term.scrollTop = term.scrollHeight; };
    const prompt = ()=>{
      const line = U.el('div','line');
      line.innerHTML = '<span class="prompt">microOS&gt; </span>';
      const inp = U.el('input');
      inp.style.cssText = 'background:transparent;border:none;color:#ccc;font-family:inherit;font-size:13px;padding:0;width:70%;outline:none';
      line.appendChild(inp);
      term.appendChild(line); term.scrollTop = term.scrollHeight;
      inp.focus();
      inp.addEventListener('keydown', e=>{
        if(e.key === 'Enter'){
          const cmd = inp.value;
          inp.disabled = true;
          write('microOS> '+cmd);
          run(cmd);
          prompt();
        }
      });
    };
    const run = (raw)=>{
      const parts = raw.trim().split(/\s+/);
      const cmd = parts[0].toLowerCase();
      const arg = parts.slice(1).join(' ');
      switch(cmd){
        case '': break;
        case 'help':
          write('Команды:','ok');
          ['help','apps','info <id>','open <id>','uninstall <id>','su disasters','cls','date','time','whoami','license','exit'].forEach(c=>write('  '+c));
          break;
        case 'apps':
          write('Установленные:','ok');
          DB.getAllApps().then(list=>{
            if(!list.length){ write('  <пусто>'); return; }
            list.forEach(a=>write('  ['+a.id+'] '+a.name+' ('+a.kind+') v'+a.version));
          });
          break;
        case 'info':
          if(!arg){ write('Укажите ID','err'); break; }
          DB.getApp(parseInt(arg)).then(a=>{
            if(!a){ write('Не найдено','err'); return; }
            write('Имя: '+a.name, 'ok');
            write('Версия: '+a.version);
            write('Издатель: '+a.publisher);
            write('Тип: '+a.kind);
            write('Package: '+(a.packageName||'—'));
            write('Размер: '+U.fmtSize(a.fileSize));
          });
          break;
        case 'open':
          if(!arg){ write('Укажите ID','err'); break; }
          VM.open('inst_'+arg);
          write('Открываю '+arg, 'ok');
          break;
        case 'uninstall':
          if(!arg){ write('Укажите ID','err'); break; }
          Boot.uninstallApp('inst_'+arg);
          write('Удалено', 'ok');
          break;
        case 'su':
          if(arg === 'disasters'){
            if(!License.canUseDisasters()){ write('Требуется админ-лицензия','err'); break; }
            M.Disasters.toggle();
            write(M.Disasters.isMounted()?'🔓 Панель активна':'🔒 Панель скрыта','ok');
          } else write('Неверный пароль','err');
          break;
        case 'license':
          write('Лицензия: '+License.getLabel(), 'ok');
          write('Ключ: '+(License.key ? License.key.slice(0,10)+'...' : '—'));
          break;
        case 'cls': term.innerHTML = ''; break;
        case 'date': write(new Date().toLocaleDateString('ru-RU')); break;
        case 'time': write(new Date().toLocaleTimeString('ru-RU')); break;
        case 'whoami': write('Пользователь'); break;
        case 'exit': WM.close(WM.activeId); break;
        default: write('Неизвестно: '+cmd+'. Введите help','err');
      }
    };
    write('microOS Terminal v3.0','ok');
    write('Лицензия: '+License.getLabel());
    write('Введите help.');
    write('');
    prompt();
  });
}});

Apps.register({ id:'paint', name:'Paint', icon:'🎨', pinned:true, open(){
