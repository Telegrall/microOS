const InstallerDialog = M.InstallerDialog = {
  current:null, autoRunVM: false,
  async start(file){
    const info = await FileRecognizer.recognize(file);
    this.current = info;
    this.step1();
  },
  step1(){
    const f = this.current;
    const ov=U.el('div','inst-overlay'); const dlg=U.el('div','inst-dialog');
    const head=U.el('div','inst-head');
    const emEl=U.el('div','em');
    if(f.icon && f.icon.startsWith('data:')){ const img=U.el('img'); img.src=f.icon; img.style.cssText='width:40px;height:40px;border-radius:8px'; emEl.appendChild(img); }
    else emEl.textContent = f.icon || '📦';
    head.append(emEl,U.el('h3',null,'Установка приложения'));
    const body=U.el('div','inst-body');
    const fi=U.el('div','inst-file-info');
    const iconBox=U.el('div','em');
    if(f.icon && f.icon.startsWith('data:')){ const img=U.el('img'); img.src=f.icon; img.style.cssText='width:64px;height:64px;border-radius:12px'; iconBox.appendChild(img); }
    else iconBox.textContent = f.icon || '📦';
    fi.appendChild(iconBox);
    const meta=U.el('div','meta');
    meta.append(U.el('div','nm',f.name),U.el('div','sub','Версия '+f.version),U.el('div','sub','Издатель: '+f.publisher),U.el('div','sub','Размер: '+FileTypeHandler.formatSize(f.size)),U.el('div','sub','Тип: '+(f.type==='android'?'Android APK':f.type==='program'?'Windows EXE':f.type==='dio'?'microOS .dio':f.type)));
    const sig=U.el('div','sub');
    sig.classList.add(f.publisher!=='Неизвестный разработчик'?'sig-ok':'sig-bad');
    sig.textContent = f.publisher!=='Неизвестный разработчик'?'✅ Подписано':'⚠️ Не подписано';
    meta.appendChild(sig);
    if(f.warnings && f.warnings.length){ const warn=U.el('div','sub','✓ '+f.warnings.join(' · ')); warn.style.color='#2ecc71'; meta.appendChild(warn); }
    fi.appendChild(meta); body.appendChild(fi);
    const notice=U.el('div',null,'Приложение будет установлено в microOS и запущено в виртуальной машине.');
    notice.style.cssText='font-size:12px;color:var(--dim);padding:4px 0';
    body.appendChild(notice);
    // Checkbox для авто-запуска в ВМ
    const checkRow = U.el('label','checkbox-row');
    const checkInput = U.el('input'); checkInput.type = 'checkbox'; checkInput.checked = true;
    checkRow.append(checkInput, U.el('span',null,'🚀 Запустить в виртуальной машине сразу после установки'));
    body.appendChild(checkRow);
    this.autoRunVM = true;
    checkInput.addEventListener('change', ()=>{ this.autoRunVM = checkInput.checked; });
    
    const foot=U.el('div','inst-foot');
    const cancel=U.el('button',null,'Отмена'); const next=U.el('button','primary','Установить');
    cancel.addEventListener('click',()=>{ ov.remove(); this.current=null; });
    next.addEventListener('click',()=>{ ov.remove(); this.step2(); });
    foot.append(cancel,next);
    dlg.append(head,body,foot); ov.appendChild(dlg); document.body.appendChild(ov);
  },
  step2(){
    const f = this.current;
    if(M.IncidentMgr._corruptInstaller && Math.random()<0.7) return this.fail('Файл повреждён.','0x80070570');
    if(M.IncidentMgr.has('virusInstall') && Math.random()<0.7) return this.fail('Обнаружена угроза Trojan.','0x800704EC');
    if(M.IncidentMgr.has('antivirusBlock') || M.IncidentMgr._antivirusBlock) return this.fail('Defender заблокировал.','0x800704EC');
    if(f.type==='program' || f.type==='android'){ ErrorMgr.uacPrompt({ signed: f.publisher!=='Неизвестный разработчик', name:f.name, publisher:f.publisher, onAllow:()=>this.step3(), onDeny:()=>this.fail('Отменено.',null) }); }
    else this.step3();
  },
  step3(){
    const f = this.current;
    const ov=U.el('div','inst-overlay'); const dlg=U.el('div','inst-dialog');
    const head=U.el('div','inst-head'); head.append(U.el('div','em','⚙️'),U.el('h3',null,'Установка…'));
    const body=U.el('div','inst-body');
    const prog=U.el('div','inst-progress'); const fill=U.el('div'); prog.appendChild(fill);
    const pct=U.el('div','inst-pct','0%');
    body.append(prog,pct);
    dlg.append(head,body); ov.appendChild(dlg); document.body.appendChild(ov);
    let p=0;
    const int=setInterval(()=>{
      p+=U.rand(5,14); if(p>100) p=100;
      fill.style.width=p+'%'; pct.textContent=Math.floor(p)+'%';
      if(p>=100){ clearInterval(int); ov.remove(); if(Math.random()<0.2){ const types=['diskFull','corrupt','access']; const t=types[Math.floor(Math.random()*types.length)]; const errs={diskFull:['Мало места.','0x80070070'],corrupt:['Файл повреждён.','0x80070570'],access:['Доступ запрещён.','0x80070005']}; return this.fail(errs[t][0],errs[t][1]); } this.finishSuccess(); }
    },200);
  },
  async finishSuccess(){
    const f = this.current;
    try{
      const fileId = await DB.addFile({name:f.file.name,path:'C:\\Users\\'+UserSession.name+'\\Downloads\\'+f.file.name,type:f.type,size:f.size,blob:f.file,createdAt:Date.now()});
      const appId = await DB.addApp({name:f.name,execName:f.file.name,icon:f.icon||'📦',version:f.version,publisher:f.publisher,installPath:'C:\\Program Files\\'+f.name,entryFile:fileId,manifest:f.manifest,installedAt:Date.now(),runCount:0,size:f.size,appType:f.type});
      await DB.addLog({timestamp:Date.now(),action:'install',appName:f.name,status:'success'});
      M.Boot.registerInstalledApp({id:appId, name:f.name, icon:f.icon, version:f.version, publisher:f.publisher, entryFile:fileId, appType:f.type, manifest:f.manifest, installedAt:Date.now(), size:f.size});
      Desktop.addInstalledIcon('inst_'+appId, f.name, f.icon||'📦');
      M.Taskbar.render(); M.StartMenu.render();
      
      const autoRun = this.autoRunVM;
      this.success(f.name, appId, autoRun);
    }catch(e){ console.error(e); this.fail('Ошибка: '+e.message, null); }
  },
  fail(msg,code){ 
    const ov=U.el('div','inst-overlay'); const dlg=U.el('div','inst-dialog');
    dlg.innerHTML='<div class="inst-head"><div class="em">❌</div><h3>Установка не удалась</h3></div><div class="inst-body"><div class="inst-result"><div class="em">⚠️</div><h3>'+msg+'</h3>'+(code?'<p>Код: '+code+'</p>':'')+'</div></div>';
    const foot = U.el('div','inst-foot');
    const btn = U.el('button','primary','Закрыть');
    btn.addEventListener('click', ()=>ov.remove());
    foot.appendChild(btn);
    dlg.appendChild(foot);
    ov.appendChild(dlg); document.body.appendChild(ov);
    this.current=null;
  },
  success(name, appId, autoRun){ 
    const ov=U.el('div','inst-overlay'); const dlg=U.el('div','inst-dialog');
    dlg.innerHTML='<div class="inst-head"><div class="em">✅</div><h3>Установка завершена</h3></div><div class="inst-body"><div class="inst-result"><div class="em">🎉</div><h3>'+name+' установлено</h3><p>Приложение добавлено на рабочий стол и в меню Пуск.</p></div></div>';
    const foot = U.el('div','inst-foot');
    const closeBtn = U.el('button',null,'Закрыть');
    closeBtn.addEventListener('click', ()=>ov.remove());
    const runVM = U.el('button','primary','🚀 Запустить в ВМ');
    runVM.addEventListener('click', ()=>{ ov.remove(); VirtualMachine.openWindow('inst_'+appId); });
    foot.append(closeBtn, runVM);
    dlg.appendChild(foot);
    ov.appendChild(dlg); document.body.appendChild(ov);
    Notify.push('✅ Установлено',name,'📦');
    this.current=null;
    if(autoRun){
      setTimeout(()=>VirtualMachine.openWindow('inst_'+appId), 500);
    }
  }
};

M.installFile = async function(file){
  const info = await FileRecognizer.recognize(file);
  if(info.type === 'program' || info.type === 'android' || info.type === 'dio'){ return InstallerDialog.start(file); }
  const fileId = await DB.addFile({name:file.name,path:'C:\\Users\\'+UserSession.name+'\\Downloads\\'+file.name,type:info.type,size:file.size,blob:file,createdAt:Date.now()});
  Notify.push('Файл',file.name+' сохранён','📥');
  M.Boot.openStoredFile(fileId);
};

const ControlPanel = M.ControlPanel = {
  mounted:false, collapsed:false, showIndicators:true, collapsedCats:new Set(), search:'',
  isMounted(){ return this.mounted; },
  mount(){
    if(this.mounted) return;
    const panel = document.createElement('div');
    panel.id = 'controlPanel';
    panel.innerHTML = '<div id="cpHeader"><div id="cpStatus"></div><h3>Панель управления</h3><button id="cpToggle">⟩</button></div><div id="cpSearchWrap"><input type="text" id="cpSearch" placeholder="🔍 Поиск сбоя…"></div><div id="cpBody"></div>';
    document.body.appendChild(panel);
    this.mounted = true;
    U.lsSet('controlPanelVisible', true);
    this.init();
  },
  unmount(){ const p = U.$('#controlPanel'); if(p) p.remove(); this.mounted = false; U.lsSet('controlPanelVisible', false); },
  toggle(){ if(this.mounted) this.unmount(); else this.mount(); },
  init(){ this.render(); this.bind(); if(!this._listenerAdded){ SystemState.onChange(()=>{ if(this.mounted) this.updateIndicators(); }); this._listenerAdded = true; } this.updateIndicators(); },
  render(){ const b = U.$('#cpBody'); if(!b) return; b.innerHTML = '<div class="cp-card" id="cpMetrics"></div><div class="cp-section-title">Происшествия</div><div id="cpIncidents"></div><div class="cp-section-title">Управление</div><div class="cp-grid" id="cpCtrl"></div>'; this.renderMetrics(); this.renderIncidents(); this.renderControls(); },
  renderIncidents(){
    const wrap = U.$('#cpIncidents'); if(!wrap) return; wrap.innerHTML = '';
    Object.keys(CATEGORIES).forEach(catId=>{

    const up = ()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); if(dragging){ this.positions[key] = {x:parseFloat(d.style.left), y:parseFloat(d.style.top)}; U.lsSet('iconPos', this.positions); } };

function CalcEval(s){
  s = String(s).replace(/\s+/g,''); let i = 0;
  const num = ()=>{ let t=''; while(i<s.length&&/[0-9.]/.test(s[i])) t+=s[i++]; if(!t) throw new Error(); return parseFloat(t); };
  const atom = ()=>{ if(s[i]==='('){ i++; const v=expr(); if(s[i]===')')i++; return v; } if(s[i]==='-'){ i++; return -atom(); } return num(); };
  const power = ()=>{ let v=atom(); if(s[i]==='^'){ i++; v=Math.pow(v,power()); } return v; };
  const term = ()=>{ let v=power(); while(s[i]==='*'||s[i]==='/'){ const op=s[i++]; const r=power(); if(op==='*') v*=r; else{ if(r===0)throw new Error(); v/=r; } } return v; };
  const expr = ()=>{ let v=term(); while(s[i]==='+'||s[i]==='-'){ const op=s[i++]; const r=term(); v = op==='+'?v+r:v-r; } return v; };
  const r = expr(); if(i<s.length) throw new Error(); return r;
}
Apps.register({id:'calculator',name:'Калькулятор',icon:'🧮',pinned:true,open(){
  const win = WM.create({appId:'calculator',title:'Калькулятор',icon:'🧮',width:340,height:480});
  const b = win.body; b.style.background = 'var(--win-solid)'; b.classList.add('calc');
  const disp = U.el('div','calc-disp');
  const exprEl = U.el('div','calc-expr',''); const valEl = U.el('div','calc-val','0');
  disp.append(exprEl, valEl);
  const keys = U.el('div','calc-keys');
  b.append(disp, keys);
  let expr = '', done = false;
  const upd = ()=>{ exprEl.textContent = expr; valEl.textContent = expr||'0'; };
  const press = tok=>{
    if(tok==='C'){ expr=''; done=false; upd(); return; }
    if(tok==='⌫'){ expr = expr.slice(0,-1); upd(); return; }
    if(tok==='='){ try{ const r = CalcEval(expr); if(!isFinite(r)) throw new Error(); expr = String(Number(r.toPrecision(12))); done=true; } catch(e){ valEl.textContent='Ошибка'; expr=''; return; } upd(); return; }
    if(done && /[0-9.]/.test(tok)) expr = '';
    done = false; expr += tok; upd();
  };
  ['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','%','='].forEach(k=>{
    const btn = U.el('button','ckey', k==='*'?'×':k==='/'?'÷':k==='-'?'−':k);
    if('+-*/%'.includes(k)) btn.classList.add('op');
    if(k==='=') btn.classList.add('eq');
    btn.addEventListener('click', ()=>press(k));
    keys.appendChild(btn);
  });
  upd();
}});

    const line = U.el('div','line');
    line.append(U.el('span','prompt',promptStr()));
    const inp = U.el('input','term-input');
    line.appendChild(inp); term.appendChild(line); inp.focus();
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ const cmd = inp.value; inp.disabled = true; write(promptStr()+cmd); run(cmd); writePrompt(); }
    });
  }
  function run(raw){
    const parts = raw.trim().split(/\s+/);
    const cmd = (parts[0]||'').toLowerCase();
    const arg = parts.slice(1).join(' ');
    switch(cmd){
      case '': break;
      case 'help': write('Команды:','ok'); ['help','dir','cd','mkdir','echo','type','del','cls','date','time','whoami','color','tasklist','kill','scan','fix','apps','install <id>','uninstall <id>','version','vm <id>','vms','exit'].forEach(l=>write('  '+l)); write(''); write('  su disasters — панель происшествий', 'ok'); break;
      case 'su': if(arg === 'disasters'){ M.ControlPanel.toggle(); write(M.ControlPanel.isMounted() ? '🔓 Панель активирована' : '🔒 Панель скрыта', 'ok'); } else write('Неверный пароль', 'err'); break;
      case 'version': write('Текущая версия: '+Version.get().name,'ok'); break;
      case 'vm': if(!arg){ write('Укажите ID приложения','err'); break; } VirtualMachine.openWindow('inst_'+arg); write('ВМ запущена','ok'); break;
      case 'vms': write('ВМ сессии:','ok'); VirtualMachine.sessions.forEach((s,id)=>{ write('  '+id+' · '+s.appData.name+' · '+s.state+' · '+VirtualMachine.formatTime(s.elapsed)); }); if(!VirtualMachine.sessions.size) write('  <нет>'); break;
      case 'apps': write('Установленные:','ok'); DB.getAllApps().then(list=>{ if(!list.length){ write('  <пусто>'); return; } list.forEach(a=>write('  ['+a.id+'] '+a.name+' v'+a.version+' ('+a.appType+')')); }); break;
      case 'install': if(!arg){ write('Укажите ID','err'); break; } VirtualMachine.openWindow('inst_'+arg); write('ВМ: '+arg,'ok'); break;
      case 'dir': { const n = FS.resolve(cwd); write(' \\'+cwd.join('\\')); if(!n || !n.children || !n.children.length){ write('  <пусто>'); break; } n.children.forEach(c=>write('  '+(c.type==='folder'?'[DIR] ':'      ')+c.name)); break; }
      case 'cd': { if(!arg){ cwd=[]; break; } if(arg==='..'){ cwd.pop(); break; } const t = [...cwd,arg]; const n = FS.resolve(t); if(n && n.type==='folder') cwd = t; else write('Не найдено','err'); break; }
      case 'mkdir': if(!arg){ write('Укажите имя','err'); break; } write(FS.mkdir(cwd,arg)?'OK':'Ошибка','ok'); break;
      case 'echo': write(arg); break;
      case 'cls': case 'clear': term.innerHTML = ''; break;
      case 'date': write(new Date().toLocaleDateString('ru-RU')); break;
      case 'time': write(new Date().toLocaleTimeString('ru-RU')); break;
      case 'whoami': write(UserSession.name); break;
      case 'color': if(/^#[0-9a-f]{6}$/i.test(arg)){ document.documentElement.style.setProperty('--accent',arg); write('OK','ok'); } else write('Формат: #rrggbb','err'); break;
      case 'tasklist': write(' PID   App                 CPU   RAM','ok'); WM.wins.forEach((w,i)=>{ const cpu = Math.max(1, Math.round(SystemState.cpu/(WM.wins.length+1))); const ram = Math.round(SystemState.ramMB/(WM.wins.length+2)/4); write(` ${String(i+1).padStart(3,' ')}   ${(w.appId||'app').padEnd(20,' ')} ${String(cpu).padStart(3,' ')}%  ${ram}M`); }); break;
      case 'kill': { const idx = parseInt(arg,10)-1; if(idx>=0 && idx<WM.wins.length){ WM.close(WM.wins[idx].id); write('OK','ok'); } else write('Нет PID','err'); break; }
      case 'scan': if(SystemState.viruses>0){ write('Угроз: '+SystemState.viruses+'. Очистка...','err'); IncidentMgr.normalize(); write('Чисто','ok'); } else write('Чисто','ok'); break;
      case 'fix': IncidentMgr.normalize(); write('OK','ok'); break;
      case 'uninstall': if(!arg){ write('Укажите ID','err'); break; } M.Boot.uninstallApp('inst_'+arg); write('Удалено','ok'); break;
      case 'exit': win.close(); break;
      default: write('Неизвестно: '+cmd,'err');
    }
  }
  write('microOS Terminal v11.0','ok');
  write('Введите help.'); write(''); writePrompt();
  term.addEventListener('click', ()=>{ const l = term.querySelector('.term-input:not([disabled])'); if(l) l.focus(); });
}});

const LockScreen = M.LockScreen = {
  show(){
    const ls = U.$('#lockScreen'); if(!ls) return;
    ls.classList.remove('hidden'); ls.style.opacity = '1';
    const n = U.$('#lockName'); if(n) n.textContent = UserSession.name;
    const av = U.$('#lockAvatar'); if(av){ av.innerHTML = UserSession.getAvatarHTML(); }
    const pw = U.$('#lockPassWrap'); const en = U.$('#lockEnter');
    const err = U.$('#lockErr'); if(err) err.textContent = '';
    if(UserSession.passwordHash){ if(pw) pw.classList.remove('hidden'); if(en) en.classList.add('hidden'); setTimeout(()=>{ const p = U.$('#lockPass'); if(p) p.focus(); }, 200); }
    else { if(pw) pw.classList.add('hidden'); if(en) en.classList.remove('hidden'); }
    this.updateClock();
  },
  updateClock(){
    const now = new Date();
    const lt = U.$('#lockTime'); if(lt) lt.textContent = U.pad(now.getHours())+':'+U.pad(now.getMinutes());
    const ld = U.$('#lockDate'); if(ld){ const s = now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}); ld.textContent = s.charAt(0).toUpperCase()+s.slice(1); }
  },
  async tryLogin(){
    const pw = U.$('#lockPass');
    const ok = await UserSession.checkPassword(pw ? pw.value : '');
    if(ok){ const ls = U.$('#lockScreen'); ls.style.opacity = '0'; setTimeout(()=>{ ls.classList.add('hidden'); ls.style.opacity = '1'; if(pw) pw.value = ''; }, 350); AudioMgr.greet(); M.Boot.showDesktop(); }
    else { const err = U.$('#lockErr'); if(err) err.textContent = 'Неверный пароль'; const av = U.$('#lockAvatar'); if(av){ av.classList.add('shake'); setTimeout(()=>av.classList.remove('shake'), 400); } if(pw) pw.value = ''; AudioMgr.error(); }
  },
  init(){
    const en = U.$('#lockEnter'); if(en) en.addEventListener('click', ()=>this.tryLogin());
    const sb = U.$('#lockSubmit'); if(sb) sb.addEventListener('click', ()=>this.tryLogin());
    const pw = U.$('#lockPass'); if(pw) pw.addEventListener('keydown', e=>{ if(e.key==='Enter') this.tryLogin(); });
  }
};

    c.appendChild(this.mkScreen(0, `<div class="oobe-logo"><svg width="120" height="120" viewBox="0 0 100 100"><rect x="10" y="10" width="38" height="38" rx="4" fill="#4aa3ff"/><rect x="52" y="10" width="38" height="38" rx="4" fill="#7cc4ff"/><rect x="10" y="52" width="38" height="38" rx="4" fill="#7cc4ff"/><rect x="52" y="52" width="38" height="38" rx="4" fill="#4aa3ff"/></svg></div><h1>Добро пожаловать</h1><p>Настроим microOS</p><button class="oobe-btn primary" id="oobeStartBtn">Начать →</button>`));
    c.appendChild(this.mkScreen(1, `<h1>Язык</h1><div class="oobe-form"><label>Язык</label><select id="oobeLang"><option value="ru">Русский</option><option value="en">English</option></select></div>`));
    c.appendChild(this.mkScreen(2, `<h1>Условия</h1><div class="oobe-eula"><h4>1. Общие</h4><p>Соглашение регулирует использование microOS.</p><h4>2. Лицензия</h4><p>Неисключительная лицензия.</p><h4>3. Данные</h4><p>Локально.</p></div><label class="oobe-checkbox"><input type="checkbox" id="oobeAccept"> Я принимаю</label>`));
    c.appendChild(this.mkScreen(3, `<h1>Учётная запись</h1><div class="oobe-form oobe-form-wide"><label>Имя *</label><input type="text" id="oobeUser" maxlength="32" placeholder="Введите имя"><div class="oobe-err" id="oobeUserErr"></div><label>Компьютер</label><input type="text" id="oobePC" maxlength="32"><label>Аватар</label><div class="oobe-avatars" id="oobeAvatars"></div><label>Пароль</label><input type="password" id="oobePass" placeholder="Пусто = без"><div class="oobe-err" id="oobePassErr"></div></div>`));
    c.appendChild(this.mkScreen(4, `<h1>Персонализация</h1><div class="oobe-form oobe-form-wide"><label>Тема</label><div class="oobe-themes"><div class="oobe-theme" data-theme="light"><div class="oobe-theme-prev" style="background:#f3f3f3"><div style="background:#fff;width:60%;height:8px;border-radius:2px;margin:10px auto"></div></div><span>Светлая</span></div><div class="oobe-theme active" data-theme="dark"><div class="oobe-theme-prev" style="background:#1a1a1a"><div style="background:#333;width:60%;height:8px;border-radius:2px;margin:10px auto"></div></div><span>Тёмная</span></div></div><label>Обои</label><div class="oobe-wallpapers" id="oobeWallpapers"></div></div>`));
    c.appendChild(this.mkScreen(5, `<h1>Приватность</h1><div class="oobe-form oobe-form-wide"><div class="oobe-switch-row"><div><b>Диагностика</b></div><div class="switch on"></div></div><div class="oobe-switch-row"><div><b>Реклама</b></div><div class="switch on"></div></div></div>`));
    c.appendChild(this.mkScreen(6, `<div class="oobe-logo"><svg width="80" height="80" viewBox="0 0 100 100"><rect x="10" y="10" width="38" height="38" rx="4" fill="#4aa3ff"/><rect x="52" y="10" width="38" height="38" rx="4" fill="#7cc4ff"/><rect x="10" y="52" width="38" height="38" rx="4" fill="#7cc4ff"/><rect x="52" y="52" width="38" height="38" rx="4" fill="#4aa3ff"/></svg></div><h1>Всё готово!</h1><p>microOS настроена</p><div class="oobe-summary" id="oobeSummary"></div><button class="oobe-btn primary" id="oobeLaunch">🚀 Запустить</button>`));
    const dots = U.$('#oobeDots'); dots.innerHTML = '';
    for(let i=0;i<=this.maxStep;i++){ const d = U.el('div','oobe-dot'); d.dataset.i = i; dots.appendChild(d); }
    U.$('#oobePC').value = 'DESKTOP-'+Math.random().toString(36).substring(2,8).toUpperCase();
    const ab = U.$('#oobeAvatars');
    const emojis = ['👤','😀','🐱','🐶','🦊','🐼','🦉','🐢','🐸'];
    const colors = ['#4aa3ff','#8e46b8','#1e9078','#e08a2e','#e81123','#3fbf6a','#a06bff','#ff6b9d','#00bcd4'];
    emojis.forEach((em,i)=>{ const a = U.el('div','oobe-avatar'+(i===0?' sel':''), em); a.style.background = colors[i]; a.addEventListener('click', ()=>{ U.$$('.oobe-avatar',ab).forEach(x=>x.classList.remove('sel')); a.classList.add('sel'); this.data.avatarIdx = i; }); ab.appendChild(a); });
    U.$('#oobeAccept').addEventListener('change', e=>{ this.data.accepted = e.target.checked; U.$('#oobeNext').disabled = !e.target.checked; });
    U.$$('.oobe-theme').forEach(t=>{ t.addEventListener('click', ()=>{ U.$$('.oobe-theme').forEach(x=>x.classList.remove('active')); t.classList.add('active'); this.data.theme = t.dataset.theme; }); });
    const wpb = U.$('#oobeWallpapers');
    Object.keys(WALLPAPERS).forEach(k=>{ const w = U.el('div','oobe-wallpaper'+(k==='a'?' sel':'')); w.style.backgroundImage = WALLPAPERS[k]; w.addEventListener('click', ()=>{ U.$$('.oobe-wallpaper',wpb).forEach(x=>x.classList.remove('sel')); w.classList.add('sel'); this.data.wallpaper = k; }); wpb.appendChild(w); });
    U.$$('.oobe-switch-row .switch').forEach(sw=>{ sw.addEventListener('click', ()=>sw.classList.toggle('on')); });
    U.$('#oobeStartBtn').addEventListener('click', ()=>this.goTo(1));
    U.$('#oobeLaunch').addEventListener('click', ()=>this.launch());
  },
  mkScreen(idx, inner){ const s = U.el('div','oobe-screen'); s.dataset.step = idx; const c = U.el('div','oobe-center'); c.innerHTML = inner; s.appendChild(c); return s; },
  start(onDone){ this.onDone = onDone; this.$root.classList.remove('hidden'); this.goTo(0); },
  goTo(step){ if(step<0 || step>this.maxStep) return; this.step = step; U.$$('.oobe-screen').forEach(s=>s.classList.remove('active')); const t = U.$(`.oobe-screen[data-step="${step}"]`); if(t) t.classList.add('active'); U.$$('.oobe-dot').forEach(d=>{ d.classList.toggle('active', parseInt(d.dataset.i)===step); d.classList.toggle('done', parseInt(d.dataset.i)<step); }); U.$('#oobeBack').disabled = step === 0; U.$('#oobeNext').disabled = (step===2 && !this.data.accepted); U.$('#oobeNext').textContent = step === this.maxStep ? 'Запустить ✓' : 'Далее →'; if(step === 6) this.fillSummary(); },
  validate(step){
    if(step===2 && !this.data.accepted) return false;
    if(step===3){ const ue = U.$('#oobeUserErr'), pe = U.$('#oobePassErr'); ue.textContent = ''; pe.textContent = ''; const name = U.$('#oobeUser').value.trim(); if(!name){ ue.textContent = 'Имя обязательно'; return false; } if(name.length < 2){ ue.textContent = 'Минимум 2'; return false; } this.data.userName = name; this.data.computerName = U.$('#oobePC').value.trim() || 'DESKTOP-PC'; const pw = U.$('#oobePass').value; if(pw && pw.length < 4){ pe.textContent = 'Минимум 4'; return false; } this.data.password = pw; }
    return true;
  },
  fillSummary(){ const box = U.$('#oobeSummary'); box.innerHTML = ''; [['📀 Версия', Version.get().name],['👤 Пользователь', this.data.userName||'Пользователь'],['💻 Компьютер', this.data.computerName||'DESKTOP-PC'],['🎨 Тема', this.data.theme==='dark'?'Тёмная':'Светлая']].forEach(([k,v])=>{ const d = U.el('div'); d.append(U.el('span',null,k), U.el('span','v',v)); box.appendChild(d); }); },
  quickSetup(){ this.data = { lang:'ru', accepted:true, userName:'Пользователь', computerName:'DESKTOP-'+Math.random().toString(36).substring(2,8).toUpperCase(), avatarIdx:0, avatarData:null, password:'', confirmPassword:'', theme:'light', wallpaper:'a' }; this.applyAndFinish(); },
  launch(){ if(!this.data.userName) this.data.userName = U.$('#oobeUser').value.trim() || 'Пользователь'; if(!this.data.computerName) this.data.computerName = U.$('#oobePC').value.trim() || 'DESKTOP-PC'; this.applyAndFinish(); },
  async applyAndFinish(){
    let passwordHash = null;
    if(this.data.password) passwordHash = await UserSession.hash(this.data.password);
    U.lsSet('installed', true);
    U.lsSet('user', {name:this.data.userName, computerName:this.data.computerName, avatar:this.data.avatarData||null, avatarIdx:this.data.avatarIdx, passwordHash});
    Settings.data.theme = this.data.theme;
    Settings.data.wallpaper = this.data.wallpaper;
    Settings.save(); UserSession.load(); Settings.apply(); Version.apply();
    AudioMgr.greet();
    this.$root.style.opacity = '0';
    setTimeout(()=>{ this.$root.classList.add('hidden'); this.$root.style.opacity = ''; if(this.onDone) this.onDone(); }, 500);
  }
};

M.BootFlow = {
  $boot:null, $act:null, onComplete:null,
  init(){ this.$boot = U.$('#bootloader'); this.$act = U.$('#activationFlow'); },
  start(onComplete){
    this.onComplete = onComplete;
    const activated = U.lsGet('activated', false);
    if(activated){ this.showBootloader(()=>{ if(M.LockScreen && U.lsGet('installed',false)) M.LockScreen.show(); else if(onComplete) onComplete(); }); }
    else this.showBootloader(()=>this.showActivationKey('first'));
  },
  showBootloader(onDone){
    this.$act.classList.add('hidden'); this.$boot.classList.remove('hidden');
    AudioMgr.beep(880, 0.08, 'square', 0.04);
    const fill = U.$('#bootFill'); fill.style.width = '0%';
    let p = 0; const inc = 100 / (2000/30);
    const int = setInterval(()=>{ p += inc; if(p >= 100){ p = 100; clearInterval(int); fill.style.width = '100%'; setTimeout(()=>{ this.$boot.classList.add('hidden'); if(onDone) onDone(); }, 250); } else fill.style.width = p + '%'; }, 30);
  },
  showActivationKey(phase){
    this.$boot.classList.add('hidden'); this.$act.classList.remove('hidden');
    this.$act.innerHTML = '';
    const screen = U.el('div','act-screen');
    screen.innerHTML = `<div class="act-icon">🔑</div><div class="act-title">Активация microOSPASTON</div><div class="act-subtitle">Введите ключ активации для продолжения загрузки</div><input type="text" class="act-input" id="actKeyInput" placeholder="Ключ активации" autocomplete="off" spellcheck="false"><button class="act-btn" id="actSubmit">Активировать</button><div class="act-error" id="actError"></div><div class="act-hint" id="actHint" title="Тестовый ключ: ${ACTIVATION_KEY}">Забыли ключ?</div>`;
    this.$act.appendChild(screen);
    const input = U.$('#actKeyInput'); const btn = U.$('#actSubmit'); const err = U.$('#actError'); const hint = U.$('#actHint');
    const submit = ()=>{
      const val = input.value.trim();
      if(!val){ err.textContent = 'Введите ключ активации'; AudioMgr.error(); return; }
      if(val === ACTIVATION_KEY){
        AudioMgr.beep(880,0.1,'sine',0.06); setTimeout(()=>AudioMgr.beep(1100,0.15,'sine',0.06),100);
        U.lsSet('activationKey', val);
        btn.disabled = true; input.disabled = true;
        if(phase === 'first') this.showVerifying();
        else this.showVersionSelect();
      } else { err.textContent = 'Неверный ключ активации'; input.classList.add('err'); setTimeout(()=>input.classList.remove('err'), 500); AudioMgr.error(); input.select(); }
    };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', e=>{ if(e.key === 'Enter') submit(); });
    input.addEventListener('input', ()=>{ err.textContent = ''; });
    hint.addEventListener('click', ()=>{ input.value = ACTIVATION_KEY; input.focus(); err.textContent = ''; });
    setTimeout(()=>input.focus(), 300);
  },
  showVerifying(){
    this.$act.innerHTML = '';
    const screen = U.el('div','act-verify');
    screen.innerHTML = `<div class="act-icon">🛡️</div><div class="act-verify-title">Проверка ключа активации…</div><div class="act-verify-progress"><div id="actVerifyFill"></div></div><div class="act-verify-pct" id="actVerifyPct">0%</div><div class="act-verify-msg" id="actVerifyMsg">Соединение с сервером активации microOS…</div>`;
    this.$act.appendChild(screen);
    const fill = U.$('#actVerifyFill'); const pct = U.$('#actVerifyPct'); const msg = U.$('#actVerifyMsg');
    const messages = ['Соединение с сервером активации microOS…','Проверка подписи ключа…','Верификация лицензии…','Загрузка конфигурации…','Почти готово…'];
    const DURATION = 5000; const startTime = Date.now(); let msgIdx = 0;
    const int = setInterval(()=>{
      const elapsed = Date.now() - startTime;
      const p = Math.min(100, (elapsed / DURATION) * 100);
      fill.style.width = p + '%'; pct.textContent = Math.floor(p) + '%';
      const newMsgIdx = Math.min(messages.length-1, Math.floor((p/100) * messages.length));
      if(newMsgIdx !== msgIdx){ msgIdx = newMsgIdx; msg.style.opacity = '0'; setTimeout(()=>{ msg.textContent = messages[msgIdx]; msg.style.opacity = '1'; }, 150); }
      if(p >= 100){ clearInterval(int); pct.textContent = '100%'; msg.textContent = '✓ Ключ подтверждён'; msg.classList.add('done'); AudioMgr.beep(1100,0.15,'sine',0.06); setTimeout(()=>this.showShutdown(), 800); }
    }, 50);
  },
  showShutdown(){
    this.$act.innerHTML = '';
    const screen = U.el('div','act-shutdown');
    screen.innerHTML = '<div class="act-shutdown-spinner"></div><div class="act-shutdown-text">Завершение работы…</div>';
    this.$act.appendChild(screen);
    setTimeout(()=>{
      this.$act.innerHTML = '';
      const black = U.el('div'); black.style.cssText = 'width:100%;height:100%;background:#000'; this.$act.appendChild(black);
      AudioMgr.beep(220,0.3,'sine',0.03);
      setTimeout(()=>this.showGreeting(), 1000);
    }, 2000);
  },
  showGreeting(){
    this.$act.innerHTML = '';
    const screen = U.el('div','act-greeting');
    screen.innerHTML = '<div class="act-greeting-title">Добрый день!</div><div class="act-greeting-sub">Добро пожаловать в microOS</div>';
    this.$act.appendChild(screen);
    setTimeout(()=>{
      const hint = U.el('div','act-greeting-hint','Пожалуйста, введите ключ активации для продолжения');
      screen.appendChild(hint);
      setTimeout(()=>{
        const input = U.el('input','act-input');
        input.type = 'text'; input.placeholder = 'Ключ активации'; input.autocomplete = 'off'; input.spellcheck = false;
        input.style.marginTop = '24px';
        const btn = U.el('button','act-btn','Активировать');
        const err = U.el('div','act-error');
        const hint2 = U.el('div','act-hint','Забыли ключ?');
        hint2.title = 'Тестовый ключ: ' + ACTIVATION_KEY;
        screen.append(input, btn, err, hint2);
        const submit = ()=>{
          const val = input.value.trim();
          if(!val){ err.textContent = 'Введите ключ'; AudioMgr.error(); return; }
          if(val === ACTIVATION_KEY){ AudioMgr.beep(880,0.1,'sine',0.06); setTimeout(()=>AudioMgr.beep(1100,0.15,'sine',0.06),100); btn.disabled = true; input.disabled = true; this.showVersionSelect(); }
          else { err.textContent = 'Неверный ключ активации'; input.classList.add('err'); setTimeout(()=>input.classList.remove('err'), 500); AudioMgr.error(); input.select(); }
        };
        btn.addEventListener('click', submit);
        input.addEventListener('keydown', e=>{ if(e.key === 'Enter') submit(); });
        input.addEventListener('input', ()=>{ err.textContent = ''; });
        hint2.addEventListener('click', ()=>{ input.value = ACTIVATION_KEY; input.focus(); err.textContent = ''; });
        setTimeout(()=>input.focus(), 200);
      }, 1000);
    }, 1000);
  },
  showVersionSelect(){
    this.$act.innerHTML = '';
    M.VersionSelect.render(this.$act, (versionId)=>{
      U.lsSet('version', versionId);
      U.lsSet('activated', true);
      this.$act.classList.add('hidden');
      if(M.OOBE && !U.lsGet('installed', false)){ M.OOBE.start(()=>{ if(this.onComplete) this.onComplete(); }); }
      else if(this.onComplete) this.onComplete();
    });
  }
};

const Boot = M.Boot = {
  timeOffset:0,
  init(){
    Settings.load(); Version.load(); FS.load(); UserSession.load(); Settings.apply(); Version.apply();
    Desktop.init(); StartMenu.init(); LockScreen.init(); OOBE.init(); M.BootFlow.init();
    Taskbar.render();
    this.updateClock(); setInterval(()=>this.updateClock(), 1000);
    document.addEventListener('keydown', e=>{ if(e.altKey && e.key==='Tab'){ e.preventDefault(); WM.cycle(); } if(e.key==='Escape'){ hideCtx(); StartMenu.close(); } });
    this.initInstaller();
    DB.init().then(()=>this.loadInstalledApps()).catch(e=>console.warn('DB:', e));
    const migrated = U.lsGet('migrated.hiddenPanel', false);
    if(!migrated){ U.lsSet('controlPanelVisible', false); U.lsSet('migrated.hiddenPanel', true); }
    else if(U.lsGet('controlPanelVisible', false)) setTimeout(()=>ControlPanel.mount(), 1000);
    U.$('#taskbar').classList.add('hidden');
    M.BootFlow.start(()=>{
      U.$('#taskbar').classList.remove('hidden');
      this.showDesktop();
      setTimeout(()=>Notify.push('microOS', Version.get().name+' готова','💠'), 600);
    });
  },
  initInstaller(){
    const btn = U.$('#trayInstall');
    if(btn){ btn.addEventListener('click', ()=>{ const inp = U.$('#installFileInput'); if(inp){ inp.value=''; inp.click(); } }); }
    const inp = U.$('#installFileInput');
    if(inp){ inp.addEventListener('change', async ()=>{ const file = inp.files[0]; if(!file) return; try{ await M.installFile(file); }catch(e){ Notify.push('Ошибка', 'Не удалось обработать', '⚠️'); } }); }
    const desk = U.$('#desktop');
    const overlay = U.$('#dropOverlay');
    ['dragenter','dragover'].forEach(ev=>{ desk.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); if(e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.indexOf('Files')!==-1){ if(overlay) overlay.classList.remove('hidden'); } }); });
    desk.addEventListener('dragleave', e=>{ if(e.target===desk && overlay) overlay.classList.add('hidden'); });
    desk.addEventListener('drop', async e=>{ e.preventDefault(); e.stopPropagation(); if(overlay) overlay.classList.add('hidden'); const files = e.dataTransfer && e.dataTransfer.files; if(!files || !files.length) return; for(const file of files){ try{ await M.installFile(file); }catch(err){} } });
  },
  async loadInstalledApps(){
    try{
      const apps = await DB.getAllApps();
      for(const app of apps){ this.registerInstalledApp(app); Desktop.addInstalledIcon('inst_'+app.id, app.name, app.icon); }
      Taskbar.render(); StartMenu.render();
    }catch(e){ console.warn('Load apps:', e); }
  },
  registerInstalledApp(app){
    const id = 'inst_'+app.id;
    if(Apps.get(id)) return;
    Apps.register({
      id, name: app.name, icon: app.icon || '📦', pinned:false, installed:true,
      open(){ M.Boot.launchInstalledApp(id); }
    });
  },
  launchInstalledApp(appId){
    // Открываем через ВМ
    VirtualMachine.openWindow(appId);
  },
  async openStoredFile(fileId){
    try{
      const rec = await DB.getFile(fileId);
      if(!rec){ Notify.push('Ошибка','Файл не найден','⚠️'); return; }
      const url = URL.createObjectURL(rec.blob);
      const ext = rec.name.split('.').pop().toLowerCase();
      if(['txt','md','log'].includes(ext)){ const text = await rec.blob.text(); NotepadApp.open({name:rec.name, path:['Загрузки'], content:text}); URL.revokeObjectURL(url); }
      else if(['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)){ const win = WM.create({appId:'gallery-view',title:'Галерея — '+rec.name,icon:'🖼️',width:700,height:500}); const b = win.body; b.style.cssText='display:flex;align-items:center;justify-content:center;background:#000'; const img = U.el('img'); img.src = url; img.style.cssText='max-width:100%;max-height:100%;object-fit:contain'; b.appendChild(img); win.close=((orig)=>function(){try{URL.revokeObjectURL(url);}catch(e){}orig();})(win.close); }
      else if(['mp3','wav','ogg','flac','mp4','webm','avi','mkv'].includes(ext)){
        const isVideo = ['mp4','webm','avi','mkv'].includes(ext);
        const win = WM.create({appId:'media-view',title:'Медиа — '+rec.name,icon:'🎵',width:600,height:480});
        const b = win.body; b.style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px';
        if(isVideo){ const v = U.el('video'); v.src = url; v.controls = true; v.autoplay = true; v.style.cssText='max-width:100%;max-height:80%'; b.appendChild(v); win.close=((orig)=>function(){try{v.pause();URL.revokeObjectURL(url);}catch(e){}orig();})(win.close); }
        else { const a = U.el('audio'); a.src = url; a.controls = true; a.autoplay = true; b.appendChild(a); win.close=((orig)=>function(){try{a.pause();URL.revokeObjectURL(url);}catch(e){}orig();})(win.close); }
        win.setTitle('Медиа — '+rec.name);
      }
    }catch(e){ Notify.push('Ошибка', e.message, '⚠️'); }
  },
  async uninstallApp(appId){
    try{
      let numericId = appId;
      if(String(appId).startsWith('inst_')) numericId = parseInt(appId.slice(5), 10);
      VirtualMachine.destroySession(appId);
      const app = await DB.getApp(numericId);
      if(app){ if(app.entryFile) await DB.deleteFile(app.entryFile).catch(()=>{}); await DB.deleteApp(numericId); await DB.addLog({timestamp:Date.now(), action:'uninstall', appName:app.name, status:'success'}); }
      try{ delete Apps.registry[appId]; }catch(e){}
      const icon = U.$('.dicon[data-app-id="'+appId+'"]'); if(icon) icon.remove();
      Taskbar.render(); StartMenu.render();
      Notify.push('🗑 Удалено', (app?app.name:appId), '🗑');
    }catch(e){ Notify.push('Ошибка', e.message, '⚠️'); }
  },
  showDesktop(){
    U.$('#taskbar').classList.remove('hidden');
    Taskbar.render(); StartMenu.render(); Desktop.render();
    SystemState.start();
    DB.getAllApps().then(apps=>{ apps.forEach(app=>{ this.registerInstalledApp(app); Desktop.addInstalledIcon('inst_'+app.id, app.name, app.icon); }); }).catch(()=>{});
  },
  updateClock(){
    const now = new Date(Date.now()+this.timeOffset);
    const t = U.pad(now.getHours())+':'+U.pad(now.getMinutes());
    const d = U.pad(now.getDate())+'.'+U.pad(now.getMonth()+1)+'.'+now.getFullYear();
    const cl = U.$('#trayClock');
    if(cl){ cl.querySelector('.t').textContent = t; cl.querySelector('.d').textContent = d; }
    LockScreen.updateClock();
  },
  restart(){ const ps = U.$('#powerScreen'); ps.innerHTML = ''; ps.classList.remove('hidden'); ps.style.background = '#000'; ps.append(U.el('div','logo','microOS'),U.el('div','spinner'),U.el('div','sub','Перезагрузка…')); AudioMgr.fan(false); setTimeout(()=>location.reload(), 1800); },
  shutdown(){ const ps = U.$('#powerScreen'); ps.innerHTML = ''; ps.classList.remove('hidden'); ps.style.background = '#000'; ps.append(U.el('div','sub','Питание отключено')); const b = U.el('button',null,'⏻ Включить'); b.addEventListener('click', ()=>{ ps.classList.add('hidden'); Boot.restart(); }); ps.appendChild(b); AudioMgr.fan(false); SystemState.stop(); }
};

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', ()=>Boot.init());
else Boot.init();

})(window.microOS);
