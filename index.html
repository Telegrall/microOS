/* ========== LOCK SCREEN ========== */
const LockScreen = M.LockScreen = {
  show(){
    const ls = U.$('#lockScreen'); if(!ls) return;
    ls.classList.remove('hidden'); ls.style.opacity = '1';
    const n = U.$('#lockName'); if(n) n.textContent = UserSession.name;
    const av = U.$('#lockAvatar'); if(av){ av.innerHTML = UserSession.getAvatarHTML(); }
    const pw = U.$('#lockPassWrap'); const en = U.$('#lockEnter');
    const err = U.$('#lockErr'); if(err) err.textContent = '';
    const hint = U.$('#lockHint'); if(hint) hint.textContent = UserSession.passwordHash && UserSession.hint ? 'Подсказка: '+UserSession.hint : '';
    if(UserSession.passwordHash){ if(pw) pw.classList.remove('hidden'); if(en) en.classList.add('hidden'); setTimeout(()=>{ const p = U.$('#lockPass'); if(p) p.focus(); }, 200); }
    else { if(pw) pw.classList.add('hidden'); if(en) en.classList.remove('hidden'); }
    this.updateClock();
  },
  updateClock(){
    const now = new Date();
    const lt = U.$('#lockTime'); if(lt) lt.textContent = U.pad(now.getHours())+':'+U.pad(now.getMinutes());
    const ld = U.$('#lockDate'); if(ld){ const s = now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}); ld.textContent = s.charAt(0).toUpperCase()+s.slice(1); }
  },
  async tryLogin(){
    const pw = U.$('#lockPass');
    const ok = await UserSession.checkPassword(pw ? pw.value : '');
    if(ok){
      const ls = U.$('#lockScreen');
      ls.style.opacity = '0';
      setTimeout(()=>{ ls.classList.add('hidden'); ls.style.opacity = '1'; if(pw) pw.value = ''; }, 350);
      AudioMgr.greet();
      M.Boot.showDesktop();
    } else {
      const err = U.$('#lockErr'); if(err) err.textContent = 'Неверный пароль';
      const av = U.$('#lockAvatar'); if(av){ av.classList.add('shake'); setTimeout(()=>av.classList.remove('shake'), 400); }
      if(pw) pw.value = '';
      AudioMgr.error();
    }
  },
  init(){
    const en = U.$('#lockEnter'); if(en) en.addEventListener('click', ()=>this.tryLogin());
    const sb = U.$('#lockSubmit'); if(sb) sb.addEventListener('click', ()=>this.tryLogin());
    const pw = U.$('#lockPass'); if(pw) pw.addEventListener('keydown', e=>{ if(e.key==='Enter') this.tryLogin(); });
  }
};

const OOBE = M.OOBE = {

  mkScreen(idx, inner){
    const s = U.el('div','oobe-screen'); s.dataset.step = idx;
    const c = U.el('div','oobe-center'); c.innerHTML = inner;
    s.appendChild(c); return s;
  },
  start(onDone){ this.onDone = onDone; this.$root.classList.remove('hidden'); this.goTo(-1); },
  goTo(step){
    if(step<-1 || step>this.maxStep) return;
    this.step = step;
    U.$$('.oobe-screen').forEach(s=>s.classList.remove('active'));
    const t = U.$(`.oobe-screen[data-step="${step}"]`);
    if(t) t.classList.add('active');
    U.$$('.oobe-dot').forEach(d=>{ d.classList.toggle('active', parseInt(d.dataset.i)===step); d.classList.toggle('done', parseInt(d.dataset.i)<step); });
    U.$('#oobeBack').disabled = step === -1;
    U.$('#oobeNext').disabled = (step===-1 && !this.data.edition) || (step===3 && !this.data.accepted);
    U.$('#oobeNext').textContent = step === this.maxStep ? 'Запустить ✓' : 'Далее →';
    if(step === 0){
      const ed = EDITIONS[this.data.edition];
      const tt = U.$('#oobeWelcomeTitle');
      if(tt) tt.textContent = 'Добро пожаловать в '+ed.name;
    }
    if(step === 7) this.fillSummary();
  },
  validate(step){
    if(step===-1 && !this.data.edition){ alert('Выберите редакцию'); return false; }
    if(step===3 && !this.data.accepted) return false;
    if(step===4){
      const ue = U.$('#oobeUserErr'), pe = U.$('#oobePassErr'), ce = U.$('#oobePassConfirmErr');
      ue.textContent = ''; pe.textContent = ''; ce.textContent = '';
      const name = U.$('#oobeUser').value.trim();
      if(!name){ ue.textContent = 'Имя обязательно'; return false; }
      if(name.length < 2){ ue.textContent = 'Минимум 2 символа'; return false; }
      this.data.userName = name;
      this.data.computerName = U.$('#oobePC').value.trim() || 'DESKTOP-PC';
      const pw = U.$('#oobePass').value; const cf = U.$('#oobePassConfirm').value;
      if(pw && pw.length < 4){ pe.textContent = 'Минимум 4'; return false; }
      if(pw && pw !== cf){ ce.textContent = 'Не совпадают'; return false; }
      this.data.password = pw;
    }
    return true;
  },
  fillSummary(){
    const box = U.$('#oobeSummary'); box.innerHTML = '';
    [
      ['📀 Редакция', EDITIONS[this.data.edition].name],
      ['👤 Пользователь', this.data.userName||'Пользователь'],
      ['💻 Компьютер', this.data.computerName||'DESKTOP-PC'],
      ['🎨 Тема', this.data.theme==='dark'?'Тёмная':'Светлая']
    ].forEach(([k,v])=>{
      const d = U.el('div');
      d.append(U.el('span',null,k), U.el('span','v',v));
      box.appendChild(d);
    });
  },
  quickSetup(){
    this.data = {
      edition:'w11-pro', lang:'ru', accepted:true,
      userName:'Пользователь',
      computerName:'DESKTOP-'+Math.random().toString(36).substring(2,8).toUpperCase(),
      avatarIdx:0, avatarData:null, password:'', confirmPassword:'', hint:'',
      theme:'light', wallpaper:'a', accent:'#0078d4'
    };
    this.applyAndFinish();
  },
  launch(){
    if(!this.data.userName) this.data.userName = U.$('#oobeUser').value.trim() || 'Пользователь';
    if(!this.data.computerName) this.data.computerName = U.$('#oobePC').value.trim() || 'DESKTOP-PC';
    this.applyAndFinish();
  },
  async applyAndFinish(){
    let passwordHash = null;
    if(this.data.password) passwordHash = await UserSession.hash(this.data.password);
    U.lsSet('installed', true);
    U.lsSet('edition', this.data.edition);
    U.lsSet('user', {name:this.data.userName, computerName:this.data.computerName, avatar:this.data.avatarData||null, avatarIdx:this.data.avatarIdx, passwordHash, hint:this.data.hint||''});
    Edition.set(this.data.edition);
    Settings.data.theme = this.data.theme;
    Settings.data.wallpaper = this.data.wallpaper;
    Settings.save();
    UserSession.load();
    Settings.apply(); Edition.apply();
    AudioMgr.greet();
    this.$root.style.opacity = '0';
    setTimeout(()=>{
      this.$root.classList.add('hidden');
      this.$root.style.opacity = '';
      if(this.onDone) this.onDone();
    }, 500);
  }
};

/* ========== BOOT ========== */
const Boot = M.Boot = {
  timeOffset:0,
  init(){
    Settings.load(); Edition.load(); FS.load(); UserSession.load(); Settings.apply();
    Desktop.init(); StartMenu.init(); LockScreen.init(); OOBE.init();
    Taskbar.render();
    this.updateClock(); setInterval(()=>this.updateClock(), 1000);
    document.addEventListener('keydown', e=>{
      if(e.altKey && e.key==='Tab'){ e.preventDefault(); WM.cycle(); }
      if(e.key==='Escape'){ hideCtx(); StartMenu.close(); }
    });
    this.initInstaller();
    // Init DB and load apps
    DB.init().then(()=>this.loadInstalledApps()).catch(e=>console.warn('DB:', e));
    // Panel migration
    const migrated = U.lsGet('migrated.hiddenPanel', false);
    if(!migrated){
      U.lsSet('controlPanelVisible', false);
      U.lsSet('migrated.hiddenPanel', true);
    } else if(U.lsGet('controlPanelVisible', false)){
      setTimeout(()=>ControlPanel.mount(), 1000);
    }
    const installed = U.lsGet('installed', false);
    if(!installed){
      U.$('#taskbar').classList.add('hidden');
      OOBE.start(()=>{
        U.$('#taskbar').classList.remove('hidden');
        this.showDesktop();
        setTimeout(()=>Notify.push('microOS', Edition.get().name+' готова','💠'), 600);
      });
    } else {
      U.$('#taskbar').classList.add('hidden');
      LockScreen.show();
    }
  },
  initInstaller(){
    const btn = U.$('#trayInstall');
    if(btn){ btn.addEventListener('click', ()=>{ const inp = U.$('#installFileInput'); if(inp){ inp.value=''; inp.click(); } }); }
    const inp = U.$('#installFileInput');
    if(inp){
      inp.addEventListener('change', async ()=>{
        const file = inp.files[0]; if(!file) return;
        try{ await M.installFile(file); }
        catch(e){ Notify.push('Ошибка', 'Не удалось обработать: '+e.message, '⚠️'); }
      });
    }
    const desk = U.$('#desktop');
    const overlay = U.$('#dropOverlay');
    ['dragenter','dragover'].forEach(ev=>{
      desk.addEventListener(ev, e=>{
        e.preventDefault(); e.stopPropagation();
        if(!e.dataTransfer) return;
        if(e.dataTransfer.types && e.dataTransfer.types.indexOf('Files')!==-1){ if(overlay) overlay.classList.remove('hidden'); }
      });
    });
    desk.addEventListener('dragleave', e=>{ if(e.target===desk){ if(overlay) overlay.classList.add('hidden'); } });
    desk.addEventListener('drop', async e=>{
      e.preventDefault(); e.stopPropagation();
      if(overlay) overlay.classList.add('hidden');
      const files = e.dataTransfer && e.dataTransfer.files;
      if(!files || !files.length) return;
      for(const file of files){
        try{ await M.installFile(file); }
        catch(err){ console.warn('Drop:', err); }
      }
    });
  },
  async loadInstalledApps(){
    try{
      const apps = await DB.getAllApps();
      for(const app of apps){
        this.registerInstalledApp(app);
        Desktop.addInstalledIcon('inst_'+app.id, app.name, app.icon);
      }
      Taskbar.render(); StartMenu.render();
    }catch(e){ console.warn('Load apps:', e); }
  },
  registerInstalledApp(app){
    const id = 'inst_'+app.id;
    if(Apps.get(id)) return;
    const appIcon = app.icon || '📦';
    const displayName = app.name;
    const version = app.version;
    const publisher = app.publisher;
    const entryFile = app.entryFile;
    const appType = app.appType;
    const manifest = app.manifest;
    Apps.register({
      id, name: displayName, icon: appIcon, pinned:false, installed:true,
      open(){
        const win = WM.create({appId:id, title:displayName, icon:appIcon, width:560, height:420});
        const b = win.body;
        b.style.cssText = 'padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;background:var(--win-solid)';
        const emBox = U.el('div');
        emBox.style.fontSize = '72px';
        if(appIcon && appIcon.startsWith('data:')){
          const img = U.el('img'); img.src = appIcon; img.style.cssText = 'width:72px;height:72px;border-radius:14px;object-fit:cover';
          emBox.appendChild(img);
        } else emBox.textContent = appIcon;
        const h = U.el('h2', null, displayName); h.style.cssText = 'font-weight:500;margin-bottom:4px';
        const v = U.el('div', null, 'v'+version+' · '+publisher); v.style.cssText = 'color:var(--dim);font-size:12px';
        const p = U.el('div', null, 'Приложение запущено в microOS. Расширенный функционал будет добавлен позже.');
        p.style.cssText = 'color:var(--dim);font-size:13px;max-width:400px;line-height:1.5;margin-top:10px';
        b.append(emBox, h, v, p);
        if(manifest && manifest.permissions && manifest.permissions.length){
          const perms = U.el('div');
          perms.style.cssText = 'margin-top:16px;padding:12px 16px;background:var(--input);border:1px solid var(--border);border-radius:8px;max-width:420px;text-align:left;font-size:11.5px';
          perms.append(U.el('div', null, '🔐 Разрешения:'));
          perms.lastChild.style.cssText = 'font-weight:600;margin-bottom:6px;color:var(--text)';
          manifest.permissions.forEach(pm=>{
            perms.appendChild(U.el('div', null, '• '+pm));
          });
          perms.lastChild.style.color = 'var(--dim)';
          b.appendChild(perms);
        }
        // Update lastRun + runCount
        if(app.id){
          DB.getApp(app.id).then(rec=>{
            if(rec){ rec.lastRun = Date.now(); rec.runCount = (rec.runCount||0)+1; DB.updateApp(rec).catch(()=>{}); }
          }).catch(()=>{});
        }
      }
    });
  },
  async openStoredFile(fileId){
    try{
      const rec = await DB.getFile(fileId);
      if(!rec){ Notify.push('Ошибка','Файл не найден','⚠️'); return; }
      const blob = rec.blob;
      const url = URL.createObjectURL(blob);
      const ext = rec.name.split('.').pop().toLowerCase();
      if(['txt','md','log'].includes(ext)){
        const text = await blob.text();
        NotepadApp.open({name:rec.name, path:['Загрузки'], content:text});
        URL.revokeObjectURL(url);
      } else if(['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)){
        GalleryApp.open({name:rec.name, url});
      } else if(['mp3','wav','ogg','flac'].includes(ext)){
        MediaApp.open({name:rec.name, url, type:'audio'});
      } else if(['mp4','webm','avi','mkv'].includes(ext)){
        MediaApp.open({name:rec.name, url, type:'video'});
      } else if(['exe','apk','dio','msi'].includes(ext)){
        Notify.push('Файл', rec.name+' — установите через кнопку «Установить»','📦');
      } else {
        Notify.push('Файл', rec.name, '📄');
      }
    }catch(e){ Notify.push('Ошибка', e.message, '⚠️'); }
  },
  async openStoredFileByName(name){
    try{
      const files = await DB.getAllFiles();
      const rec = files.find(f=>f.name === name);
      if(!rec){ Notify.push('Не найдено', name, '⚠️'); return; }
      return this.openStoredFile(rec.id);
    }catch(e){ console.warn(e); }
  },
  async uninstallApp(appId){
    try{
      // id может быть либо 'inst_N', либо N
      let numericId = appId;
      if(String(appId).startsWith('inst_')) numericId = parseInt(appId.slice(5), 10);
      const app = await DB.getApp(numericId);
      if(app){
        if(app.entryFile) await DB.deleteFile(app.entryFile).catch(()=>{});
        await DB.deleteApp(numericId);
        await DB.addLog({timestamp:Date.now(), action:'uninstall', appName:app.name, status:'success'});
      }
      // Remove from registry
      try{ delete Apps.registry[appId]; }catch(e){}
      if(String(appId).startsWith('inst_')) try{ delete Apps.registry['inst_'+numericId]; }catch(e){}
      // Remove icon
      const icon = U.$('.dicon[data-app-id="'+appId+'"]');
      if(icon) icon.remove();
      const icon2 = U.$('.dicon[data-app-id="inst_'+numericId+'"]');
      if(icon2) icon2.remove();
      Taskbar.render(); StartMenu.render();
      Notify.push('🗑 Удалено', (app?app.name:appId), '🗑');
    }catch(e){ Notify.push('Ошибка', e.message, '⚠️'); }
  },
  showDesktop(){
    U.$('#taskbar').classList.remove('hidden');
    Taskbar.render(); StartMenu.render(); Desktop.render();
    SystemState.start();
    DB.getAllApps().then(apps=>{
      apps.forEach(app=>{
        this.registerInstalledApp(app);
        Desktop.addInstalledIcon('inst_'+app.id, app.name, app.icon);
      });
    }).catch(()=>{});
  },
  updateClock(){
    const now = new Date(Date.now()+this.timeOffset);
    const t = U.pad(now.getHours())+':'+U.pad(now.getMinutes());
    const d = U.pad(now.getDate())+'.'+U.pad(now.getMonth()+1)+'.'+now.getFullYear();
    const cl = U.$('#trayClock');
    if(cl){ cl.querySelector('.t').textContent = t; cl.querySelector('.d').textContent = d; }
    LockScreen.updateClock();
  },
  restart(){
    const ps = U.$('#powerScreen');
    ps.innerHTML = ''; ps.classList.remove('hidden'); ps.style.background = '#000';
    ps.append(U.el('div','logo','microOS'), U.el('div','spinner'), U.el('div','sub','Перезагрузка…'));
    AudioMgr.fan(false);
    setTimeout(()=>location.reload(), 1800);
  },
  shutdown(){
    const ps = U.$('#powerScreen');
    ps.innerHTML = ''; ps.classList.remove('hidden'); ps.style.background = '#000';
    ps.append(U.el('div','sub','Питание отключено'));
    const b = U.el('button',null,'⏻ Включить');
    b.addEventListener('click', ()=>{ ps.classList.add('hidden'); Boot.restart(); });
    ps.appendChild(b);
    AudioMgr.fan(false); SystemState.stop();
  }
};

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', ()=>Boot.init());
else Boot.init();

})(window.microOS);
</script>
</body>
</html>
