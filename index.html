<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-edition="w11-pro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>microOS 11</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#0078d4;--accent-rgb:0,120,212;--tb-h:46px;--radius:10px}
html[data-theme="dark"]{--bg:#0d0d0d;--text:#fff;--dim:#a8a8a8;--win-bg:rgba(32,32,32,.9);--win-solid:#202020;--panel:rgba(28,28,28,.82);--border:rgba(255,255,255,.09);--hover:rgba(255,255,255,.07);--input:rgba(255,255,255,.06);--shadow:0 12px 40px rgba(0,0,0,.55);--shadow-sm:0 2px 10px rgba(0,0,0,.35)}
html[data-theme="light"]{--bg:#f3f3f3;--text:#1b1b1b;--dim:#5c5c5c;--win-bg:rgba(250,250,250,.92);--win-solid:#fafafa;--panel:rgba(243,243,243,.88);--border:rgba(0,0,0,.1);--hover:rgba(0,0,0,.06);--input:rgba(0,0,0,.05);--shadow:0 12px 40px rgba(0,0,0,.25);--shadow-sm:0 2px 10px rgba(0,0,0,.12)}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
input,textarea,select{background:var(--input);border:1px solid var(--border);border-radius:6px;padding:6px 10px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border-radius:6px}
.hidden{display:none!important}
.switch{width:40px;height:22px;border-radius:11px;background:rgba(128,128,128,.45);position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:4px;left:4px;transition:transform .2s}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(18px)}
html[data-edition^="w10"]{--radius:2px;--accent:#0078D7;--accent-rgb:0,120,215}
html[data-edition^="w10"] .window{border-radius:2px}
html[data-edition^="w10"] .panel,html[data-edition^="w10"] .dialog,html[data-edition^="w10"] .ctx,html[data-edition^="w10"] .notif{border-radius:0}
html[data-edition^="w10"] #tbCenter{position:static;transform:none;margin-left:8px}
html[data-edition^="w10"] #taskbar{justify-content:flex-start}
html[data-edition^="w10"] #tbTray{margin-left:auto}
html[data-edition^="w10"] #startMenu{left:8px;transform:none;width:420px;height:auto;max-height:600px;padding:12px 12px 0}
html[data-edition^="w10"] #startMenu.closed{transform:translateY(16px) scale(.97)}
html[data-edition^="w10"] .lock-content{position:absolute;bottom:80px;left:60px;text-align:left}
html[data-edition^="w10"] #bsod .qrw{display:none!important}
#wallpaper{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0;transition:background .4s,filter .3s}
#desktop{position:fixed;inset:0;z-index:1}
#icons{position:absolute;inset:0}
.dicon{position:absolute;width:84px;padding:8px 4px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .15s;text-align:center;cursor:default}
.dicon:hover{background:var(--hover)}
.dicon.sel{background:rgba(var(--accent-rgb),.28);outline:1px solid rgba(var(--accent-rgb),.5)}
.dicon .em{font-size:34px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.dicon .lb{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);word-break:break-word;max-width:80px;line-height:1.2}
.dicon.virus .em{animation:pulseRed 1s infinite}
@keyframes pulseRed{50%{filter:drop-shadow(0 0 10px #f00)}}
#winLayer{position:fixed;inset:0;z-index:10;pointer-events:none}
.window{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--win-bg);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;min-width:340px;min-height:220px;transition:opacity .18s,transform .18s,box-shadow .18s}
.window.active{box-shadow:var(--shadow);border-color:rgba(var(--accent-rgb),.35)}
.window.opening{animation:winIn .2s cubic-bezier(.2,.9,.3,1)}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.window.closing{opacity:0;transform:scale(.94) translateY(10px)}
.window.minimized{opacity:0;transform:scale(.7) translateY(60vh);pointer-events:none}
.win-tb{height:36px;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border-bottom:1px solid var(--border);flex:none;cursor:default}
.win-ic{font-size:15px}
.win-title{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hang-title{color:#f39c12!important;font-style:italic}
.win-ctr{display:flex;gap:2px}
.win-btn{width:36px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .15s}
.win-btn:hover{background:var(--hover)}.win-btn.close:hover{background:#e81123;color:#fff}
.win-body{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0;position:relative}
.rz{position:absolute;z-index:5}
.rz.n{top:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rz.s{bottom:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rz.e{right:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz.w{left:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz.se,.rz.sw,.rz.ne,.rz.nw{width:14px;height:14px}
.rz.se{bottom:-3px;right:-3px;cursor:nwse-resize}
.rz.sw{bottom:-3px;left:-3px;cursor:nesw-resize}
.rz.ne{top:-3px;right:-3px;cursor:nesw-resize}
.rz.nw{top:-3px;left:-3px;cursor:nwse-resize}
#snapPreview{position:fixed;z-index:9;border-radius:10px;pointer-events:none;background:rgba(var(--accent-rgb),.22);border:2px solid rgba(var(--accent-rgb),.7);transition:all .12s;display:none}
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:100;background:var(--panel);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 8px}
#tbCenter{display:flex;align-items:center;gap:4px;position:absolute;left:50%;transform:translateX(-50%)}
.tb-btn{width:44px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;transition:background .15s}
.tb-btn:hover{background:var(--hover)}
.tb-btn.running::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:var(--accent);transition:width .2s}
.tb-btn.focused::after{width:16px}
.tb-logo{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.tb-logo i{background:var(--accent);border-radius:1px;display:block}
#tbTray{margin-left:auto;display:flex;align-items:center;gap:2px}
.tray-btn{height:34px;min-width:32px;padding:0 8px;border-radius:6px;display:flex;align-items:center;gap:6px;font-size:13px;transition:background .15s}
.tray-btn:hover{background:var(--hover)}
#trayClock{flex-direction:column;font-size:11px;line-height:1.15;padding:0 8px}
#trayClock .t{font-weight:500}#trayClock .d{font-size:10px;color:var(--dim)}
.tray-btn.err{color:#ff5555}
.install-btn{display:flex;align-items:center;gap:4px;background:rgba(var(--accent-rgb),.15);border:1px solid rgba(var(--accent-rgb),.35)}
.install-btn:hover{background:rgba(var(--accent-rgb),.3)}
.install-btn .lbl-inst{font-size:11.5px;font-weight:600}
@media(max-width:1280px){.install-btn .lbl-inst{display:none}}
.panel{position:fixed;z-index:200;background:var(--panel);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);transition:opacity .18s,transform .18s;transform-origin:bottom center}
.panel.closed{opacity:0;transform:translateY(16px) scale(.97);pointer-events:none}
#startMenu{left:50%;bottom:calc(var(--tb-h) + 8px);transform:translateX(-50%);width:620px;max-width:calc(100vw - 24px);height:620px;max-height:calc(100vh - 90px);padding:18px 20px 0;display:flex;flex-direction:column}
#startMenu.closed{transform:translateX(-50%) translateY(16px) scale(.97)}
.sm-search input{width:100%;padding:9px 14px;border-radius:20px;margin-bottom:14px;font-size:13px}
.sm-scroll{flex:1;overflow-y:auto;margin-bottom:8px}
.sm-h{font-size:12px;font-weight:600;color:var(--dim);margin:10px 0 8px}
.sm-pinned{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:8px;font-size:11px;transition:background .15s;text-align:center;cursor:pointer}
.sm-app:hover{background:var(--hover)}
.sm-app .em{font-size:26px;line-height:1}
.sm-row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:6px;font-size:13px;transition:background .15s;cursor:pointer}
.sm-row:hover{background:var(--hover)}
.sm-row .em{font-size:19px;width:24px;text-align:center}
.sm-footer{display:flex;align-items:center;gap:8px;padding:12px 0;margin:0 -20px;padding-left:20px;padding-right:20px;border-top:1px solid var(--border);background:rgba(128,128,128,.07)}
.sm-user{display:flex;align-items:center;gap:10px;flex:1;padding:4px 8px;border-radius:6px}
.sm-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;overflow:hidden}
.sm-avatar img{width:100%;height:100%;object-fit:cover}
.sm-power{width:36px;height:36px;border-radius:6px;font-size:16px;display:flex;align-items:center;justify-content:center}
.sm-power:hover{background:var(--hover)}
#notifs{position:fixed;right:10px;bottom:calc(var(--tb-h) + 10px);z-index:300;display:flex;flex-direction:column;gap:8px;width:340px;pointer-events:none}
.notif{background:var(--panel);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);animation:notifIn .24s cubic-bezier(.2,.9,.3,1);display:flex;gap:10px;pointer-events:auto;font-size:12.5px}
.notif.out{animation:notifOut .2s forwards}
.notif .em{font-size:20px}.notif b{display:block;font-size:13px;margin-bottom:2px}
@keyframes notifIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes notifOut{to{opacity:0;transform:translateX(60px)}}
.ctx{position:fixed;z-index:500;min-width:200px;padding:5px;background:var(--panel);backdrop-filter:blur(28px);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);animation:ctxIn .12s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ctx-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:5px;font-size:13px;transition:background .12s}
.ctx-item:hover{background:var(--hover)}
#controlPanel{position:fixed;right:8px;top:8px;bottom:calc(var(--tb-h) + 8px);width:310px;z-index:150;background:var(--panel);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .25s,opacity .25s;overflow:hidden;animation:cpIn .3s ease}
@keyframes cpIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}
#controlPanel.collapsed{transform:translateX(calc(100% - 44px))}
#controlPanel.left{right:auto;left:8px}
#controlPanel.left.collapsed{transform:translateX(calc(-100% + 44px))}
#cpHeader{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap}
#cpHeader h3{font-size:12.5px;font-weight:600;flex:1;min-width:100px}
#cpStatus{width:10px;height:10px;border-radius:50%;background:#2ecc71;box-shadow:0 0 8px currentColor;transition:background .3s}
#cpEditionBadge{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(var(--accent-rgb),.25);color:var(--accent);font-weight:600}
#cpToggle{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}
#cpToggle:hover{background:var(--hover)}
#cpSearchWrap{padding:10px 12px;border-bottom:1px solid var(--border);flex:none}
#cpSearchWrap input{width:100%;padding:6px 10px;border-radius:6px;font-size:12px}
#cpFilter{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--dim);cursor:pointer}
#cpFilter input{width:14px;height:14px;accent-color:var(--accent);cursor:pointer}
#cpBody{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.cp-section-title{font-size:10.5px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:4px 0}
.cp-cat{background:rgba(128,128,128,.05);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cp-cat-header{padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:600;transition:background .15s}
.cp-cat-header:hover{background:var(--hover)}
.cp-cat-header .arrow{margin-left:auto;font-size:10px;opacity:.6;transition:transform .2s}
.cp-cat.collapsed .arrow{transform:rotate(-90deg)}
.cp-cat-body{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 6px 6px;max-height:400px;overflow-y:auto}
.cp-cat.collapsed .cp-cat-body{display:none}
.cp-card{background:rgba(128,128,128,.08);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.cp-metric{margin-bottom:9px}.cp-metric:last-child{margin-bottom:0}
.cp-row{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px}
.cp-row .v{font-weight:600;font-variant-numeric:tabular-nums}
.cp-bar{height:6px;border-radius:3px;background:rgba(128,128,128,.2);overflow:hidden}
.cp-bar > div{height:100%;background:var(--accent);width:0;transition:width .3s,background .3s;border-radius:3px}
.cp-bar.warn > div{background:#f39c12}
.cp-bar.danger > div{background:#e74c3c;animation:barPulse 1s infinite}
@keyframes barPulse{50%{opacity:.5}}
.cp-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cp-btn{display:flex;align-items:center;gap:6px;padding:7px 7px;border-radius:6px;background:rgba(128,128,128,.1);border:1px solid var(--border);font-size:10.5px;transition:background .15s,transform .1s;text-align:left;line-height:1.2}
.cp-btn:hover{background:rgba(var(--accent-rgb),.18)}
.cp-btn:active{transform:scale(.97)}
.cp-btn .em{font-size:14px;flex:none}
.cp-btn.wide{grid-column:1/-1;font-size:11.5px;padding:8px}
.cp-btn.danger{background:rgba(231,76,60,.15);border-color:rgba(231,76,60,.3)}
.cp-btn.danger:hover{background:rgba(231,76,60,.28)}
.cp-btn.success{background:rgba(46,204,113,.15);border-color:rgba(46,204,113,.3)}
.cp-btn.success:hover{background:rgba(46,204,113,.28)}
.cp-btn.active{background:rgba(231,76,60,.35);border-color:#e74c3c;animation:pulseBtn 1s infinite}
@keyframes pulseBtn{50%{box-shadow:0 0 12px rgba(231,76,60,.6)}}
.cp-btn small{color:var(--dim);font-size:9px;display:block;margin-top:1px}
#cpSettingsToggle{padding:8px 12px;border-top:1px solid var(--border);font-size:11px;text-align:center;color:var(--dim);cursor:pointer;flex:none}
#cpSettingsToggle:hover{background:var(--hover)}
#cpSettings{padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s;flex:none}
#cpSettings.open{max-height:200px;padding:10px 12px;overflow-y:auto}
#cpSettings label{display:flex;align-items:center;gap:8px;font-size:11px;padding:3px 0;justify-content:space-between}
.dialog-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dialog{background:var(--win-solid);border:1px solid var(--border);border-radius:10px;min-width:380px;max-width:540px;box-shadow:var(--shadow);overflow:hidden;animation:dlgIn .2s cubic-bezier(.2,.9,.3,1);color:var(--text)}
@keyframes dlgIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.dialog-tb{padding:10px 14px;background:rgba(128,128,128,.1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.dialog-bd{padding:16px 20px;display:flex;gap:14px;font-size:13px;line-height:1.5;max-height:60vh;overflow-y:auto}
.dialog-ic{font-size:32px;line-height:1;flex:none}
.dialog-ft{padding:10px 14px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);background:rgba(128,128,128,.05)}
.dialog-ft button{padding:6px 18px;border-radius:5px;background:var(--input);border:1px solid var(--border);font-size:12.5px;transition:background .15s}
.dialog-ft button:hover{background:var(--hover)}
.dialog-ft button.primary{background:var(--accent);color:#fff;border-color:transparent}
.dialog.ransomware{border:2px solid #8b0000}
.dialog.ransomware .dialog-tb{background:#8b0000;color:#fff}
.dialog.ransomware .dialog-bd{background:#0d0000;color:#ff6666}
#bsod{position:fixed;inset:0;z-index:1000;background:#0078d7;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:8vh 10vw;gap:16px}
#bsod .frown{font-size:88px;line-height:1;font-weight:300}
#bsod .msg{font-size:22px;line-height:1.4;max-width:700px}
#bsod .code{font-size:15px;opacity:.9;margin-top:8px}
#bsod .qrw{display:flex;gap:30px;align-items:center;margin-top:18px;font-size:13px}
#bsod .progress{width:200px;height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;margin-top:8px}
#bsod .progress > div{height:100%;background:#fff;width:0;transition:width .15s}
#bsod .pct{margin-top:6px;font-size:12px;opacity:.85}
#bsod .foot{position:absolute;bottom:6vh;left:10vw;font-size:11px;opacity:.7}
#powerScreen{position:fixed;inset:0;z-index:1100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff}
#powerScreen .logo{font-size:44px;font-weight:300;letter-spacing:-1px}
#powerScreen .sub{font-size:13px;opacity:.6}
#powerScreen .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#powerScreen button{margin-top:16px;padding:10px 36px;border-radius:22px;background:#fff;color:#000;font-weight:600}
#fadeBlack{position:fixed;inset:0;z-index:900;background:#000;opacity:0;pointer-events:none;transition:opacity .15s}
body.shaking #desktop,body.shaking #winLayer{animation:shake .15s infinite}
@keyframes shake{25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(1px,2px)}}
body.redPulse::after{content:'';position:fixed;inset:0;z-index:60;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 40%,rgba(255,0,0,.35) 100%);animation:redPulse 1.2s infinite}
@keyframes redPulse{50%{opacity:.3}}
#glitchLayer{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;transition:opacity .2s;background:repeating-linear-gradient(0deg,rgba(255,0,255,.14) 0,rgba(255,0,255,.14) 2px,transparent 2px,transparent 5px)}
body.glitching #glitchLayer{opacity:1}
body.invert{filter:invert(1) hue-rotate(180deg)}
body.grayscale #winLayer,body.grayscale #desktop,body.grayscale #taskbar{filter:grayscale(1)}
body.netLost #trayWifi{color:#ff5555}
body.frozen #winLayer,body.frozen #desktop{filter:hue-rotate(180deg) brightness(1.15)}
body.frozen::after{content:'';position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(circle at center,transparent 20%,rgba(150,200,255,.4) 100%);box-shadow:inset 0 0 200px rgba(150,200,255,.55)}
body.screenFlicker #winLayer,body.screenFlicker #desktop{animation:flickerAnim .15s infinite}
@keyframes flickerAnim{50%{opacity:.85}}
#kbOverlay{position:fixed;bottom:calc(var(--tb-h)+8px);left:50%;transform:translateX(-50%);z-index:350;display:none;padding:8px 16px;background:#e74c3c;color:#fff;border-radius:6px;font-size:12px;font-weight:600}
body.kbFail #kbOverlay{display:block}
#mouseBlock{position:fixed;inset:0;z-index:80;display:none;cursor:not-allowed}

<script>
'use strict';
window.microOS = {};
(function(M){

const U = M.Util = {
  $:(s,r=document)=>r.querySelector(s),
  $$:(s,r=document)=>Array.from(r.querySelectorAll(s)),
  el(t,c,txt){ const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; },
  lsGet(k,d){ try{ const v=localStorage.getItem('microOS.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  lsSet(k,v){ try{ localStorage.setItem('microOS.'+k,JSON.stringify(v)); return true;}catch(e){return false;} },
  clamp(v,a,b){ return Math.max(a,Math.min(b,v)); },
  rand(a,b){ return a+Math.random()*(b-a); },
  pad(n){ return String(n).padStart(2,'0'); },
  debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
};

/* ========== DB (IndexedDB) ========== */
const DB = M.DB = {
  db:null,
  async init(){
    if(this.db) return this.db;
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open('microOS_FS',1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains('files')){
          const s = d.createObjectStore('files',{keyPath:'id',autoIncrement:true});
          s.createIndex('type','type'); s.createIndex('path','path');
        }
        if(!d.objectStoreNames.contains('apps')){
          const s = d.createObjectStore('apps',{keyPath:'id',autoIncrement:true});
          s.createIndex('name','name');
        }
        if(!d.objectStoreNames.contains('logs')){
          const s = d.createObjectStore('logs',{keyPath:'id',autoIncrement:true});
          s.createIndex('timestamp','timestamp');
        }
      };
      req.onsuccess = e => { this.db = e.target.result; resolve(this.db); };
      req.onerror = e => reject(e.target.error);
    });
  },
  async _op(store, mode, fn){
    const db = await this.init();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(store, mode);
      const st = tx.objectStore(store);
      const req = fn(st);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  addFile(f){ return this._op('files','readwrite', s => s.add(f)); },
  getFile(id){ return this._op('files','readonly', s => s.get(id)); },
  getAllFiles(){ return this._op('files','readonly', s => s.getAll()); },
  deleteFile(id){ return this._op('files','readwrite', s => s.delete(id)); },
  addApp(a){ return this._op('apps','readwrite', s => s.add(a)); },
  getApp(id){ return this._op('apps','readonly', s => s.get(id)); },
  getAllApps(){ return this._op('apps','readonly', s => s.getAll()); },
  updateApp(a){ return this._op('apps','readwrite', s => s.put(a)); },
  deleteApp(id){ return this._op('apps','readwrite', s => s.delete(id)); },
  addLog(l){ return this._op('logs','readwrite', s => s.add(l)); },
  getLogs(){ return this._op('logs','readonly', s => s.getAll()); }
};

/* ========== WALLPAPERS + EDITIONS ========== */
const WALLPAPERS = M.WALLPAPERS = {
  a:'radial-gradient(circle at 22% 18%,#2f7fdc 0%,#123a72 40%,#06162e 100%)',
  b:'radial-gradient(circle at 72% 28%,#8e46b8 0%,#331467 48%,#0a0620 100%)',
  c:'radial-gradient(circle at 50% 52%,#1e9078 0%,#0d4340 55%,#04191a 100%)',
  d:'radial-gradient(circle at 80% 22%,#e08a2e 0%,#7a320c 50%,#1a0a03 100%)',
  e:'radial-gradient(circle at 50% 20%,#ff6b9d 0%,#7a1a4a 55%,#1a0208 100%)',
  f:'radial-gradient(circle at 30% 70%,#00bcd4 0%,#005a6e 55%,#001a1e 100%)',
  g:'radial-gradient(circle at 60% 40%,#4a4a4a 0%,#1a1a1a 60%,#000 100%)',
  h:'linear-gradient(135deg,#667eea 0%,#764ba2 100%)'
};
const EDITIONS = M.EDITIONS = {
  'w10-base':{name:'microOS 10 (Базовая)',short:'10 Base',ver:'10',logoClass:'base',desc:'Простая версия',features:[{ok:true,text:'Светлая тема'},{ok:true,text:'Все приложения'},{ok:false,text:'Тёмная тема'}],accent:'#0078D7',themes:['light'],build:'19045.3803'},
  'w10-home':{name:'microOS 10 Домашняя',short:'10 Home',ver:'10',logoClass:'w10',desc:'Для дома',features:[{ok:true,text:'Светлая/тёмная'},{ok:true,text:'Все приложения'}],accent:'#0078D7',themes:['light','dark'],build:'19045.3803'},
  'w10-pro':{name:'microOS 10 Pro',short:'10 Pro',ver:'10',logoClass:'w10',desc:'Профессиональная',features:[{ok:true,text:'Все приложения'}],accent:'#0078D7',themes:['light','dark'],build:'19045.3803'},
  'w11-home':{name:'microOS 11 Домашняя',short:'11 Home',ver:'11',logoClass:'w11',desc:'Современный дизайн',features:[{ok:true,text:'Fluent Design'},{ok:true,text:'Все приложения'}],accent:'#0078D4',themes:['light','dark'],build:'22631.4317'},
  'w11-pro':{name:'microOS 11 Pro',short:'11 Pro',ver:'11',logoClass:'w11',desc:'Полная версия',features:[{ok:true,text:'Все функции'}],accent:'#0078D4',themes:['light','dark'],build:'22631.4317'}
};
const Edition = M.Edition = {
  current:'w11-pro',
  load(){ this.current=U.lsGet('edition','w11-pro'); if(!EDITIONS[this.current]) this.current='w11-pro'; this.apply(); },
  get(){ return EDITIONS[this.current]; },
  getId(){ return this.current; },
  set(id){ if(!EDITIONS[id]) return; this.current=id; U.lsSet('edition',id); this.apply(); },
  apply(){
    document.documentElement.dataset.edition = this.current;
    const ed = this.get();
    if(ed.accent){
      document.documentElement.style.setProperty('--accent', ed.accent);
      const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(ed.accent);
      if(m) document.documentElement.style.setProperty('--accent-rgb',`${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)}`);
    }
    if(this.current==='w10-base') document.documentElement.dataset.theme='light';
    if(M.Taskbar) M.Taskbar.render();
    if(M.StartMenu) M.StartMenu.render();
    if(M.Desktop) M.Desktop.render();
    if(M.ControlPanel && M.ControlPanel.isMounted()) M.ControlPanel.render();
  },
  isAppAllowed(){ return true; },
  isIncidentAllowed(){ return true; },
  getBuild(){ return this.get().build; }
};

const Settings = M.Settings = {
  defaults:{theme:'dark',wallpaper:'a',customWallpaper:null,accent:'#0078d4',lang:'ru',brightness:100,volume:70},
  data:{},
  load(){ const r=U.lsGet('settings',null); this.data=Object.assign({},this.defaults,r||{}); },
  save(){ U.lsSet('settings',this.data); },
  get(k){ return this.data[k]; },
  set(k,v){ this.data[k]=v; this.save(); this.apply(); },
  apply(){
    const d=this.data;
    document.documentElement.dataset.theme=d.theme;
    const wp=document.getElementById('wallpaper');
    if(!wp) return;
    if(d.wallpaper==='custom'&&d.customWallpaper) wp.style.backgroundImage=`url(${d.customWallpaper})`;
    else wp.style.backgroundImage=WALLPAPERS[d.wallpaper]||WALLPAPERS.a;
    wp.style.filter=`brightness(${d.brightness/100})`;
  }
};

const SystemState = M.SystemState = {
  cpu:12,ramMB:2400,ramMaxMB:8192,diskGB:45,diskMaxGB:100,tempC:42,viruses:0,stability:100,
  listeners:[],tickHandle:null,
  start(){ if(this.tickHandle)return; this.tickHandle=setInterval(()=>this.tick(),800); },
  stop(){ if(this.tickHandle){ clearInterval(this.tickHandle); this.tickHandle=null; } },
  tick(){
    if(!M.IncidentMgr.has('cpuFire')){ this.tempC+=(42-this.tempC)*0.08; this.cpu+=((10+M.WM.wins.length*3)-this.cpu)*0.12+(Math.random()-0.5)*4; }
    if(!M.IncidentMgr.has('ramFill')&&!M.IncidentMgr.has('memoryLeak')){ const base=2200+M.WM.wins.length*180; this.ramMB+=(base-this.ramMB)*0.1; }
    if(!M.IncidentMgr.has('diskFill')) this.diskGB+=(45-this.diskGB)*0.05;
    this.cpu=U.clamp(this.cpu,2,100); this.ramMB=U.clamp(this.ramMB,500,this.ramMaxMB);
    this.diskGB=U.clamp(this.diskGB,5,this.diskMaxGB); this.tempC=U.clamp(this.tempC,25,105);
    this.recalcStability(); this.emit();
  },
  recalcStability(){
    let s=100;
    s-=Math.max(0,this.tempC-60)*0.9; s-=Math.max(0,this.cpu-70)*0.3;
    s-=Math.max(0,this.ramMB/this.ramMaxMB-0.7)*90; s-=Math.max(0,this.diskGB-85)*0.9; s-=this.viruses*9;
    this.stability=U.clamp(s,0,100);
  },
  emit(){ this.listeners.forEach(fn=>{try{fn(this);}catch(e){}}); },
  onChange(fn){ this.listeners.push(fn); }
};

const AudioMgr = M.AudioMgr = {
  ctx:null,fanNode:null,
  ensure(){ if(this.ctx)return true; try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); return true;}catch(e){return false;} },
  beep(f=800,d=0.1,t='square',v=0.04){
    if(!this.ensure())return;
    try{
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type=t; o.frequency.value=f;
      g.gain.setValueAtTime(v,this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,this.ctx.currentTime+d);
      o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+d+0.02);
    }catch(e){}
  },
  error(){ this.beep(220,0.12,'sawtooth',0.05); setTimeout(()=>this.beep(160,0.18,'sawtooth',0.05),150); },
  alert(){ this.beep(880,0.1,'square',0.05); setTimeout(()=>this.beep(660,0.1,'square',0.05),130); setTimeout(()=>this.beep(440,0.16,'square',0.05),260); },
  bsod(){ this.beep(120,0.6,'sine',0.06); setTimeout(()=>this.beep(90,0.8,'sine',0.06),500); },
  greet(){ this.beep(660,0.15,'sine',0.05); setTimeout(()=>this.beep(880,0.2,'sine',0.05),180); setTimeout(()=>this.beep(1100,0.3,'sine',0.05),380); },
  fan(on){
    if(!this.ensure())return;
    if(on){
      if(this.fanNode)return;
      try{
        const sr=this.ctx.sampleRate;
        const buf=this.ctx.createBuffer(1,sr*2,sr);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;
        const src=this.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
        const filt=this.ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=700;
        const g=this.ctx.createGain(); g.gain.value=0.08;
        src.connect(filt).connect(g).connect(this.ctx.destination);
        src.start(); this.fanNode=src;
      }catch(e){}
    } else if(this.fanNode){ try{ this.fanNode.stop(); }catch(e){} this.fanNode=null; }
  }
};

const Notify = M.Notify = {
  push(title,text,icon='🔔'){
    const box=U.$('#notifs'); if(!box)return;
    const card=U.el('div','notif');
    card.append(U.el('div','em',icon));
    const c=U.el('div'); c.append(U.el('b',null,title),U.el('div',null,text));
    card.appendChild(c); box.appendChild(card);
    const kill=()=>{ card.classList.add('out'); setTimeout(()=>card.remove(),210); };
    card.addEventListener('click',kill);
    setTimeout(kill,6000);
  }
};

const ErrorMgr = M.ErrorMgr = {
  dialogCount:0,
  dialog(opts){
    if(this.dialogCount>6)return;
    this.dialogCount++; AudioMgr.error();
    const ov=U.el('div','dialog-overlay');
    const dlg=U.el('div','dialog');
    if(opts.className) dlg.classList.add(opts.className);
    const tb=U.el('div','dialog-tb');
    tb.append(U.el('span',null,opts.icon||'⚠️'),U.el('span',null,opts.title||'Ошибка'));
    const bd=U.el('div','dialog-bd');
    if(opts.html){ bd.style.display='block'; bd.appendChild(opts.html); }
    else {
      bd.append(U.el('div','dialog-ic',opts.icon||'⚠️'));
      const t=U.el('div');
      t.append(U.el('div',null,opts.message||''));
      if(opts.detail){ const sm=U.el('div',null,opts.detail); sm.style.cssText='font-size:11.5px;color:var(--dim);margin-top:8px;white-space:pre-line'; t.appendChild(sm); }
      bd.appendChild(t);
    }
    const ft=U.el('div','dialog-ft');
    const close=()=>{ ov.remove(); this.dialogCount--; opts.onClose&&opts.onClose(); };
    (opts.buttons||[{label:'ОК',primary:true}]).forEach(b=>{
      const btn=U.el('button',b.primary?'primary':'',b.label);
      btn.addEventListener('click',()=>{ ov.remove(); this.dialogCount--; b.onClose&&b.onClose(); b.action&&b.action(); });
      ft.appendChild(btn);
    });
    dlg.append(tb,bd,ft); ov.appendChild(dlg);
    ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
    document.body.appendChild(ov);
  },
  bsod(code,opts){
    opts=opts||{};
    AudioMgr.bsod(); AudioMgr.fan(false);
    const isW10=Edition.getId().startsWith('w10');
    const el=U.$('#bsod'); el.innerHTML=''; el.classList.remove('hidden');
    el.append(
      U.el('div','frown',':('),
      U.el('div','msg','Ваш компьютер столкнулся с проблемой и будет перезагружен.'),
      U.el('div','code','Код ошибки: '+code)
    );
    if(!isW10){
      const qr=U.el('div','qrw');
      qr.appendChild(this.makeQR(110));
      const info=U.el('div');
      info.append(U.el('div',null,'Посетите microsoft.com/stopcode'),U.el('div',null,'Код ошибки: '+code));
      const prog=U.el('div','progress'); const fill=U.el('div'); prog.appendChild(fill);
      const pct=U.el('div','pct','0% завершено');
      info.append(prog,pct); qr.appendChild(info); el.appendChild(qr);
      let p=0;
      const int=setInterval(()=>{
        p+=U.rand(3,11);
        if(p>=100){ p=100; clearInterval(int); setTimeout(()=>{ el.classList.add('hidden'); if(opts.onComplete)opts.onComplete(); },600); }
        fill.style.width=p+'%'; pct.textContent=Math.floor(p)+'% завершено';
      },180);
    } else {
      const pct=U.el('div'); pct.style.cssText='margin-top:20px;font-size:14px;opacity:.9'; pct.textContent='0% завершено';
      el.appendChild(pct);
      let p=0;
      const int=setInterval(()=>{
        p+=U.rand(5,15);
        if(p>=100){ p=100; clearInterval(int); setTimeout(()=>{ el.classList.add('hidden'); if(opts.onComplete)opts.onComplete(); },600); }
        pct.textContent=Math.floor(p)+'% завершено';
      },250);
    }
    const edName=isW10?'microOS 10':'microOS 11';
    el.appendChild(U.el('div','foot',edName+' · build '+Edition.getBuild()+' · '+new Date().toLocaleString('ru-RU')));
  },
  makeQR(size){
    const NS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 21 21'); svg.setAttribute('width',size); svg.setAttribute('height',size);
    svg.style.background='#fff';
    for(let y=0;y<21;y++)for(let x=0;x<21;x++){
      if((x<7&&y<7)||(x>=14&&y<7)||(x<7&&y>=14))continue;
      if(Math.random()>0.55){
        const r=document.createElementNS(NS,'rect');
        r.setAttribute('x',x); r.setAttribute('y',y);
        r.setAttribute('width',1); r.setAttribute('height',1);
        r.setAttribute('fill','#000'); svg.appendChild(r);
      }
    }
    [[0,0],[14,0],[0,14]].forEach(([fx,fy])=>{
      const a=document.createElementNS(NS,'rect');
      a.setAttribute('x',fx); a.setAttribute('y',fy);
      a.setAttribute('width',7); a.setAttribute('height',7); a.setAttribute('fill','#000');
      const b=document.createElementNS(NS,'rect');
      b.setAttribute('x',fx+1); b.setAttribute('y',fy+1);
      b.setAttribute('width',5); b.setAttribute('height',5); b.setAttribute('fill','#fff');
      const c=document.createElementNS(NS,'rect');
      c.setAttribute('x',fx+2); c.setAttribute('y',fy+2);
      c.setAttribute('width',3); c.setAttribute('height',3); c.setAttribute('fill','#000');
      svg.append(a,b,c);
    });
    return svg;
  },
  uacPrompt(opts){
    AudioMgr.alert();
    const ov=U.el('div','inst-overlay');
    const dlg=U.el('div','uac-dialog'+(opts.signed?'':' unsigned'));
    const hdr=U.el('div','uac-hdr');
    hdr.append(U.el('span',null,opts.signed?'🛡️':'⚠️'),U.el('span',null,opts.signed?'Приложение проверено':'Неизвестный издатель'));
    const bd=U.el('div','uac-body');
    const msg=U.el('div',null,opts.signed?'Разрешить этому приложению установку?':'Разрешить неизвестному приложению вносить изменения?');
    msg.style.fontSize='13px'; msg.style.marginBottom='12px';
    bd.appendChild(msg);
    bd.append(U.el('div',null,'📦 '+opts.name),U.el('div',null,'🏢 '+(opts.publisher||'Неизвестный')));
    const ft=U.el('div','uac-foot');
    const no=U.el('button',null,'Нет'); no.addEventListener('click',()=>{ ov.remove(); opts.onDeny&&opts.onDeny(); });
    const yes=U.el('button','yes','Да'); yes.addEventListener('click',()=>{ ov.remove(); opts.onAllow&&opts.onAllow(); });
    ft.append(no,yes);
    dlg.append(hdr,bd,ft); ov.appendChild(dlg); document.body.appendChild(ov);
  }
};

/* ========== WINDOW MANAGER ========== */
const WM = M.WM = {
  wins:[],zTop:100,counter:0,activeId:null,
  create(opts){
    const id='w'+(++this.counter);
    const W=Math.min(opts.width||720,window.innerWidth-40);
    const H=Math.min(opts.height||480,window.innerHeight-110);
    const n=this.wins.length;
    const left=Math.max(16,Math.round((window.innerWidth-W)/2)+(n%6)*30-75);
    const top=Math.max(16,Math.round((window.innerHeight-46-H)/2)+(n%6)*26-65);
    const win=U.el('div','window opening');
    win.dataset.appId=opts.appId||''; win.dataset.winId=id;
    win.style.left=left+'px'; win.style.top=top+'px';
    win.style.width=W+'px'; win.style.height=H+'px';
    const tb=U.el('div','win-tb');
    tb.append(U.el('div','win-ic',opts.icon||'🗔'),U.el('div','win-title',opts.title||'Окно'));
    const ctr=U.el('div','win-ctr');
    const bMin=U.el('button','win-btn','─');
    const bMax=U.el('button','win-btn','□');
    const bCls=U.el('button','win-btn close','✕');
    ctr.append(bMin,bMax,bCls); tb.appendChild(ctr);
    const body=U.el('div','win-body');
    ['n','s','e','w','ne','nw','se','sw'].forEach(dir=>{
      const h=U.el('div','rz '+dir);
      h.addEventListener('mousedown',e=>startResize(e,dir,win,api));
      win.appendChild(h);
    });
    win.append(tb,body);
    const api={id,el:win,body,appId:opts.appId,title:opts.title,minimized:false,maximized:false,prevRect:null,
      focus:()=>this.focus(id),close:()=>this.close(id),minimize:()=>this.minimize(id),maximize:()=>this.maximize(id),
      setTitle:t=>{ const ti=win.querySelector('.win-title'); if(ti)ti.textContent=t; api.title=t; }};
    U.$('#winLayer').appendChild(win);
    this.wins.push(api);
    win.addEventListener('mousedown',()=>this.focus(id),true);
    tb.addEventListener('mousedown',e=>{ if(e.target.closest('.win-btn'))return; startDrag(e,win,api); });
    tb.addEventListener('dblclick',e=>{ if(e.target.closest('.win-btn'))return; this.maximize(id); });
    bMin.addEventListener('click',e=>{ e.stopPropagation(); this.minimize(id); });
    bMax.addEventListener('click',e=>{ e.stopPropagation(); this.maximize(id); });
    bCls.addEventListener('click',e=>{ e.stopPropagation(); this.close(id); });
    this.focus(id);
    setTimeout(()=>win.classList.remove('opening'),240);
    M.Taskbar.render();
    if(typeof opts.build==='function') opts.build(body,api);
    return api;
  },
  focus(id){
    const w=this.wins.find(x=>x.id===id); if(!w)return;
    if(w.minimized) this.restore(id);
    this.activeId=id; this.zTop++;
    w.el.style.zIndex=this.zTop;
    this.wins.forEach(x=>x.el.classList.toggle('active',x.id===id));
    M.Taskbar.render();
  },
  close(id){
    const i=this.wins.findIndex(x=>x.id===id); if(i<0)return;
    const w=this.wins[i]; w.el.classList.add('closing');
    setTimeout(()=>{
      w.el.remove(); this.wins.splice(i,1);
      if(this.activeId===id){
        const next=this.wins.filter(x=>!x.minimized).pop();
        this.activeId=next?next.id:null;
        if(next) this.focus(next.id);
      }
      M.Taskbar.render();
    },180);
  },
  minimize(id){
    const w=this.wins.find(x=>x.id===id); if(!w)return;
    w.minimized=true; w.el.classList.add('minimized');
    if(this.activeId===id){
      const next=this.wins.filter(x=>!x.minimized&&x.id!==id).pop();
      this.activeId=next?next.id:null;
      if(next) this.focus(next.id);
    }
    M.Taskbar.render();
  },
  restore(id){ const w=this.wins.find(x=>x.id===id); if(w){ w.minimized=false; w.el.classList.remove('minimized'); } },
  maximize(id){
    const w=this.wins.find(x=>x.id===id); if(!w)return;
    if(w.maximized){
      const r=w.prevRect;
      w.el.style.left=r.left+'px'; w.el.style.top=r.top+'px';
      w.el.style.width=r.width+'px'; w.el.style.height=r.height+'px';
      w.maximized=false;
    } else {
      w.prevRect={left:parseFloat(w.el.style.left),top:parseFloat(w.el.style.top),width:parseFloat(w.el.style.width),height:parseFloat(w.el.style.height)};
      w.el.style.left='0px'; w.el.style.top='0px';
      w.el.style.width=window.innerWidth+'px';
      w.el.style.height=(window.innerHeight-46)+'px';
      w.maximized=true;
    }
    this.focus(id);
  },
  cycle(){
    const list=this.wins.filter(w=>!w.minimized); if(!list.length)return;
    const cur=list.findIndex(w=>w.id===this.activeId);
    this.focus(list[(cur+1)%list.length].id);
  },
  findApp(appId){ return this.wins.find(w=>w.appId===appId); }
};
function startDrag(e,win,api){
  if(api.maximized)return; e.preventDefault();
  const sx=e.clientX,sy=e.clientY;
  const sl=parseFloat(win.style.left),st=parseFloat(win.style.top);
  const move=ev=>{
    win.style.left=(sl+ev.clientX-sx)+'px';
    win.style.top=Math.max(0,st+ev.clientY-sy)+'px';
  };
  const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}
function startResize(e,dir,win,api){
  e.preventDefault(); e.stopPropagation();
  if(api.maximized)return;
  const sx=e.clientX,sy=e.clientY;
  const r=win.getBoundingClientRect();
  const sl=parseFloat(win.style.left),st=parseFloat(win.style.top);
  const move=ev=>{
    const dx=ev.clientX-sx,dy=ev.clientY-sy;
    let L=sl,T=st,W=r.width,H=r.height;
    if(dir.includes('e'))W=Math.max(340,r.width+dx);
    if(dir.includes('s'))H=Math.max(220,r.height+dy);
    if(dir.includes('w')){ W=Math.max(340,r.width-dx); L=sl+(r.width-W); }
    if(dir.includes('n')){ H=Math.max(220,r.height-dy); T=st+(r.height-H); }
    win.style.left=L+'px'; win.style.top=T+'px';
    win.style.width=W+'px'; win.style.height=H+'px';
  };
  const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}

  root:null,trash:[],
  load(){ this.root=U.lsGet('fs',null); this.trash=U.lsGet('trash',[]); if(!this.root||!this.root.children) this.reset(); },
  reset(){
    this.root={name:'microOS',type:'folder',children:[
      {name:'Рабочий стол',type:'folder',children:[]},
      {name:'Документы',type:'folder',children:[{name:'readme.txt',type:'file',content:'Добро пожаловать в microOS!'}]},
      {name:'Загрузки',type:'folder',children:[]},
      {name:'Изображения',type:'folder',children:[]},
      {name:'Музыка',type:'folder',children:[]}
    ]};
    this.trash=[]; this.save();
  },
  save(){ U.lsSet('fs',this.root); },
  saveTrash(){ U.lsSet('trash',this.trash); },
  resolve(path){ let n=this.root; for(const p of path){ if(!n.children)return null; n=n.children.find(c=>c.name===p); if(!n)return null; } return n; },
  mkdir(path,name){ if(M.IncidentMgr.has('diskFill'))return false; const p=this.resolve(path); if(!p||p.children.some(c=>c.name===name))return false; p.children.push({name,type:'folder',children:[]}); this.save(); return true; },
  writeFile(path,name,content){ if(M.IncidentMgr.has('diskFill'))return false; const p=this.resolve(path); if(!p)return false; const ex=p.children.find(c=>c.name===name); if(ex){ if(ex.type!=='file')return false; ex.content=content; } else p.children.push({name,type:'file',content}); this.save(); return true; },
  readFile(path){ const n=this.resolve(path); return n&&n.type==='file'?n.content:null; },
  remove(path){ if(!path.length)return false; const parent=this.resolve(path.slice(0,-1)); if(!parent)return false; const idx=parent.children.findIndex(c=>c.name===path[path.length-1]); if(idx<0)return false; const [node]=parent.children.splice(idx,1); this.trash.push({node,from:path.slice(0,-1),at:Date.now()}); this.save(); this.saveTrash(); return true; },
  restore(i){ if(i<0||i>=this.trash.length)return false; const it=this.trash[i]; const p=this.resolve(it.from)||this.root; p.children.push(it.node); this.trash.splice(i,1); this.save(); this.saveTrash(); return true; },
  removePermanent(i){ if(i<0||i>=this.trash.length)return false; this.trash.splice(i,1); this.saveTrash(); return true; }
};

const IncidentMgr = M.IncidentMgr = {
  active:new Set(),timers:new Map(),handlers:{},registry:INCIDENTS,
  has(id){ return this.active.has(id); },
  clearTimers(id){ const l=this.timers.get(id)||[]; l.forEach(t=>{clearInterval(t);clearTimeout(t);}); this.timers.delete(id); },
  setInt(id,fn,ms){ if(!this.timers.has(id))this.timers.set(id,[]); this.timers.get(id).push(setInterval(fn,ms)); },
  setTimeout(id,fn,ms){ if(!this.timers.has(id))this.timers.set(id,[]); this.timers.get(id).push(setTimeout(fn,ms)); },
  start(id){
    if(this.active.has(id))return;
    const meta=this.registry.find(r=>r.id===id); if(!meta)return;
    const fn=this.handlers[id]||this.handlers._generic;
    this.active.add(id); AudioMgr.alert();
    Notify.push('⚠️ Сбой',meta.name,meta.em);
    fn.call(this,id,meta);
    if(M.ControlPanel && M.ControlPanel.isMounted()) M.ControlPanel.renderActiveState();
  },
  stop(id){
    if(!this.active.has(id))return;
    this.active.delete(id); this.clearTimers(id);
    if(this.handlers['cleanup_'+id]) this.handlers['cleanup_'+id].call(this,id);
    if(M.ControlPanel && M.ControlPanel.isMounted()) M.ControlPanel.renderActiveState();
  },
  normalize(){
    Array.from(this.active).forEach(id=>this.stop(id));
    SystemState.cpu=12; SystemState.ramMB=2400; SystemState.diskGB=45; SystemState.tempC=42; SystemState.viruses=0;
    SystemState.recalcStability(); SystemState.emit();
    document.body.classList.remove('shaking','redPulse','glitching','invert','netLost','kbFail','mouseFail','frozen','grayscale','screenFlicker');
    document.body.style.filter='';
    AudioMgr.fan(false);
    U.$$('.dialog-overlay').forEach(o=>o.remove());
    U.$$('.inst-overlay').forEach(o=>o.remove());
    ErrorMgr.dialogCount=0;
    if(M.Desktop) M.Desktop.removeVirusIcons();
    if(M.Boot) M.Boot.timeOffset=0;
    Notify.push('✅ Нормализовано','Все сбои устранены','✔');
  },
  random(){
    const list=this.registry.map(r=>r.id);
    this.start(list[Math.floor(Math.random()*list.length)]);
  },
  apocalypse(){
    const picked=new Set();
    const cats=Object.keys(CATEGORIES);
    while(picked.size<7){
      const cat=cats[Math.floor(Math.random()*cats.length)];
      const inCat=this.registry.filter(r=>r.cat===cat&&!picked.has(r.id));
      if(inCat.length) picked.add(inCat[Math.floor(Math.random()*inCat.length)].id);
    }
    Array.from(picked).forEach((id,i)=>setTimeout(()=>this.start(id),i*180));
  }
};

/* ========== USER SESSION ========== */
const UserSession = M.UserSession = {
  name:'Пользователь',computerName:'DESKTOP-PC',avatar:null,avatarIdx:0,passwordHash:null,hint:'',
  load(){
    const s=U.lsGet('user',null);
    if(s){ this.name=s.name||'Пользователь'; this.computerName=s.computerName||'DESKTOP-PC'; this.avatar=s.avatar||null; this.avatarIdx=s.avatarIdx||0; this.passwordHash=s.passwordHash||null; this.hint=s.hint||''; }
  },
  async hash(pw){
    try{ const buf=new TextEncoder().encode(pw); const h=await crypto.subtle.digest('SHA-256',buf);
      return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){ let h=0; for(let i=0;i<pw.length;i++) h=(h*31+pw.charCodeAt(i))|0; return 'fb_'+Math.abs(h).toString(16); }
  },
  async checkPassword(pw){ if(!this.passwordHash) return true; const h=await this.hash(pw); return h===this.passwordHash; },
  getAvatarHTML(){ if(this.avatar) return `<img src="${this.avatar}">`; const e=['👤','😀','🐱','🐶','🦊','🐼','🦉','🐢','🐸']; return e[this.avatarIdx]||'👤'; }
};

/* ========== FILE RECOGNIZER ========== */
const FileRecognizer = M.FileRecognizer = {
  async recognize(file){
    const name = file.name;
    const ext = name.split('.').pop().toLowerCase();
    const baseName = name.replace(/\.[^.]+$/,'');
    const result = { type: ext, name: baseName, version:'1.0.0', publisher:'Неизвестный разработчик',
      icon: null, entry:null, size:file.size, manifest:null, warnings:[], file };
    if(ext==='exe'||ext==='msi') return this.recognizeExe(file, result);
    if(ext==='apk') return this.recognizeApk(file, result);
    if(ext==='dio') return this.recognizeDio(file, result);
    if(['txt','md','log'].includes(ext)){ result.type='text'; return result; }
    if(['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)){ result.type='image'; return result; }
    if(['mp3','wav','ogg','flac'].includes(ext)){ result.type='audio'; return result; }
    if(['mp4','webm','avi','mkv'].includes(ext)){ result.type='video'; return result; }
    if(['zip','rar','7z','tar','gz'].includes(ext)){ result.type='archive'; return result; }
    if(['bat','cmd','ps1','sh'].includes(ext)){ result.type='script'; return result; }
    if(['sys','dll'].includes(ext)){ result.type='system'; return result; }
    result.type='unknown';
    return result;
  },
  recognizeExe(file, result){
    return new Promise(resolve=>{
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const buffer = reader.result;
          const bytes = new Uint8Array(buffer);
          if(bytes.length>=2 && bytes[0]===0x4D && bytes[1]===0x5A) result.warnings.push('PE-файл');
          const text = new TextDecoder('utf-8',{fatal:false}).decode(buffer);
          const idx = text.indexOf('MICROOS_APP_V1');
          if(idx!==-1){
            const js = text.indexOf('{', idx);
            if(js!==-1){
              let depth=0, end=-1;
              for(let i=js; i<Math.min(text.length, js+4096); i++){
                if(text[i]==='{') depth++; else if(text[i]==='}'){ depth--; if(depth===0){ end=i; break; } }
              }
              if(end!==-1){
                try{
                  const manifest = JSON.parse(text.substring(js, end+1));
                  result.manifest = manifest;
                  if(manifest.name) result.name = manifest.name;
                  if(manifest.version) result.version = manifest.version;
                  if(manifest.publisher) result.publisher = manifest.publisher;
                  if(manifest.icon) result.icon = manifest.icon;
                  if(manifest.entry) result.entry = manifest.entry;
                  result.warnings.push('Манифест найден');
                }catch(e){}
              }
            }
          }
          const vm = file.name.match(/v?(\d+\.\d+(?:\.\d+)?)/i);
          if(vm) result.version = vm[1];
          result.type = 'program';
          if(!result.icon) result.icon = this.generateIcon(result.name);
        }catch(e){ result.type='program'; result.icon=this.generateIcon(result.name); }
        resolve(result);
      };
      reader.onerror = ()=>{ result.type='program'; result.icon=this.generateIcon(result.name); resolve(result); };
      reader.readAsArrayBuffer(file.slice(0,2048));
    });
  },
  async recognizeApk(file, result){
    result.type = 'android';
    result.warnings.push('APK-файл');
    if(typeof JSZip === 'undefined'){ result.icon=this.generateIcon(result.name); return result; }
    try{
      const zip = await JSZip.loadAsync(file);
      const mf = zip.file('AndroidManifest.xml');
      if(mf){
        const bytes = await mf.async('uint8array');
        const text = new TextDecoder('utf-8',{fatal:false}).decode(bytes);
        const pkg = text.match(/([a-z][a-z0-9_]*\.){2,}[a-zA-Z][a-zA-Z0-9_]*/);
        result.manifest = result.manifest || {};
        if(pkg) result.manifest.package = pkg[0];
        const vm = text.match(/(\d+\.\d+\.\d+)/);
        if(vm) result.version = vm[1];
        const perms = [];
        (text.match(/android\.permission\.[A-Z_]+/g)||[]).slice(0,10).forEach(p=>perms.push(p));
        result.manifest.permissions = perms;
      }
      const icons = Object.keys(zip.files).filter(f=>/res\/mipmap[^/]*\/.*\.png$/i.test(f));
      if(icons.length){
        try{ result.icon = 'data:image/png;base64,'+await zip.file(icons[0]).async('base64'); }catch(e){}
      }
    }catch(e){ result.warnings.push('Не удалось распарсить APK'); }
    if(!result.icon) result.icon = this.generateIcon(result.name);
    return result;
  },
  async recognizeDio(file, result){
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      result.manifest = data;
      if(data.name) result.name = data.name;
      if(data.version) result.version = data.version;
      if(data.publisher) result.publisher = data.publisher;
      if(data.icon) result.icon = data.icon;
      if(data.entry) result.entry = data.entry;
      result.type = 'dio';
    }catch(e){ result.warnings.push('Невалидный .dio'); result.type='dio'; result.icon=this.generateIcon(result.name); }
    return result;
  },
  generateIcon(name){
    const letter = (name||'A')[0].toUpperCase();
    const hue = this.hashCode(name) % 360;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(${hue},70%,55%)"/>
      <stop offset="100%" stop-color="hsl(${(hue+40)%360},70%,35%)"/>
      </linearGradient></defs>
      <rect width="64" height="64" rx="12" fill="url(#g)"/>
      <text x="32" y="42" text-anchor="middle" font-family="Segoe UI,Arial" font-size="32" font-weight="700" fill="#fff">${letter}</text>
    </svg>`;
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  },
  hashCode(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0; return Math.abs(h); }
};

/* ========== FILE TYPE HANDLER ========== */
const FileTypeHandler = M.FileTypeHandler = {
  formatSize(bytes){
    if(!bytes||bytes<1024) return (bytes||0)+' Б';
    if(bytes<1048576) return (bytes/1024).toFixed(1)+' КБ';
    if(bytes<1073741824) return (bytes/1048576).toFixed(2)+' МБ';
    return (bytes/1073741824).toFixed(2)+' ГБ';
  }
};

/* ========== INSTALLER DIALOG ========== */
const InstallerDialog = M.InstallerDialog = {
  current:null,
  async start(file){
    const info = await FileRecognizer.recognize(file);
    this.current = info;
    this.step1();
  },
  step1(){
    const f = this.current;
    const ov = U.el('div','inst-overlay');
    const dlg = U.el('div','inst-dialog');
    const head = U.el('div','inst-head');
    const emEl = U.el('div','em');

    const fi = U.el('div','inst-file-info');
    const iconBox = U.el('div','em');
    if(f.icon && f.icon.startsWith('data:')){
      const img = U.el('img'); img.src = f.icon; img.style.cssText='width:64px;height:64px;border-radius:12px';
      iconBox.appendChild(img);
    } else iconBox.textContent = f.icon || '📦';
    fi.appendChild(iconBox);
    const meta = U.el('div','meta');
    meta.append(U.el('div','nm', f.name));
    meta.append(U.el('div','sub', 'Версия ' + f.version));
    meta.append(U.el('div','sub', 'Издатель: ' + f.publisher));
    meta.append(U.el('div','sub', 'Размер: ' + FileTypeHandler.formatSize(f.size)));
    meta.append(U.el('div','sub', 'Тип: ' + (f.type === 'android' ? 'Android APK' : f.type === 'program' ? 'Windows EXE' : f.type === 'dio' ? 'microOS .dio' : f.type)));
    const sig = U.el('div','sub');
    sig.classList.add(f.publisher !== 'Неизвестный разработчик' ? 'sig-ok' : 'sig-bad');
    sig.textContent = f.publisher !== 'Неизвестный разработчик' ? '✅ Подписано' : '⚠️ Не подписано';
    meta.appendChild(sig);
    if(f.warnings && f.warnings.length){
      const warn = U.el('div','sub','⚠️ '+f.warnings.join(' · '));
      warn.style.color = '#f39c12';
      meta.appendChild(warn);
    }
    fi.appendChild(meta);
    body.appendChild(fi);
    const notice = U.el('div',null,'Приложение будет установлено в microOS.');
    notice.style.cssText = 'font-size:12px;color:var(--dim);padding:4px 0';
    body.appendChild(notice);
    const foot = U.el('div','inst-foot');
    const cancel = U.el('button',null,'Отмена');
    const next = U.el('button','primary','Установить');
    cancel.addEventListener('click',()=>{ ov.remove(); this.current=null; });
    next.addEventListener('click',()=>{ ov.remove(); this.step2(); });
    foot.append(cancel, next);
    dlg.append(head, body, foot);
    ov.appendChild(dlg);
    document.body.appendChild(ov);
  },
  step2(){
    const f = this.current;
    if(M.IncidentMgr._corruptInstaller && Math.random()<0.7){
      return this.fail('Файл повреждён. Контрольная сумма не совпадает.','0x80070570');
    }
    if(M.IncidentMgr.has('virusInstall') && Math.random()<0.7){
      return this.fail('Обнаружена угроза Trojan:Win32/Agent.','0x800704EC');
    }
    if(M.IncidentMgr.has('antivirusBlock') || M.IncidentMgr._antivirusBlock){
      return this.fail('Defender заблокировал установку.','0x800704EC');
    }
    if(f.type==='program' || f.type==='android'){
      ErrorMgr.uacPrompt({
        signed: f.publisher !== 'Неизвестный разработчик',
        name: f.name,
        publisher: f.publisher,
        onAllow: () => this.step3(),
        onDeny: () => this.fail('Отменено пользователем.', null)
      });
    } else {
      this.step3();
    }
  },
  step3(){
    const f = this.current;
    const ov = U.el('div','inst-overlay');
    const dlg = U.el('div','inst-dialog');
    const head = U.el('div','inst-head');
    head.append(U.el('div','em','⚙️'), U.el('h3',null,'Установка…'));
    const body = U.el('div','inst-body');
    const prog = U.el('div','inst-progress'); const fill = U.el('div'); prog.appendChild(fill);
    const pct = U.el('div','inst-pct','0%');
    const steps = U.el('ul','inst-steps');
    const names = ['Чтение файла…','Проверка целостности…','Распаковка…','Сохранение…'];
    const els = names.map(s => { const li = U.el('li',null,s); steps.appendChild(li); return li; });
    body.append(prog, pct, steps);
    dlg.append(head, body);
    ov.appendChild(dlg);
    document.body.appendChild(ov);
    let p=0, step=0;
    const int = setInterval(()=>{
      p += U.rand(5,14); if(p>100) p=100;
      fill.style.width = p+'%'; pct.textContent = Math.floor(p)+'%';
      const ns = Math.min(els.length-1, Math.floor(p/(100/els.length)));
      while(step<ns){ els[step].classList.add('done'); els[step].classList.remove('active'); step++; els[step].classList.add('active'); }
      if(p>=100){
        clearInterval(int);
        els.forEach(e=>{ e.classList.add('done'); e.classList.remove('active'); });
        ov.remove();
        if(Math.random()<0.2){
          const types = ['diskFull','corrupt','access','stability'];
          const t = types[Math.floor(Math.random()*types.length)];
          const errs = {
            diskFull:['Недостаточно места на диске.','0x80070070'],
            corrupt:['Файл повреждён.','0x80070570'],
            access:['Отказано в доступе.','0x80070005'],
            stability:['Установка прервана.','0xC0000142']
          };
          return this.fail(errs[t][0], errs[t][1]);
        }
        this.finishSuccess();
      }
    },200);
  },
  async finishSuccess(){
    const f = this.current;
    try{
      const fileRec = {
        name: f.file.name, path: 'C:\\Users\\'+UserSession.name+'\\Downloads\\'+f.file.name,
        type: f.type, size: f.size, blob: f.file, createdAt: Date.now()
      };
      const fileId = await DB.addFile(fileRec);
      const appRec = {
        name: f.name, execName: f.file.name, icon: f.icon || '📦',
        version: f.version, publisher: f.publisher,
        installPath: 'C:\\Program Files\\'+f.name, entryFile: fileId,
        manifest: f.manifest, installedAt: Date.now(), lastRun: null, runCount: 0, size: f.size,
        appType: f.type
      };
      const appId = await DB.addApp(appRec);
      await DB.addLog({timestamp:Date.now(),action:'install',appName:f.name,status:'success',message:'OK'});
      M.Boot.registerInstalledApp({id:appId, ...appRec});
      Desktop.addInstalledIcon('inst_'+appId, f.name, f.icon || '📦');
      M.Taskbar.render(); M.StartMenu.render();
      this.success(f.name);
    }catch(e){
      console.error(e);
      this.fail('Ошибка сохранения: '+e.message, null);
    }
  },
  fail(msg, code){
    const ov = U.el('div','inst-overlay');
    const dlg = U.el('div','inst-dialog');
    const head = U.el('div','inst-head');
    head.append(U.el('div','em','❌'), U.el('h3',null,'Установка не удалась'));
    const body = U.el('div','inst-body');
    const res = U.el('div','inst-result');
    res.append(U.el('div','em','⚠️'));
    res.append(U.el('h3',null,msg));
    if(code) res.append(U.el('p',null,'Код: '+code));
    body.appendChild(res);
    const foot = U.el('div','inst-foot');
    const close = U.el('button','primary','Закрыть');
    close.addEventListener('click',()=>{ ov.remove(); this.current=null; });
    foot.appendChild(close);
    dlg.append(head, body, foot);
    ov.appendChild(dlg);
    document.body.appendChild(ov);
    if(this.current) DB.addLog({timestamp:Date.now(),action:'install',appName:this.current.name,status:'fail',errorCode:code,message:msg}).catch(()=>{});
  },
  success(name){
    const ov = U.el('div','inst-overlay');
    const dlg = U.el('div','inst-dialog');
    const head = U.el('div','inst-head');
    head.append(U.el('div','em','✅'), U.el('h3',null,'Установка завершена'));
    const body = U.el('div','inst-body');
    const res = U.el('div','inst-result');
    res.append(U.el('div','em','🎉'), U.el('h3',null,name+' установлено'));
    res.append(U.el('p',null,'Приложение добавлено на рабочий стол и в меню Пуск.'));
    body.appendChild(res);
    const foot = U.el('div','inst-foot');
    const close = U.el('button','primary','Закрыть');
    close.addEventListener('click',()=>{ ov.remove(); });
    foot.appendChild(close);
    dlg.append(head, body, foot);
    ov.appendChild(dlg);
    document.body.appendChild(ov);
    Notify.push('✅ Установлено', name, '📦');
    this.current = null;
  }
};

M.installFile = async function(file){
  const info = await FileRecognizer.recognize(file);
  if(info.type === 'program' || info.type === 'android' || info.type === 'dio'){
    return InstallerDialog.start(file);
  }
  // Документы и медиа — сохраняем в БД и открываем соответствующее приложение
  const fileRec = { name: file.name, path: 'C:\\Users\\'+UserSession.name+'\\Downloads\\'+file.name, type: info.type, size: file.size, blob: file, createdAt: Date.now() };
  const fileId = await DB.addFile(fileRec);
  Notify.push('Файл', file.name + ' сохранён', '📥');
  M.Boot.openStoredFile(fileId);
};

  mounted: false,
  collapsed: false,
  showIndicators: true,
  collapsedCats: new Set(),
  search: '',
  isMounted(){ return this.mounted; },
  mount(){
    if(this.mounted) return;
    const panel = document.createElement('div');
    panel.id = 'controlPanel';
    panel.innerHTML = `
      <div id="cpHeader">
        <div id="cpStatus"></div>
        <h3>Панель управления</h3>
        <span id="cpEditionBadge">${Edition.get().short}</span>
        <button id="cpToggle" title="Свернуть">⟩</button>

        <input type="text" id="cpSearch" placeholder="🔍 Поиск сбоя…">
      </div>
      <div id="cpBody"></div>
      <div id="cpSettings"></div>
      <div id="cpSettingsToggle">⚙ Настройки панели</div>
    `;
    document.body.appendChild(panel);
    this.mounted = true;
    U.lsSet('controlPanelVisible', true);
    this.init();
  },
  unmount(){
    const panel = U.$('#controlPanel');
    if(panel) panel.remove();
    this.mounted = false;
    U.lsSet('controlPanelVisible', false);
  },
  toggle(){
    if(this.mounted) this.unmount();
    else this.mount();
  },
  init(){
    this.render();
    this.bind();
    if(!this._listenerAdded){
      SystemState.onChange(()=>{ if(this.mounted) this.updateIndicators(); });
      this._listenerAdded = true;
    }
    this.updateIndicators();
  },
  render(){
    const b = U.$('#cpBody'); if(!b) return;
    b.innerHTML = '';
    const metrics = U.el('div','cp-card'); metrics.id = 'cpMetrics'; b.appendChild(metrics);
    b.appendChild(U.el('div','cp-section-title','Происшествия'));
    const incWrap = U.el('div'); incWrap.id = 'cpIncidents'; b.appendChild(incWrap);
    b.appendChild(U.el('div','cp-section-title','Управление'));
    const ctrl = U.el('div','cp-grid'); ctrl.id = 'cpCtrl'; b.appendChild(ctrl);
    this.renderMetrics(); this.renderIncidents(); this.renderControls();
  },
  renderIncidents(){
    const wrap = U.$('#cpIncidents'); if(!wrap) return;
    wrap.innerHTML = '';
    Object.keys(CATEGORIES).forEach(catId=>{
      const cat = CATEGORIES[catId];
      let incs = INCIDENTS.filter(i=>i.cat===catId);
      if(this.search) incs = incs.filter(i=>i.name.toLowerCase().includes(this.search)||i.id.includes(this.search));
      if(!incs.length) return;
      const catEl = U.el('div','cp-cat');
      if(this.collapsedCats.has(catId)) catEl.classList.add('collapsed');
      const hdr = U.el('div','cp-cat-header');

        catEl.classList.toggle('collapsed');

        else this.collapsedCats.delete(catId);
      });
      const body = U.el('div','cp-cat-body');
      incs.forEach(inc=>{
        const btn = U.el('button','cp-btn'+(IncidentMgr.has(inc.id)?' active':''));
        btn.dataset.incident = inc.id;

          if(IncidentMgr.has(inc.id)) IncidentMgr.stop(inc.id);
          else IncidentMgr.start(inc.id);
        });
        body.appendChild(btn);
      });
      catEl.append(hdr, body); wrap.appendChild(catEl);

const Desktop = M.Desktop = {
  positions:{}, virusIcons:[], installedIcons:[],
  init(){ this.positions=U.lsGet('iconPos',{}); this.render(); this.bind(); },
  render(){
    const box = U.$('#icons'); if(!box) return;
    box.innerHTML = '';
    SYSTEM_ICONS.forEach((ic,i)=>{
      const d = U.el('div','dicon'); d.dataset.key = ic.key;
      let pos = this.positions[ic.key];
      if(!pos){ const col = Math.floor(i/7), row = i%7; pos = {x:18+col*92, y:18+row*100}; }
      d.style.left = pos.x+'px'; d.style.top = pos.y+'px';
      d.append(U.el('div','em',ic.icon), U.el('div','lb',ic.label));
      d.addEventListener('click', e=>{ e.stopPropagation(); U.$$('.dicon').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); });
      d.addEventListener('dblclick', ic.action);
      d.addEventListener('mousedown', e=>this.startDrag(e,d,ic.key));
      box.appendChild(d);
    });
    // Restore installed icons
    this.installedIcons.forEach(rec=>this.addInstalledIcon(rec.appId, rec.name, rec.icon, rec.isFile));
  },
  startDrag(e,d,key){
    if(e.button!==0) return;
    let dragging = false; const sx = e.clientX, sy = e.clientY;
    const ox = parseFloat(d.style.left), oy = parseFloat(d.style.top);
    const move = ev=>{ const dx = ev.clientX-sx, dy = ev.clientY-sy; if(!dragging&&Math.hypot(dx,dy)>5) dragging=true; if(dragging){ d.style.left = Math.max(0,ox+dx)+'px'; d.style.top = Math.max(0,oy+dy)+'px'; } };
    const up = ()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); if(dragging){ this.positions[key] = {x:parseFloat(d.style.left), y:parseFloat(d.style.top)}; U.lsSet('iconPos', this.positions); } };
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  },
  addVirusIcon(){
    const d = U.el('div','dicon virus');
    const icons = ['🦠','👾','💀'];
    d.append(U.el('div','em',icons[Math.floor(Math.random()*icons.length)]), U.el('div','lb','virus_'+Math.floor(Math.random()*1000)+'.exe'));
    d.style.left = U.rand(200, window.innerWidth-100)+'px';
    d.style.top = U.rand(100, window.innerHeight-150)+'px';
    const b = U.$('#icons'); if(b) b.appendChild(d);
    this.virusIcons.push(d);
  },
  removeVirusIcons(){ this.virusIcons.forEach(v=>v.remove()); this.virusIcons = []; },
  addInstalledIcon(appId, label, icon, isFile){
    const box = U.$('#icons'); if(!box) return;
    // если есть уже — обновим
    const ex = box.querySelector('[data-app-id="'+appId+'"]');
    if(ex) ex.remove();
    const idx = U.$$('.dicon').length;
    const col = Math.floor(idx/7), row = idx%7;
    const pos = {x:18+col*92+480, y:18+row*100};
    const d = U.el('div','dicon');
    d.dataset.key = appId;
    d.dataset.appId = appId;
    d.style.left = pos.x+'px'; d.style.top = pos.y+'px';
    const emBox = U.el('div','em');
    if(icon && icon.startsWith('data:')){
      const img = U.el('img'); img.src = icon; img.style.cssText = 'width:38px;height:38px;border-radius:8px;object-fit:cover';
      emBox.appendChild(img);
    } else emBox.textContent = icon || '📦';
    d.append(emBox, U.el('div','lb',label));
    d.addEventListener('click', e=>{ e.stopPropagation(); U.$$('.dicon').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); });
    d.addEventListener('dblclick', ()=>{
      if(isFile) M.Boot.openStoredFile(appId);
      else Apps.open(appId);
    });
    d.addEventListener('mousedown', e=>this.startDrag(e,d,appId));
    d.addEventListener('contextmenu', e=>{
      e.preventDefault(); e.stopPropagation();
      showCtx(e.clientX, e.clientY, [
        {icon:'🚀',label:'Открыть',action:()=>{ if(isFile) M.Boot.openStoredFile(appId); else Apps.open(appId); }},
        {icon:'🗑',label:'Удалить',action:async()=>{
          if(!confirm('Удалить «'+label+'»?')) return;
          await M.Boot.uninstallApp(appId);
          d.remove();
        }}
      ]);
    });
    box.appendChild(d);
    if(!isFile){
      if(!this.installedIcons.find(r=>r.appId===appId)) this.installedIcons.push({appId, name:label, icon});
    }
  }
};
let ctxEl = null;

function CalcEval(s){
  s = String(s).replace(/\s+/g,''); let i = 0;
  const num = ()=>{ let t=''; while(i<s.length&&/[0-9.]/.test(s[i])) t+=s[i++]; if(!t) throw new Error(); return parseFloat(t); };
  const atom = ()=>{
    if(s[i]==='('){ i++; const v=expr(); if(s[i]===')')i++; return v; }
    if(s[i]==='-'){ i++; return -atom(); }
    if(/[a-zA-Z]/.test(s[i]||'')){
      let name=''; while(i<s.length&&/[a-zA-Z]/.test(s[i])) name+=s[i++];
      if(s[i]==='('){ i++; const a=expr(); if(s[i]===')')i++;
        switch(name.toLowerCase()){ case 'sqrt':return Math.sqrt(a); case 'sin':return Math.sin(a); case 'cos':return Math.cos(a); case 'tan':return Math.tan(a); default:throw new Error(); }
      }
      if(name==='pi')return Math.PI; if(name==='e')return Math.E; throw new Error();
    }
    return num();
  };
  const power = ()=>{ let v=atom(); if(s[i]==='^'){ i++; v=Math.pow(v,power()); } while(s[i]==='%'){ i++; v/=100; } return v; };
  const term = ()=>{ let v=power(); while(s[i]==='*'||s[i]==='/'){ const op=s[i++]; const r=power(); if(op==='*') v*=r; else{ if(r===0)throw new Error(); v/=r; } } return v; };
  const expr = ()=>{ let v=term(); while(s[i]==='+'||s[i]==='-'){ const op=s[i++]; const r=term(); v = op==='+'?v+r:v-r; } return v; };
  const r = expr(); if(i<s.length) throw new Error(); return r;
}
Apps.register({id:'calculator',name:'Калькулятор',icon:'🧮',pinned:true,open(){
  const win = WM.create({appId:'calculator',title:'Калькулятор',icon:'🧮',width:340,height:480});
  const b = win.body; b.style.background = 'var(--win-solid)'; b.classList.add('calc');
  const disp = U.el('div','calc-disp');
  const exprEl = U.el('div','calc-expr',''); const valEl = U.el('div','calc-val','0');
  disp.append(exprEl, valEl);
  const keys = U.el('div','calc-keys');
  b.append(disp, keys);
  let expr = '', done = false;
  const upd = ()=>{ exprEl.textContent = expr; valEl.textContent = expr||'0'; };
  const press = tok=>{
    if(tok==='C'){ expr=''; done=false; upd(); return; }
    if(tok==='⌫'){ expr = expr.slice(0,-1); upd(); return; }
    if(tok==='='){ try{ const r = CalcEval(expr); if(!isFinite(r)) throw new Error(); expr = String(Number(r.toPrecision(12))); done=true; } catch(e){ valEl.textContent='Ошибка'; expr=''; return; } upd(); return; }
    if(done && /[0-9.]/.test(tok)) expr = '';
    done = false; expr += tok; upd();
  };
  ['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','%','='].forEach(k=>{
    const btn = U.el('button','ckey', k==='*'?'×':k==='/'?'÷':k==='-'?'−':k);
    if('+-*/%'.includes(k)) btn.classList.add('op');
    if(k==='=') btn.classList.add('eq');
    btn.addEventListener('click', ()=>press(k));
    keys.appendChild(btn);
  });
  const onKey = e=>{
    if(WM.activeId !== win.id) return;
    const k = e.key;
    if(/[0-9.]/.test(k) || '+-*/%()'.includes(k)){ press(k); e.preventDefault(); }
    else if(k==='Enter'){ press('='); e.preventDefault(); }
    else if(k==='Backspace'){ press('⌫'); e.preventDefault(); }
    else if(k==='Escape'){ press('C'); e.preventDefault(); }
  };
  document.addEventListener('keydown', onKey);
  win.close = ((orig)=>function(){ document.removeEventListener('keydown',onKey); orig(); })(win.close);
  upd();
}});

Apps.register({id:'terminal',name:'Терминал',icon:'⌨️',pinned:true,open(){
  const win = WM.create({appId:'terminal',title:'Терминал',icon:'⌨️',width:740,height:460});
  const term = U.el('div','term'); win.body.appendChild(term);
  let cwd = [];
  let hist = U.lsGet('term.history',[]); let hi = hist.length;
  const promptStr = ()=>'microOS:\\'+cwd.join('\\')+'> ';
  const write = (txt,cls)=>{ term.appendChild(U.el('div','line'+(cls?' '+cls:''),txt)); term.scrollTop = term.scrollHeight; };
  function writePrompt(){
    const line = U.el('div','line');
    line.append(U.el('span','prompt',promptStr()));
    const inp = U.el('input','term-input');
    line.appendChild(inp); term.appendChild(line); inp.focus();
    if(M.IncidentMgr.has('kbFail')) inp.disabled = true;
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        const cmd = inp.value; inp.disabled = true;
        if(cmd.trim()){ hist.push(cmd); if(hist.length>100) hist.shift(); U.lsSet('term.history',hist); hi = hist.length; }
        write(promptStr()+cmd); run(cmd); writePrompt();
      } else if(e.key==='ArrowUp'){ if(hi>0){ hi--; inp.value = hist[hi]||''; } e.preventDefault(); }
      else if(e.key==='ArrowDown'){ if(hi<hist.length-1){ hi++; inp.value = hist[hi]||''; } else { hi = hist.length; inp.value=''; } e.preventDefault(); }
    });
  }
  function run(raw){
    const parts = raw.trim().split(/\s+/);
    const cmd = (parts[0]||'').toLowerCase();
    const args = parts.slice(1); const arg = args.join(' ');
    switch(cmd){
      case '': break;
      case 'help':
        write('Команды:','ok');
        ['help','dir / ls','cd <path>','mkdir <name>','echo <text>','type <file>','del <file>','cls / clear','date / time','whoami','color <#hex>','tasklist','kill <pid>','scan','fix','chkdsk','sfc','sync','install <id>','apps','uninstall <id>','exit'].forEach(l=>write('  '+l));
        write('');
        write('  su disasters — панель происшествий (секретно)', 'ok');
        break;
      case 'su':
        if(arg === 'disasters'){
          M.ControlPanel.toggle();
          write(M.ControlPanel.isMounted() ? '🔓 Панель активирована' : '🔒 Панель скрыта', 'ok');
        } else write('Неверный пароль. Используйте: su disasters', 'err');
        break;
      case 'install':
        if(!arg){ write('Укажите ID приложения из apps','err'); break; }
        DB.getApp(parseInt(arg,10)).then(app=>{
          if(!app){ write('Не найдено','err'); return; }
          M.Boot.launchStoredApp(app);
          write('Запуск: '+app.name,'ok');
        }).catch(e=>write('Ошибка: '+e.message,'err'));
        break;
      case 'apps':
        write('Установленные приложения:','ok');
        DB.getAllApps().then(list=>{
          if(!list.length){ write('  <пусто>'); return; }
          list.forEach(a=>write('  ['+a.id+'] '+a.name+' v'+a.version+' ('+a.appType+')'));
        });
        break;
      case 'uninstall':
        if(!arg){ write('Укажите ID','err'); break; }
        DB.deleteApp(parseInt(arg,10)).then(()=>{
          M.Boot.loadInstalledApps();
          write('Удалено','ok');
        }).catch(e=>write('Ошибка','err'));
        break;
      case 'dir': case 'ls':
        { const n = FS.resolve(cwd);
          write(' \\'+cwd.join('\\'));
          if(!n || !n.children || !n.children.length){ write('  <пусто>'); break; }
          n.children.forEach(c=>write('  '+(c.type==='folder'?'[DIR] ':'      ')+c.name));
          break; }
      case 'cd':
        { if(!arg){ cwd=[]; break; }
          if(arg==='..'){ cwd.pop(); break; }
          const t = [...cwd,arg]; const n = FS.resolve(t);
          if(n && n.type==='folder') cwd = t; else write('Не найдено','err');
          break; }
      case 'mkdir':
        if(!arg){ write('Укажите имя','err'); break; }
        write(FS.mkdir(cwd,arg)?'OK':'Ошибка','ok'); break;
      case 'echo': write(arg); break;
      case 'type':
        { const c = FS.readFile([...cwd,arg]); write(c!=null?c:'Не найдено', c!=null?'':'err'); break; }
      case 'del':
        write(FS.remove([...cwd,arg])?'Удалено':'Не найдено','ok'); break;
      case 'cls': case 'clear': term.innerHTML = ''; break;
      case 'date': write(new Date().toLocaleDateString('ru-RU')); break;
      case 'time': write(new Date().toLocaleTimeString('ru-RU')); break;
      case 'whoami': write(UserSession.name); break;
      case 'color':
        if(/^#[0-9a-f]{6}$/i.test(arg)){ Settings.set('accent',arg); write('OK','ok'); } else write('Формат: #rrggbb','err');
        break;
      case 'tasklist':
        write(' PID   App                 CPU   RAM','ok');
        WM.wins.forEach((w,i)=>{
          const cpu = Math.max(1, Math.round(SystemState.cpu/(WM.wins.length+1)));
          const ram = Math.round(SystemState.ramMB/(WM.wins.length+2)/4);
          write(` ${String(i+1).padStart(3,' ')}   ${(w.appId||'app').padEnd(20,' ')} ${String(cpu).padStart(3,' ')}%  ${ram}M`);
        });
        break;
      case 'kill':
        { const idx = parseInt(arg,10)-1;
          if(idx>=0 && idx<WM.wins.length){ WM.close(WM.wins[idx].id); write('OK','ok'); } else write('Нет PID','err');
          break; }
      case 'scan':
        if(SystemState.viruses>0){ write('Угроз: '+SystemState.viruses+'. Очистка...','err'); IncidentMgr.normalize(); write('Чисто','ok'); }
        else write('Чисто','ok');
        break;
      case 'fix': IncidentMgr.normalize(); write('OK','ok'); break;
      case 'chkdsk': write('Проверка...','ok'); setTimeout(()=>{ write('Готово ✓','ok'); IncidentMgr.stop('fsCrash'); },1500); break;
      case 'sfc': write('Сканирование...','ok'); setTimeout(()=>{ write('Готово ✓','ok'); IncidentMgr.stop('registryCrash'); },1800); break;
      case 'sync': M.Boot.timeOffset = 0; IncidentMgr.stop('timeFail'); write('OK','ok'); break;
      case 'exit': win.close(); break;
      default: write('Неизвестно: '+cmd,'err');
    }
  }
  write('microOS Terminal v11.0','ok');
  write('Введите help для списка команд.'); write('');
  writePrompt();
  term.addEventListener('click', ()=>{ const l = term.querySelector('.term-input:not([disabled])'); if(l) l.focus(); });
}});
