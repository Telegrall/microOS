<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-version="v11-pro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>microOS 11</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#0078d4;--accent-rgb:0,120,212;--tb-h:46px;--radius:10px;--radius-window:8px;--radius-button:6px;--blur:24px;--font-family:'Segoe UI',system-ui,sans-serif;--font-size-base:14px;--taskbar-align:center;--start-menu-align:center}
html[data-theme="dark"]{--bg:#0d0d0d;--text:#fff;--dim:#a8a8a8;--win-bg:rgba(32,32,32,.9);--win-solid:#202020;--panel:rgba(28,28,28,.82);--border:rgba(255,255,255,.09);--hover:rgba(255,255,255,.07);--input:rgba(255,255,255,.06);--shadow:0 12px 40px rgba(0,0,0,.55);--shadow-sm:0 2px 10px rgba(0,0,0,.35)}
html[data-theme="light"]{--bg:#f3f3f3;--text:#1b1b1b;--dim:#5c5c5c;--win-bg:rgba(250,250,250,.92);--win-solid:#fafafa;--panel:rgba(243,243,243,.88);--border:rgba(0,0,0,.1);--hover:rgba(0,0,0,.06);--input:rgba(0,0,0,.05);--shadow:0 12px 40px rgba(0,0,0,.25);--shadow-sm:0 2px 10px rgba(0,0,0,.12)}
html,body{height:100%;overflow:hidden;font-family:var(--font-family);font-size:var(--font-size-base)}
body{color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
input,textarea,select{background:var(--input);border:1px solid var(--border);border-radius:6px;padding:6px 10px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border-radius:6px}
.hidden{display:none!important}
.switch{width:40px;height:22px;border-radius:11px;background:rgba(128,128,128,.45);position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:4px;left:4px;transition:transform .2s}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(18px)}

/* VERSIONS - 10 штук */
html[data-version] .window{border-radius:var(--radius-window)}
html[data-version] .panel,html[data-version] .dialog,html[data-version] .notif{border-radius:var(--radius-window)}
html[data-version] button,html[data-version] input,html[data-version] .tbtn{border-radius:var(--radius-button)}
html[data-version] .window,html[data-version] .panel{backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}

/* microOS 10 - базовая */
html[data-version^="v10"]{--radius-window:4px;--radius-button:3px;--blur:10px;--taskbar-align:left;--start-menu-align:left}
html[data-version^="v10"] #tbCenter{position:static;transform:none;margin-left:8px}
html[data-version^="v10"] #taskbar{justify-content:flex-start}
html[data-version^="v10"] #tbTray{margin-left:auto}
html[data-version^="v10"] #startMenu{left:8px;transform:none;width:420px;height:auto;max-height:600px;padding:12px 12px 0}
html[data-version^="v10"] #startMenu.closed{transform:translateY(16px) scale(.97)}
html[data-version^="v10"] #smPinnedWrap .sm-pinned{grid-template-columns:repeat(4,1fr)}
html[data-version^="v10"] .lock-content{position:absolute;bottom:80px;left:60px;text-align:left}
html[data-version^="v10"] #bsod .qrw{display:none!important}
html[data-version^="v10"] #bsod .frown{font-size:110px}

html[data-version="v10-std"]{--radius-window:4px;--radius-button:3px;--blur:8px;--win-bg:rgba(240,240,240,.92);--win-solid:#f0f0f0;--text:#1a1a1a;--dim:#555;--border:rgba(0,0,0,.12);--panel:rgba(245,245,245,.9)}
html[data-version="v10-home"]{--radius-window:4px;--radius-button:3px;--blur:12px}
html[data-version="v10-pro"]{--radius-window:4px;--radius-button:3px;--blur:14px}
html[data-version="v10-pro"] .window{background:rgba(20,20,25,.94)}
html[data-version="v10-pro-max"]{--radius-window:6px;--radius-button:4px;--blur:16px}
html[data-version="v10-pro-max"] .window{background:rgba(25,25,35,.92)}
html[data-version="v10-ultra"]{--radius-window:6px;--radius-button:4px;--blur:16px;--bg:#0a0818;--text:#e8f4ff;--win-bg:rgba(15,10,30,.94);--win-solid:#0f0a1e;--panel:rgba(10,5,25,.92);--border:rgba(0,180,216,.25);--hover:rgba(0,180,216,.1);--dim:#7fb8c8}
html[data-version="v10-ultra"] .window{border:1px solid rgba(0,180,216,.3);box-shadow:0 0 20px rgba(0,180,216,.15)}

/* microOS 11 - базовая */
html[data-version^="v11"]{--radius-window:8px;--radius-button:6px;--blur:28px;--taskbar-align:center;--start-menu-align:center}
html[data-version="v11-std"]{--radius-window:8px;--radius-button:6px;--blur:24px;--win-bg:rgba(250,250,250,.92);--win-solid:#fafafa;--text:#1a1a1a;--dim:#555;--border:rgba(0,0,0,.1)}
html[data-version="v11-home"]{--radius-window:8px;--radius-button:6px;--blur:28px}
html[data-version="v11-pro"]{--radius-window:8px;--radius-button:6px;--blur:28px}
html[data-version="v11-pro"] .window{background:rgba(32,32,32,.92)}
html[data-version="v11-pro-max"]{--radius-window:10px;--radius-button:8px;--blur:32px}
html[data-version="v11-pro-max"] .window{background:rgba(28,32,42,.9);box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
html[data-version="v11-ultra"]{--radius-window:12px;--radius-button:10px;--blur:60px;--accent:#7B68EE;--accent-rgb:123,104,238;--bg:#0a0520;--text:#f0e8ff;--win-bg:rgba(20,15,40,.85);--win-solid:#140f28;--panel:rgba(15,10,35,.82);--border:rgba(123,104,238,.3);--hover:rgba(123,104,238,.15);--dim:#a090c0}
html[data-version="v11-ultra"] body{background:linear-gradient(135deg,#0a0520,#1a1040,#0a0520);background-size:200% 200%;animation:qBg 15s ease infinite}
@keyframes qBg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
html[data-version="v11-ultra"] .window{box-shadow:0 0 30px rgba(123,104,238,.3),0 0 60px rgba(0,229,255,.15)}

/* BOOTLOADER */
#bootloader{position:fixed;inset:0;z-index:3000;background:#0a0a0a;color:#e0e0e0;display:flex;align-items:center;justify-content:center;font-family:Consolas,'Courier New',monospace;overflow:hidden}
#bootloader.hidden{display:none}
#bootloader .boot-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,0,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,0,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.boot-inner{text-align:center;max-width:640px;padding:20px;position:relative;z-index:1}
.boot-title{font-size:42px;font-weight:400;letter-spacing:3px;color:#fff;text-shadow:0 0 20px rgba(0,255,100,.6),0 0 40px rgba(0,255,100,.3);margin-bottom:8px;animation:bootGlow 2s ease-in-out infinite alternate}
@keyframes bootGlow{from{text-shadow:0 0 20px rgba(0,255,100,.6),0 0 40px rgba(0,255,100,.3)}to{text-shadow:0 0 30px rgba(0,255,100,.9),0 0 60px rgba(0,255,100,.5)}}
.boot-version{font-size:13px;color:#7a8a7a;margin-bottom:40px;letter-spacing:1px}
.boot-progress{width:400px;max-width:80vw;height:4px;background:#1a1a1a;border-radius:2px;margin:0 auto 18px;overflow:hidden}
.boot-progress > div{height:100%;width:0;background:linear-gradient(90deg,#00ff64,#00a844);border-radius:2px;box-shadow:0 0 10px rgba(0,255,100,.5);transition:width .05s linear}
.boot-status{font-size:12px;color:#7a8a7a;letter-spacing:1px}
.boot-status .blink{animation:bootBlink 1s infinite}
@keyframes bootBlink{50%{opacity:0}}

/* ACTIVATION */
#activationFlow{position:fixed;inset:0;z-index:2900;background:#0d0d0d;color:#e0e0e0;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;overflow-y:auto}
#activationFlow.hidden{display:none}
.act-screen{width:100%;max-width:560px;padding:40px;text-align:center;animation:actIn .4s ease}
@keyframes actIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.act-icon{font-size:56px;margin-bottom:20px}
.act-title{font-size:24px;font-weight:300;margin-bottom:12px;color:#fff}
.act-subtitle{font-size:14px;opacity:.75;margin-bottom:28px;line-height:1.5}
.act-input{width:100%;padding:14px 18px;font-family:Consolas,monospace;font-size:15px;letter-spacing:1px;background:#181818;border:2px solid #333;border-radius:8px;color:#fff;outline:none;text-align:center}
.act-input:focus{border-color:#4aa3ff;background:#1a1a1a}
.act-input.err{border-color:#e74c3c;animation:actShake .4s}
@keyframes actShake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.act-btn{width:100%;margin-top:18px;padding:13px;border-radius:8px;background:#0078d4;color:#fff;font-size:15px;font-weight:500;cursor:pointer;border:none}
.act-btn:hover{background:#1a8ae4}
.act-btn:disabled{opacity:.5;cursor:not-allowed}
.act-error{color:#f48771;font-size:13px;min-height:20px;margin-top:12px;font-weight:500}
.act-hint{font-size:11px;color:#555;margin-top:16px;cursor:pointer;text-decoration:underline;opacity:.6}
.act-verify{width:100%;max-width:520px;padding:40px;text-align:center}
.act-verify .act-icon{font-size:72px;animation:actSpin 3s linear infinite}
@keyframes actSpin{to{transform:rotate(360deg)}}
.act-verify-title{font-size:20px;font-weight:300;margin-bottom:24px}
.act-verify-progress{width:100%;height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin-bottom:16px}
.act-verify-progress > div{height:100%;width:0;background:linear-gradient(90deg,#0078d4,#4aa3ff);border-radius:3px;transition:width .15s linear}
.act-verify-pct{font-size:12px;color:#888;margin-bottom:8px}
.act-verify-msg{font-size:13px;color:#aaa;min-height:20px;transition:opacity .3s}
.act-verify-msg.done{color:#2ecc71;font-weight:500}
.act-shutdown{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#000;color:#fff;position:fixed;inset:0}
.act-shutdown-text{font-size:20px;font-weight:300;letter-spacing:1px}
.act-shutdown-spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:actSpin 1s linear infinite}
.act-greeting{width:100%;max-width:600px;padding:40px;text-align:center;animation:actIn 1s ease}
.act-greeting-title{font-size:48px;font-weight:300;letter-spacing:-1px;margin-bottom:16px;background:linear-gradient(135deg,#4aa3ff,#a06bff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.act-greeting-sub{font-size:16px;opacity:.8;margin-bottom:40px}
.act-greeting-hint{font-size:14px;opacity:.6;margin-bottom:24px}

/* VERSION SELECT */
.version-screen{width:100%;height:100%;display:flex;flex-direction:column;padding:20px;overflow-y:auto;background:#0d0d0d;color:#fff}
.version-header{text-align:center;padding:20px 0}
.version-step{font-size:14px;color:#7cc4ff;margin-bottom:8px}
.version-title{font-size:30px;font-weight:300;margin-bottom:10px}
.version-sub{font-size:14px;opacity:.7}
.version-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.version-tab{padding:10px 20px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff}
.version-tab.active{background:rgba(74,163,255,.25);border-color:#4aa3ff}
.version-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-width:1400px;margin:0 auto;width:100%;padding:0 10px 20px}
.version-card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:16px;cursor:pointer;transition:all .2s;position:relative;display:flex;flex-direction:column;gap:8px;text-align:left}
.version-card:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.version-card.selected{border-color:#4aa3ff;box-shadow:0 0 0 3px rgba(74,163,255,.3),0 8px 30px rgba(74,163,255,.4)}
.version-preview{height:130px;border-radius:8px;position:relative;overflow:hidden;border:1px solid}
.version-ptaskbar{position:absolute;left:0;right:0;height:18px}
.version-picon{position:absolute;width:12px;height:12px;border-radius:2px}
.version-pwin{position:absolute;top:22px;left:20px;right:20px;border-radius:4px;border:1px solid}
.version-name{font-size:14px;font-weight:600;color:#fff}
.version-model{font-size:10.5px;color:#7cc4ff;text-transform:uppercase;letter-spacing:.5px}
.version-desc{font-size:11px;opacity:.7;line-height:1.4;min-height:30px}
.version-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.version-tag{font-size:9.5px;padding:2px 6px;border-radius:4px;font-weight:600}
.version-check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#4aa3ff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.version-footer{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px;border-top:1px solid rgba(255,255,255,.1);margin-top:auto;max-width:1400px;margin-left:auto;margin-right:auto;width:100%}
.version-back{padding:10px 24px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;cursor:pointer}
.version-next{padding:10px 32px;border-radius:8px;background:#0078d4;border:none;color:#fff;font-size:14px;font-weight:500;cursor:pointer}

/* DESKTOP & WINDOWS */
#wallpaper{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0;transition:background .4s,filter .3s}
#desktop{position:fixed;inset:0;z-index:1}
#icons{position:absolute;inset:0}
.dicon{position:absolute;width:84px;padding:8px 4px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .15s;text-align:center;cursor:default}
.dicon:hover{background:var(--hover)}
.dicon.sel{background:rgba(var(--accent-rgb),.28);outline:1px solid rgba(var(--accent-rgb),.5)}
.dicon .em{font-size:34px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.dicon .lb{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);word-break:break-word;max-width:80px;line-height:1.2}
#winLayer{position:fixed;inset:0;z-index:10;pointer-events:none}
.window{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--win-bg);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;min-width:340px;min-height:220px;transition:opacity .18s,transform .18s,box-shadow .18s}
.window.active{box-shadow:var(--shadow);border-color:rgba(var(--accent-rgb),.35)}
.window.opening{animation:winIn .2s cubic-bezier(.2,.9,.3,1)}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.window.closing{opacity:0;transform:scale(.94) translateY(10px)}
.window.minimized{opacity:0;transform:scale(.7) translateY(60vh);pointer-events:none}
.win-tb{height:36px;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border-bottom:1px solid var(--border);flex:none;cursor:default}
.win-ic{font-size:15px}
.win-title{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-ctr{display:flex;gap:2px}
.win-btn{width:36px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .15s}
.win-btn:hover{background:var(--hover)}.win-btn.close:hover{background:#e81123;color:#fff}
.win-body{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0;position:relative}
.rz{position:absolute;z-index:5}
.rz.n{top:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rz.s{bottom:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rz.e{right:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz.w{left:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz.se,.rz.sw,.rz.ne,.rz.nw{width:14px;height:14px}
.rz.se{bottom:-3px;right:-3px;cursor:nwse-resize}
.rz.sw{bottom:-3px;left:-3px;cursor:nesw-resize}
.rz.ne{top:-3px;right:-3px;cursor:nesw-resize}
.rz.nw{top:-3px;left:-3px;cursor:nwse-resize}

/* TASKBAR */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:100;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 8px}
#tbCenter{display:flex;align-items:center;gap:4px;position:absolute;left:50%;transform:translateX(-50%)}
.tb-btn{width:44px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;transition:background .15s;color:var(--text)}
.tb-btn:hover{background:var(--hover)}
.tb-btn.running::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:var(--accent);transition:width .2s}
.tb-btn.focused::after{width:16px}
.tb-btn img{width:22px;height:22px;border-radius:4px;object-fit:cover}
.tb-logo{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.tb-logo i{background:var(--accent);border-radius:1px;display:block}
#tbTray{margin-left:auto;display:flex;align-items:center;gap:2px}
.tray-btn{height:34px;min-width:32px;padding:0 8px;border-radius:6px;display:flex;align-items:center;gap:6px;font-size:13px;transition:background .15s;color:var(--text)}
.tray-btn:hover{background:var(--hover)}
#trayClock{flex-direction:column;font-size:11px;line-height:1.15;padding:0 8px}
#trayClock .t{font-weight:500}#trayClock .d{font-size:10px;color:var(--dim)}
.tray-btn.err{color:#ff5555}
.install-btn{display:flex;align-items:center;gap:4px;background:rgba(var(--accent-rgb),.15);border:1px solid rgba(var(--accent-rgb),.35)}
.install-btn .lbl-inst{font-size:11.5px;font-weight:600}
@media(max-width:1280px){.install-btn .lbl-inst{display:none}}

/* PANELS */
.panel{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);transition:opacity .18s,transform .18s;transform-origin:bottom center}
.panel.closed{opacity:0;transform:translateY(16px) scale(.97);pointer-events:none}
#startMenu{left:50%;bottom:calc(var(--tb-h) + 8px);transform:translateX(-50%);width:620px;max-width:calc(100vw - 24px);height:620px;max-height:calc(100vh - 90px);padding:18px 20px 0;display:flex;flex-direction:column}
#startMenu.closed{transform:translateX(-50%) translateY(16px) scale(.97)}
.sm-search input{width:100%;padding:9px 14px;border-radius:20px;margin-bottom:14px;font-size:13px}
.sm-scroll{flex:1;overflow-y:auto;margin-bottom:8px}
.sm-h{font-size:12px;font-weight:600;color:var(--dim);margin:10px 0 8px}
.sm-pinned{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:8px;font-size:11px;transition:background .15s;text-align:center;cursor:pointer}
.sm-app:hover{background:var(--hover)}
.sm-app .em{font-size:26px;line-height:1;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.sm-app .em img{width:26px;height:26px;border-radius:6px;object-fit:cover}
.sm-row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:6px;font-size:13px;transition:background .15s;cursor:pointer}
.sm-row:hover{background:var(--hover)}
.sm-row .em{font-size:19px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.sm-row .em img{width:20px;height:20px;border-radius:4px}
.sm-footer{display:flex;align-items:center;gap:8px;padding:12px 0;margin:0 -20px;padding-left:20px;padding-right:20px;border-top:1px solid var(--border);background:rgba(128,128,128,.07)}
.sm-user{display:flex;align-items:center;gap:10px;flex:1;padding:4px 8px;border-radius:6px}
.sm-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;overflow:hidden}
.sm-avatar img{width:100%;height:100%;object-fit:cover}
.sm-power{width:36px;height:36px;border-radius:6px;font-size:16px;display:flex;align-items:center;justify-content:center}
.sm-power:hover{background:var(--hover)}

#notifs{position:fixed;right:10px;bottom:calc(var(--tb-h) + 10px);z-index:300;display:flex;flex-direction:column;gap:8px;width:340px;max-width:calc(100vw - 20px);pointer-events:none}
.notif{background:var(--panel);border:1px solid var(--border);padding:12px 14px;box-shadow:var(--shadow);animation:notifIn .24s;display:flex;gap:10px;pointer-events:auto;font-size:12.5px}
.notif.out{animation:notifOut .2s forwards}
.notif .em{font-size:20px}
.notif b{display:block;font-size:13px;margin-bottom:2px}
@keyframes notifIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes notifOut{to{opacity:0;transform:translateX(60px)}}

.ctx{position:fixed;z-index:500;min-width:200px;padding:5px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);animation:ctxIn .12s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ctx-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:5px;font-size:13px;transition:background .12s;cursor:pointer}
.ctx-item:hover{background:var(--hover)}

/* CONTROL PANEL */
#controlPanel{position:fixed;right:8px;top:8px;bottom:calc(var(--tb-h) + 8px);width:310px;z-index:150;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .25s;overflow:hidden;animation:cpIn .3s ease}
@keyframes cpIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}
#controlPanel.collapsed{transform:translateX(calc(100% - 44px))}
#cpHeader{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap}
#cpHeader h3{font-size:12.5px;font-weight:600;flex:1;min-width:100px}
#cpStatus{width:10px;height:10px;border-radius:50%;background:#2ecc71;box-shadow:0 0 8px currentColor}
#cpToggle{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}
#cpSearchWrap{padding:10px 12px;border-bottom:1px solid var(--border);flex:none}
#cpSearchWrap input{width:100%;padding:6px 10px;border-radius:6px;font-size:12px}
#cpBody{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.cp-section-title{font-size:10.5px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:4px 0}
.cp-cat{background:rgba(128,128,128,.05);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cp-cat-header{padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:600}
.cp-cat-header .arrow{margin-left:auto;font-size:10px;opacity:.6;transition:transform .2s}
.cp-cat.collapsed .arrow{transform:rotate(-90deg)}
.cp-cat-body{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 6px 6px;max-height:400px;overflow-y:auto}
.cp-cat.collapsed .cp-cat-body{display:none}
.cp-card{background:rgba(128,128,128,.08);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.cp-metric{margin-bottom:9px}
.cp-row{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px}
.cp-row .v{font-weight:600;font-variant-numeric:tabular-nums}
.cp-bar{height:6px;border-radius:3px;background:rgba(128,128,128,.2);overflow:hidden}
.cp-bar > div{height:100%;background:var(--accent);width:0;transition:width .3s;border-radius:3px}
.cp-bar.warn > div{background:#f39c12}
.cp-bar.danger > div{background:#e74c3c}
.cp-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cp-btn{display:flex;align-items:center;gap:6px;padding:7px;border-radius:6px;background:rgba(128,128,128,.1);border:1px solid var(--border);font-size:10.5px;transition:background .15s;text-align:left;line-height:1.2}
.cp-btn:hover{background:rgba(var(--accent-rgb),.18)}
.cp-btn.wide{grid-column:1/-1;font-size:11.5px;padding:8px}
.cp-btn.danger{background:rgba(231,76,60,.15);border-color:rgba(231,76,60,.3)}
.cp-btn.success{background:rgba(46,204,113,.15);border-color:rgba(46,204,113,.3)}
.cp-btn.active{background:rgba(231,76,60,.35);border-color:#e74c3c}
.cp-btn .em{font-size:14px;flex:none}
.cp-btn small{color:var(--dim);font-size:9px;display:block;margin-top:1px}

/* DIALOGS / BSOD */
.dialog-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{background:var(--win-solid);border:1px solid var(--border);min-width:380px;max-width:540px;width:100%;box-shadow:var(--shadow);overflow:hidden;color:var(--text);border-radius:var(--radius-window)}
.dialog-tb{padding:10px 14px;background:rgba(128,128,128,.1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.dialog-bd{padding:16px 20px;display:flex;gap:14px;font-size:13px;line-height:1.5;max-height:60vh;overflow-y:auto}
.dialog-ic{font-size:32px;line-height:1;flex:none}
.dialog-ft{padding:10px 14px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);background:rgba(128,128,128,.05)}
.dialog-ft button{padding:6px 18px;border-radius:5px;background:var(--input);border:1px solid var(--border);font-size:12.5px;cursor:pointer}
.dialog-ft button:hover{background:var(--hover)}
.dialog-ft button.primary{background:var(--accent);color:#fff;border-color:transparent}

#bsod{position:fixed;inset:0;z-index:1000;background:#0078d7;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:8vh 10vw;gap:16px}
#bsod .frown{font-size:88px;line-height:1;font-weight:300}
#bsod .msg{font-size:22px;line-height:1.4;max-width:700px}
#bsod .code{font-size:15px;opacity:.9;margin-top:8px}
#bsod .qrw{display:flex;gap:30px;align-items:center;margin-top:18px;font-size:13px}
#bsod .progress{width:200px;height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;margin-top:8px}
#bsod .progress > div{height:100%;background:#fff;width:0;transition:width .15s}
#bsod .pct{margin-top:6px;font-size:12px;opacity:.85}
#bsod .foot{position:absolute;bottom:6vh;left:10vw;font-size:11px;opacity:.7}

#powerScreen{position:fixed;inset:0;z-index:1100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff}
#powerScreen .logo{font-size:44px;font-weight:300;letter-spacing:-1px}
#powerScreen .sub{font-size:13px;opacity:.6}
#powerScreen .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#powerScreen button{margin-top:16px;padding:10px 36px;border-radius:22px;background:#fff;color:#000;font-weight:600}
#fadeBlack{position:fixed;inset:0;z-index:900;background:#000;opacity:0;pointer-events:none;transition:opacity .15s}

/* Effects */
body.shaking #desktop,body.shaking #winLayer{animation:shake .15s infinite}
@keyframes shake{25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(1px,2px)}}
body.invert{filter:invert(1) hue-rotate(180deg)}
body.grayscale #winLayer,body.grayscale #desktop,body.grayscale #taskbar{filter:grayscale(1)}
#kbOverlay{position:fixed;bottom:calc(var(--tb-h)+8px);left:50%;transform:translateX(-50%);z-index:350;display:none;padding:8px 16px;background:#e74c3c;color:#fff;border-radius:6px;font-size:12px;font-weight:600}
body.kbFail #kbOverlay{display:block}
#mouseBlock{position:fixed;inset:0;z-index:80;display:none;cursor:not-allowed}
#mouseBlock::after{content:'🖱  Устройство указывающее не отвечает';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:10px 20px;background:rgba(231,76,60,.9);color:#fff;border-radius:8px;font-size:13px;font-weight:600}
body.mouseFail #mouseBlock{display:block}

#dropOverlay{position:fixed;inset:0;z-index:900;background:rgba(var(--accent-rgb),.25);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;pointer-events:none}
#dropOverlay.hidden{display:none}
.drop-zone{border:3px dashed #fff;border-radius:20px;padding:60px 80px;text-align:center;color:#fff;background:rgba(0,0,0,.35)}
.drop-icon{font-size:72px;margin-bottom:12px}
.drop-text{font-size:20px;font-weight:600}

/* Installer */
.inst-overlay{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.inst-dialog{background:var(--win-solid);border:1px solid var(--border);min-width:480px;max-width:560px;width:100%;box-shadow:var(--shadow);overflow:hidden;color:var(--text);border-radius:var(--radius-window)}
.inst-head{padding:14px 18px;background:linear-gradient(135deg,rgba(var(--accent-rgb),.15),rgba(var(--accent-rgb),.05));border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.inst-head .em{font-size:26px}
.inst-head h3{font-size:14.5px;font-weight:600;margin:0;flex:1}
.inst-body{padding:18px 20px;font-size:13px;line-height:1.55;max-height:60vh;overflow-y:auto}
.inst-foot{padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;background:rgba(128,128,128,.05);border-top:1px solid var(--border)}
.inst-foot button{padding:7px 20px;border-radius:6px;border:1px solid var(--border);background:var(--input);font-size:12.5px;cursor:pointer}
.inst-foot button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:500}
.inst-file-info{display:flex;gap:14px;padding:12px;background:var(--input);border:1px solid var(--border);border-radius:8px;margin-bottom:12px}
.inst-file-info .em{font-size:44px;display:flex;align-items:center;justify-content:center;min-width:52px}
.inst-file-info .em img{width:52px;height:52px;border-radius:10px;object-fit:cover}
.inst-file-info .meta{flex:1;min-width:0}
.inst-file-info .nm{font-size:13.5px;font-weight:600;word-break:break-all;margin-bottom:4px}
.inst-file-info .sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.inst-file-info .sig-ok{color:#2ecc71;font-weight:600}
.inst-file-info .sig-bad{color:#e74c3c;font-weight:600}
.inst-progress{height:10px;border-radius:5px;background:var(--input);overflow:hidden;margin:12px 0}
.inst-progress > div{height:100%;width:0;background:var(--accent);transition:width .3s;border-radius:5px}
.inst-pct{text-align:right;font-size:11.5px;color:var(--dim)}
.inst-result{padding:24px;text-align:center}
.inst-result .em{font-size:56px;display:block;margin-bottom:12px}
.inst-result h3{font-size:16px;margin-bottom:6px}
.inst-result p{font-size:12.5px;color:var(--dim)}
.uac-dialog{background:#f0f6ff;color:#000;border-radius:8px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden;border:1px solid #1a73e8}
.uac-dialog.unsigned{background:#fff8e7;border-color:#c98910}
.uac-hdr{padding:16px 20px;background:#1a73e8;color:#fff;display:flex;align-items:center;gap:10px;font-weight:600}
.uac-dialog.unsigned .uac-hdr{background:#c98910}
.uac-body{padding:20px;color:#000;font-size:13px;line-height:1.55}
.uac-foot{padding:12px 20px;background:#f5f5f5;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #ddd}
.uac-foot button{padding:8px 22px;border-radius:4px;border:1px solid #ccc;background:#fff;color:#000;cursor:pointer;font-size:12.5px}
.uac-foot button.yes{background:#1a73e8;color:#fff;border-color:transparent;font-weight:600}
.checkbox-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;cursor:pointer;padding:8px;background:var(--input);border-radius:6px;border:1px solid var(--border)}
.checkbox-row input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* VIRTUAL MACHINE */
.vm-window{background:#0a0a0a!important}
.vm-window .win-tb{background:linear-gradient(90deg,#1a1a2e,#16213e);color:#e0e0e0;border-bottom-color:#0f3460}
.vm-window .win-title{color:#e0e0e0}
.vm-toolbar{padding:8px 10px;background:#0f0f1e;border-bottom:1px solid #1a1a2e;display:flex;align-items:center;gap:6px;flex:none}
.vm-btn{padding:5px 12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:5px;color:#e0e0e0;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:background .15s}
.vm-btn:hover{background:rgba(255,255,255,.15)}
.vm-btn:disabled{opacity:.4;cursor:not-allowed}
.vm-btn.primary{background:#0078d4;border-color:transparent}
.vm-btn.danger{background:rgba(231,76,60,.2);border-color:rgba(231,76,60,.4)}
.vm-status{margin-left:auto;font-size:11px;color:#80ff80;font-weight:600;display:flex;align-items:center;gap:6px}
.vm-status .dot{width:8px;height:8px;border-radius:50%;background:#80ff80;animation:vmPulse 1.5s infinite}
@keyframes vmPulse{50%{opacity:.4}}
.vm-status.paused{color:#ffd700}
.vm-status.paused .dot{background:#ffd700;animation:none}
.vm-status.stopped{color:#ff5555}
.vm-status.stopped .dot{background:#ff5555;animation:none}
.vm-screen{flex:1;background:#000;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
.vm-screen-inner{width:100%;height:100%;position:relative;overflow:auto}
.vm-e-screen{background:#000;color:#ccc;font-family:Consolas,monospace;padding:20px;font-size:12px;line-height:1.5}
.vm-e-header{background:#111;padding:10px;border-bottom:1px solid #333;color:#4ec9b0;font-weight:700;margin:-20px -20px 15px}
.vm-e-app{background:#0a1a2e;border:1px solid #1a4a7e;border-radius:8px;padding:20px;text-align:center;color:#fff;max-width:400px;margin:0 auto}
.vm-e-app .app-icon{font-size:64px;margin-bottom:12px}
.vm-e-app h2{font-size:20px;margin-bottom:8px}
.vm-e-app .version{color:#4ec9b0;font-size:12px;margin-bottom:16px}
.vm-e-app .info{font-size:11.5px;color:#888;margin:4px 0}
.vm-e-app .run-btn{margin-top:20px;padding:10px 24px;background:#0078d4;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.vm-e-warning{background:rgba(243,156,18,.15);border:1px solid rgba(243,156,18,.4);padding:12px;border-radius:6px;margin-top:16px;font-size:11px;color:#f39c12;text-align:left;max-width:400px;margin-left:auto;margin-right:auto}

.vm-d-screen{background:linear-gradient(180deg,#1a237e,#0d47a1);width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.vm-d-splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:20px}
.vm-d-splash .logo{font-size:80px;animation:androidBob 2s infinite}
@keyframes androidBob{50%{transform:translateY(-10px)}}
.vm-d-splash .ver{font-size:12px;opacity:.7}
.vm-d-splash .spinner{width:24px;height:24px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:actSpin 1s linear infinite}
.vm-d-launcher{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px;align-content:start;position:relative}
.vm-d-app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px;border-radius:12px;transition:background .15s}
.vm-d-app-icon:hover{background:rgba(255,255,255,.1)}
.vm-d-app-icon .icon{width:56px;height:56px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.vm-d-app-icon .icon img{width:100%;height:100%;object-fit:cover}
.vm-d-app-icon .label{font-size:10.5px;color:#fff;text-align:center;max-width:70px;overflow:hidden;text-overflow:ellipsis}
.vm-d-app-screen{flex:1;background:#fff;color:#000;display:flex;flex-direction:column}
.vm-d-app-header{background:#6200ee;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
.vm-d-app-header .back{font-size:20px;cursor:pointer}
.vm-d-app-header .title{font-weight:600;flex:1}
.vm-d-app-content{flex:1;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.vm-d-app-content .app-icon{width:80px;height:80px;background:#eee;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.vm-d-app-content .app-icon img{width:100%;height:100%;object-fit:cover}
.vm-d-app-content h3{font-size:18px;color:#000}
.vm-d-app-content .pkg{font-size:11px;color:#666;font-family:monospace}
.vm-d-app-content .perm-list{font-size:11px;color:#666;text-align:left;max-width:400px;margin-top:12px;padding:10px;background:#f5f5f5;border-radius:8px}
.vm-d-app-content .perm-list .item{padding:2px 0}
.vm-d-bottom-bar{background:#000;color:#fff;display:flex;justify-content:space-around;padding:8px;font-size:18px}
.vm-d-bottom-bar span{cursor:pointer;padding:6px 14px;border-radius:6px}
.vm-d-bottom-bar span:hover{background:rgba(255,255,255,.1)}

.vm-statusbar{padding:5px 12px;background:#0a0a0a;border-top:1px solid #1a1a2e;display:flex;gap:16px;font-size:10.5px;color:#666;flex:none;font-family:Consolas,monospace}

/* Apps */
.toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;flex-wrap:wrap;border-bottom:1px solid var(--border);flex:none;background:rgba(128,128,128,.05)}

.btn{padding:7px 16px;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;border:none}

.progress > div{height:100%;width:0;background:var(--accent);transition:width .25s}
.np-editor{flex:1;padding:14px 18px;outline:none;overflow-y:auto;font-size:14px;line-height:1.55;user-select:text;background:transparent}

/* OOBE */
#oobe{position:fixed;inset:0;z-index:2000;background:radial-gradient(circle at 30% 40%,#1a5eb8 0%,#0e3a7a 50%,#051a3f 100%);color:#fff;display:flex;flex-direction:column;transition:opacity .5s}
#oobe.hidden{display:none}
.oobe-dots{display:flex;gap:8px;position:absolute;top:24px;left:50%;transform:translateX(-50%);z-index:5}
.oobe-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .25s}
.oobe-dot.active{background:#fff;transform:scale(1.25)}
.oobe-dot.done{background:rgba(255,255,255,.6)}
.oobe-skip{position:absolute;top:20px;right:24px;z-index:6;padding:8px 18px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12.5px;cursor:pointer}
.oobe-screens{flex:1;position:relative;overflow:hidden;padding:40px 20px 20px}
.oobe-screen{position:absolute;inset:40px 20px 20px;display:none;overflow-y:auto;padding:20px}
.oobe-screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;animation:oobeSlide .32s}
@keyframes oobeSlide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.oobe-center{max-width:720px;width:100%;text-align:center;padding:20px 0}
.oobe-center h1{font-size:34px;font-weight:300;margin-bottom:12px}

.oobe-form{max-width:420px;margin:0 auto;text-align:left}
.oobe-form-wide{max-width:520px}
.oobe-form label{display:block;font-size:12px;opacity:.85;margin:14px 0 6px;font-weight:500}
.oobe-form input,.oobe-form select{width:100%;padding:11px 14px;border-radius:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:14px;outline:none}
.oobe-form select option{background:#1a3a72;color:#fff}
.oobe-err{color:#ffb1b1;font-size:11.5px;margin-top:4px;min-height:14px}

.oobe-btn.primary{background:#0078d4;border-color:#0078d4;font-weight:500}

.oobe-eula h4{font-size:13px;margin:12px 0 6px;color:#7cc4ff}
.oobe-eula p{margin-bottom:8px;opacity:.9}
.oobe-checkbox{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;justify-content:center;margin-top:8px}

.oobe-avatar.sel{border-color:#fff}

.oobe-themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}

.oobe-theme.active{border-color:#4aa3ff}
.oobe-theme-prev{aspect-ratio:16/10;border-radius:5px;display:flex;flex-direction:column;padding:8px}
.oobe-theme span{display:block;text-align:center;font-size:12px;margin-top:6px}

.oobe-wallpaper.sel{border-color:#4aa3ff}

<script>
'use strict';
window.microOS = {};
(function(M){

const ACTIVATION_KEY = 'paykey1234567890adminopen';

const U = M.Util = {
  $:(s,r=document)=>r.querySelector(s),
  $$:(s,r=document)=>Array.from(r.querySelectorAll(s)),
  el(t,c,txt){ const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; },
  lsGet(k,d){ try{ const v=localStorage.getItem('microOS.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  lsSet(k,v){ try{ localStorage.setItem('microOS.'+k,JSON.stringify(v)); return true;}catch(e){return false;} },
  clamp(v,a,b){ return Math.max(a,Math.min(b,v)); },
  rand(a,b){ return a+Math.random()*(b-a); },
  pad(n){ return String(n).padStart(2,'0'); },
  debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
};

const DB = M.DB = {
  db:null,
  async init(){
    if(this.db) return this.db;
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open('microOS_FS',1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains('files')) d.createObjectStore('files',{keyPath:'id',autoIncrement:true});
        if(!d.objectStoreNames.contains('apps')) d.createObjectStore('apps',{keyPath:'id',autoIncrement:true});
        if(!d.objectStoreNames.contains('logs')) d.createObjectStore('logs',{keyPath:'id',autoIncrement:true});
      };
      req.onsuccess = e => { this.db = e.target.result; resolve(this.db); };
      req.onerror = e => reject(e.target.error);
    });
  },
  async _op(store, mode, fn){
    const db = await this.init();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(store, mode);
      const req = fn(tx.objectStore(store));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  addFile(f){ return this._op('files','readwrite', s => s.add(f)); },
  getFile(id){ return this._op('files','readonly', s => s.get(id)); },
  getAllFiles(){ return this._op('files','readonly', s => s.getAll()); },
  deleteFile(id){ return this._op('files','readwrite', s => s.delete(id)); },
  addApp(a){ return this._op('apps','readwrite', s => s.add(a)); },
  getApp(id){ return this._op('apps','readonly', s => s.get(id)); },
  getAllApps(){ return this._op('apps','readonly', s => s.getAll()); },
  updateApp(a){ return this._op('apps','readwrite', s => s.put(a)); },
  deleteApp(id){ return this._op('apps','readwrite', s => s.delete(id)); },
  addLog(l){ return this._op('logs','readwrite', s => s.add(l)); }
};

const WALLPAPERS = M.WALLPAPERS = {
  a:'radial-gradient(circle at 22% 18%,#2f7fdc 0%,#123a72 40%,#06162e 100%)',
  b:'radial-gradient(circle at 72% 28%,#8e46b8 0%,#331467 48%,#0a0620 100%)',
  c:'radial-gradient(circle at 50% 52%,#1e9078 0%,#0d4340 55%,#04191a 100%)',
  d:'radial-gradient(circle at 80% 22%,#e08a2e 0%,#7a320c 50%,#1a0a03 100%)',
  e:'radial-gradient(circle at 50% 20%,#ff6b9d 0%,#7a1a4a 55%,#1a0208 100%)',
  f:'radial-gradient(circle at 30% 70%,#00bcd4 0%,#005a6e 55%,#001a1e 100%)',
  g:'radial-gradient(circle at 60% 40%,#4a4a4a 0%,#1a1a1a 60%,#000 100%)',
  h:'linear-gradient(135deg,#667eea 0%,#764ba2 100%)'
};

/* ==================== 10 VERSIONS ==================== */
const VERSIONS = M.VERSIONS = [
  // microOS 10 - 5 моделей
  { id:'v10-std', line:10, model:'Standard', name:'microOS 10 Standard', description:'Базовая версия линейки 10. Светлая, минимум эффектов.', accent:'#0078D7', tags:['Светлая','Radius 4','Win10'], radius:4, blur:8, theme:'light', taskbarAlign:'left', startMenuAlign:'left' },
  { id:'v10-home', line:10, model:'Home', name:'microOS 10 Home', description:'Домашняя версия с виджетами. Светлая и тёмная.', accent:'#0078D4', tags:['Виджеты','Radius 4','Win10'], radius:4, blur:12, theme:'light', taskbarAlign:'left', startMenuAlign:'left' },
  { id:'v10-pro', line:10, model:'Pro', name:'microOS 10 Pro', description:'Профессиональная. Тёмная по умолчанию.', accent:'#0078D4', tags:['Тёмная','Pro','Win10'], radius:4, blur:14, theme:'dark', taskbarAlign:'left', startMenuAlign:'left' },
  { id:'v10-pro-max', line:10, model:'Pro Max', name:'microOS 10 Pro Max', description:'Максимальная в линейке 10. Всё включено.', accent:'#005A9E', tags:['Pro Max','Snap','Win10'], radius:6, blur:16, theme:'dark', taskbarAlign:'left', startMenuAlign:'left' },
  { id:'v10-ultra', line:10, model:'Ultra', name:'microOS 10 Ultra', description:'Топовая 10-я. Агрессивный неоновый дизайн.', accent:'#00B4D8', tags:['Ultra','Неон','Win10'], radius:6, blur:16, theme:'dark', taskbarAlign:'left', startMenuAlign:'left' },
  // microOS 11 - 5 моделей
  { id:'v11-std', line:11, model:'Standard', name:'microOS 11 Standard', description:'Базовая 11-я. Fluent Design, светлая.', accent:'#0078D4', tags:['Fluent','Radius 8','Win11'], radius:8, blur:24, theme:'light', taskbarAlign:'center', startMenuAlign:'center' },
  { id:'v11-home', line:11, model:'Home', name:'microOS 11 Home', description:'Домашняя 11-я. Виджеты, Snap Layouts.', accent:'#0078D4', tags:['Snap','Fluent','Win11'], radius:8, blur:28, theme:'light', taskbarAlign:'center', startMenuAlign:'center' },
  { id:'v11-pro', line:11, model:'Pro', name:'microOS 11 Pro', description:'Профессиональная 11-я. Тёмная по умолчанию.', accent:'#0078D4', tags:['Тёмная','Fluent','Win11'], radius:8, blur:28, theme:'dark', taskbarAlign:'center', startMenuAlign:'center' },
  { id:'v11-pro-max', line:11, model:'Pro Max', name:'microOS 11 Pro Max', description:'Максимальная 11-я. Mica + Acrylic.', accent:'#0067C0', tags:['Pro Max','Mica','Win11'], radius:10, blur:32, theme:'dark', taskbarAlign:'center', startMenuAlign:'center' },
  { id:'v11-ultra', line:11, model:'Ultra', name:'microOS 11 Ultra', description:'Топовая 11-я. Глассморфизм и анимации.', accent:'#7B68EE', tags:['Ultra','Glass','Win11'], radius:12, blur:60, theme:'dark', taskbarAlign:'center', startMenuAlign:'center' }
];

const VERSION_LINES = M.VERSION_LINES = {
  10: { name:'microOS 10', em:'🪟' },
  11: { name:'microOS 11', em:'✨' }
};

const Version = M.Version = {
  current:'v11-pro',
  load(){ this.current = U.lsGet('version','v11-pro'); if(!VERSIONS.find(v=>v.id===this.current)) this.current='v11-pro'; this.apply(); },
  get(){ return VERSIONS.find(v=>v.id===this.current) || VERSIONS[7]; },
  getId(){ return this.current; },
  set(id){ if(!VERSIONS.find(v=>v.id===id)) return; this.current = id; U.lsSet('version', id); this.apply(); },
  apply(){
    document.documentElement.dataset.version = this.current;
    const v = this.get();
    if(v.accent){

const SystemState = M.SystemState = {
  cpu:12,ramMB:2400,ramMaxMB:8192,diskGB:45,diskMaxGB:100,tempC:42,viruses:0,stability:100,
  listeners:[],tickHandle:null,
  start(){ if(this.tickHandle)return; this.tickHandle=setInterval(()=>this.tick(),800); },
  stop(){ if(this.tickHandle){ clearInterval(this.tickHandle); this.tickHandle=null; } },
  tick(){
    if(!M.IncidentMgr.has('cpuFire')){ this.tempC+=(42-this.tempC)*0.08; this.cpu+=((10+M.WM.wins.length*3)-this.cpu)*0.12+(Math.random()-0.5)*4; }
    if(!M.IncidentMgr.has('ramFill')&&!M.IncidentMgr.has('memoryLeak')){ const base=2200+M.WM.wins.length*180; this.ramMB+=(base-this.ramMB)*0.1; }

  },
  recalcStability(){
    let s=100;

    s-=Math.max(0,this.ramMB/this.ramMaxMB-0.7)*90; s-=Math.max(0,this.diskGB-85)*0.9; s-=this.viruses*9;
    this.stability=U.clamp(s,0,100);
  },
  emit(){ this.listeners.forEach(fn=>{try{fn(this);}catch(e){}}); },
  onChange(fn){ this.listeners.push(fn); }
};

const AudioMgr = M.AudioMgr = {
  ctx:null,fanNode:null,
  ensure(){ if(this.ctx)return true; try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); return true;}catch(e){return false;} },
  beep(f=800,d=0.1,t='square',v=0.04){
    if(!this.ensure())return;
    try{
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type=t; o.frequency.value=f;
      g.gain.setValueAtTime(v,this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,this.ctx.currentTime+d);
      o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+d+0.02);
    }catch(e){}
  },
  error(){ this.beep(220,0.12,'sawtooth',0.05); setTimeout(()=>this.beep(160,0.18,'sawtooth',0.05),150); },
  alert(){ this.beep(880,0.1,'square',0.05); setTimeout(()=>this.beep(660,0.1,'square',0.05),130); setTimeout(()=>this.beep(440,0.16,'square',0.05),260); },
  bsod(){ this.beep(120,0.6,'sine',0.06); setTimeout(()=>this.beep(90,0.8,'sine',0.06),500); },
  greet(){ this.beep(660,0.15,'sine',0.05); setTimeout(()=>this.beep(880,0.2,'sine',0.05),180); setTimeout(()=>this.beep(1100,0.3,'sine',0.05),380); },
  fan(on){
    if(!this.ensure())return;
    if(on){
      if(this.fanNode)return;
      try{
        const sr=this.ctx.sampleRate;
        const buf=this.ctx.createBuffer(1,sr*2,sr);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;
        const src=this.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
        const filt=this.ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=700;
        const g=this.ctx.createGain(); g.gain.value=0.08;
        src.connect(filt).connect(g).connect(this.ctx.destination);
        src.start(); this.fanNode=src;
      }catch(e){}
    } else if(this.fanNode){ try{ this.fanNode.stop(); }catch(e){} this.fanNode=null; }
  }
};

const WM = M.WM = {

      });
    }

    const api={id,el:win,body,appId:opts.appId,title:opts.title,minimized:false,maximized:false,prevRect:null,className:opts.className||'',
      focus:()=>this.focus(id),close:()=>this.close(id),minimize:()=>this.minimize(id),maximize:()=>this.maximize(id),
      setTitle:t=>{ const ti=win.querySelector('.win-title'); if(ti)ti.textContent=t; api.title=t; }};

  focus(id){

      const next=this.wins.filter(x=>!x.minimized&&x.id!==id).pop();
      this.activeId=next?next.id:null;
      if(next) this.focus(next.id);
    }
    M.Taskbar.render();
  },
  restore(id){ const w=this.wins.find(x=>x.id===id); if(w){ w.minimized=false; w.el.classList.remove('minimized'); } },
  maximize(id){
    const w=this.wins.find(x=>x.id===id); if(!w)return;

    const list=this.wins.filter(w=>!w.minimized); if(!list.length)return;

function startDrag(e,win,api){
  if(api.maximized)return; e.preventDefault();
  const sx=e.clientX,sy=e.clientY;
  const sl=parseFloat(win.style.left),st=parseFloat(win.style.top);
  const move=ev=>{ win.style.left=(sl+ev.clientX-sx)+'px'; win.style.top=Math.max(0,st+ev.clientY-sy)+'px'; };
  const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}
function startResize(e,dir,win,api){
  e.preventDefault(); e.stopPropagation();
  if(api.maximized)return;
  const sx=e.clientX,sy=e.clientY;
  const r=win.getBoundingClientRect();
  const sl=parseFloat(win.style.left),st=parseFloat(win.style.top);
  const move=ev=>{
    const dx=ev.clientX-sx,dy=ev.clientY-sy;
    let L=sl,T=st,W=r.width,H=r.height;
    if(dir.includes('e'))W=Math.max(340,r.width+dx);
    if(dir.includes('s'))H=Math.max(220,r.height+dy);
    if(dir.includes('w')){ W=Math.max(340,r.width-dx); L=sl+(r.width-W); }
    if(dir.includes('n')){ H=Math.max(220,r.height-dy); T=st+(r.height-H); }
    win.style.left=L+'px'; win.style.top=T+'px';
    win.style.width=W+'px'; win.style.height=H+'px';
  };
  const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };

const FS = M.FS = {
  root:null,trash:[],
  load(){ this.root=U.lsGet('fs',null); this.trash=U.lsGet('trash',[]); if(!this.root||!this.root.children) this.reset(); },
  reset(){
    this.root={name:'microOS',type:'folder',children:[
      {name:'Рабочий стол',type:'folder',children:[]},
      {name:'Документы',type:'folder',children:[{name:'readme.txt',type:'file',content:'Добро пожаловать в microOS!'}]},
      {name:'Загрузки',type:'folder',children:[]},
      {name:'Изображения',type:'folder',children:[]}
    ]};
    this.trash=[]; this.save();
  },
  save(){ U.lsSet('fs',this.root); },
  saveTrash(){ U.lsSet('trash',this.trash); },
  resolve(path){ let n=this.root; for(const p of path){ if(!n.children)return null; n=n.children.find(c=>c.name===p); if(!n)return null; } return n; },
  mkdir(path,name){ if(M.IncidentMgr.has('diskFill'))return false; const p=this.resolve(path); if(!p||p.children.some(c=>c.name===name))return false; p.children.push({name,type:'folder',children:[]}); this.save(); return true; },
  writeFile(path,name,content){ if(M.IncidentMgr.has('diskFill'))return false; const p=this.resolve(path); if(!p)return false; const ex=p.children.find(c=>c.name===name); if(ex){ if(ex.type!=='file')return false; ex.content=content; } else p.children.push({name,type:'file',content}); this.save(); return true; },
  readFile(path){ const n=this.resolve(path); return n&&n.type==='file'?n.content:null; },
  remove(path){ if(!path.length)return false; const parent=this.resolve(path.slice(0,-1)); if(!parent)return false; const idx=parent.children.findIndex(c=>c.name===path[path.length-1]); if(idx<0)return false; const [node]=parent.children.splice(idx,1); this.trash.push({node,from:path.slice(0,-1),at:Date.now()}); this.save(); this.saveTrash(); return true; },
  restore(i){ if(i<0||i>=this.trash.length)return false; const it=this.trash[i]; const p=this.resolve(it.from)||this.root; p.children.push(it.node); this.trash.splice(i,1); this.save(); this.saveTrash(); return true; },
  removePermanent(i){ if(i<0||i>=this.trash.length)return false; this.trash.splice(i,1); this.saveTrash(); return true; }
};

const IncidentMgr = M.IncidentMgr = {
  active:new Set(),timers:new Map(),handlers:{},registry:INCIDENTS,
  has(id){ return this.active.has(id); },
  clearTimers(id){ const l=this.timers.get(id)||[]; l.forEach(t=>{clearInterval(t);clearTimeout(t);}); this.timers.delete(id); },
  setInt(id,fn,ms){ if(!this.timers.has(id))this.timers.set(id,[]); this.timers.get(id).push(setInterval(fn,ms)); },
  setTimeout(id,fn,ms){ if(!this.timers.has(id))this.timers.set(id,[]); this.timers.get(id).push(setTimeout(fn,ms)); },
  start(id){
    if(this.active.has(id))return;
    const meta=this.registry.find(r=>r.id===id); if(!meta)return;
    const fn=this.handlers[id]||this.handlers._generic;
    this.active.add(id); AudioMgr.alert();
    Notify.push('⚠️ Сбой',meta.name,meta.em);
    fn.call(this,id,meta);
    if(M.ControlPanel && M.ControlPanel.isMounted()) M.ControlPanel.renderActiveState();
  },
  stop(id){
    if(!this.active.has(id))return;
    this.active.delete(id); this.clearTimers(id);
    if(this.handlers['cleanup_'+id]) this.handlers['cleanup_'+id].call(this,id);
    if(M.ControlPanel && M.ControlPanel.isMounted()) M.ControlPanel.renderActiveState();
  },
  normalize(){
    Array.from(this.active).forEach(id=>this.stop(id));
    SystemState.cpu=12; SystemState.ramMB=2400; SystemState.diskGB=45; SystemState.tempC=42; SystemState.viruses=0;
    SystemState.recalcStability(); SystemState.emit();
    document.body.classList.remove('shaking','invert','netLost','kbFail','mouseFail','grayscale');
    document.body.style.filter='';
    AudioMgr.fan(false);
    U.$$('.dialog-overlay').forEach(o=>o.remove());
    U.$$('.inst-overlay').forEach(o=>o.remove());
    ErrorMgr.dialogCount=0;
    if(M.Desktop) M.Desktop.removeVirusIcons();
    Notify.push('✅ Нормализовано','Все сбои устранены','✔');
  },
  random(){ const list=this.registry.map(r=>r.id); this.start(list[Math.floor(Math.random()*list.length)]); },
  apocalypse(){
    const picked=new Set(); const cats=Object.keys(CATEGORIES);
    while(picked.size<7){ const cat=cats[Math.floor(Math.random()*cats.length)]; const inCat=this.registry.filter(r=>r.cat===cat&&!picked.has(r.id)); if(inCat.length) picked.add(inCat[Math.floor(Math.random()*inCat.length)].id); }
    Array.from(picked).forEach((id,i)=>setTimeout(()=>this.start(id),i*180));
  }
};

};

const FileRecognizer = M.FileRecognizer = {
  async recognize(file){
    const name = file.name; const ext = name.split('.').pop().toLowerCase(); const baseName = name.replace(/\.[^.]+$/,'');
    const result = { type: ext, name: baseName, version:'1.0.0', publisher:'Неизвестный разработчик', icon: null, entry:null, size:file.size, manifest:null, warnings:[], file };
    if(ext==='exe'||ext==='msi') return this.recognizeExe(file, result);
    if(ext==='apk') return this.recognizeApk(file, result);
    if(ext==='dio') return this.recognizeDio(file, result);
    if(['txt','md','log'].includes(ext)){ result.type='text'; return result; }
    if(['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)){ result.type='image'; return result; }
    if(['mp3','wav','ogg','flac'].includes(ext)){ result.type='audio'; return result; }
    if(['mp4','webm','avi','mkv'].includes(ext)){ result.type='video'; return result; }
    if(['zip','rar','7z','tar','gz'].includes(ext)){ result.type='archive'; return result; }
    if(['bat','cmd','ps1','sh'].includes(ext)){ result.type='script'; return result; }
    if(['sys','dll'].includes(ext)){ result.type='system'; return result; }
    result.type='unknown'; return result;
  },
  recognizeExe(file, result){
    return new Promise(resolve=>{
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const buffer = reader.result; const bytes = new Uint8Array(buffer);
          if(bytes.length>=2 && bytes[0]===0x4D && bytes[1]===0x5A) result.warnings.push('PE-файл');
          const text = new TextDecoder('utf-8',{fatal:false}).decode(buffer);
          const idx = text.indexOf('MICROOS_APP_V1');
          if(idx!==-1){
            const js = text.indexOf('{', idx);
            if(js!==-1){
              let depth=0, end=-1;
              for(let i=js; i<Math.min(text.length, js+8192); i++){
                if(text[i]==='{') depth++; else if(text[i]==='}'){ depth--; if(depth===0){ end=i; break; } }
              }
              if(end!==-1){ try{ const manifest = JSON.parse(text.substring(js, end+1)); result.manifest = manifest; if(manifest.name) result.name = manifest.name; if(manifest.version) result.version = manifest.version; if(manifest.publisher) result.publisher = manifest.publisher; if(manifest.icon) result.icon = manifest.icon; if(manifest.entry) result.entry = manifest.entry; result.warnings.push('✓ Манифест microOS найден'); }catch(e){} }
            }
          }
          const vm = file.name.match(/v?(\d+\.\d+(?:\.\d+)?)/i);
          if(vm) result.version = vm[1];
          result.type = 'program';
          if(!result.icon) result.icon = this.generateIcon(result.name);
        }catch(e){ result.type='program'; result.icon=this.generateIcon(result.name); }
        resolve(result);
      };
      reader.onerror = ()=>{ result.type='program'; result.icon=this.generateIcon(result.name); resolve(result); };
      reader.readAsArrayBuffer(file.slice(0,4096));
    });
  },
  async recognizeApk(file, result){
    result.type = 'android'; result.warnings.push('Android APK');
    if(typeof JSZip === 'undefined'){ result.icon=this.generateIcon(result.name); return result; }
    try{
      const zip = await JSZip.loadAsync(file);
      const mf = zip.file('AndroidManifest.xml');
      if(mf){
        const bytes = await mf.async('uint8array');
        const text = new TextDecoder('utf-8',{fatal:false}).decode(bytes);
        const pkg = text.match(/([a-z][a-z0-9_]*\.){2,}[a-zA-Z][a-zA-Z0-9_]*/);
        result.manifest = result.manifest || {};
        if(pkg) result.manifest.package = pkg[0];
        const vm = text.match(/(\d+\.\d+\.\d+)/);
        if(vm) result.version = vm[1];
        const perms = [];
        (text.match(/android\.permission\.[A-Z_]+/g)||[]).slice(0,10).forEach(p=>perms.push(p));
        result.manifest.permissions = perms;
      }
      const icons = Object.keys(zip.files).filter(f=>/res\/mipmap[^/]*\/.*\.png$/i.test(f));
      if(icons.length){ try{ result.icon = 'data:image/png;base64,'+await zip.file(icons[0]).async('base64'); }catch(e){} }
    }catch(e){ result.warnings.push('Не удалось распарсить APK'); }
    if(!result.icon) result.icon = this.generateIcon(result.name);
    return result;
  },
  async recognizeDio(file, result){
    try{ const text = await file.text(); const data = JSON.parse(text); result.manifest = data; if(data.name) result.name = data.name; if(data.version) result.version = data.version; if(data.publisher) result.publisher = data.publisher; if(data.icon) result.icon = data.icon; if(data.entry) result.entry = data.entry; result.type = 'dio'; result.warnings.push('✓ microOS .dio'); }
    catch(e){ result.warnings.push('Невалидный .dio'); result.type='dio'; result.icon=this.generateIcon(result.name); }
    return result;
  },
  generateIcon(name){
    const letter = (name||'A')[0].toUpperCase(); const hue = this.hashCode(name) % 360;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="hsl(${hue},70%,55%)"/><stop offset="100%" stop-color="hsl(${(hue+40)%360},70%,35%)"/></linearGradient></defs><rect width="64" height="64" rx="12" fill="url(#g)"/><text x="32" y="42" text-anchor="middle" font-family="Segoe UI,Arial" font-size="32" font-weight="700" fill="#fff">${letter}</text></svg>`;
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  },
  hashCode(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0; return Math.abs(h); }
};

const FileTypeHandler = M.FileTypeHandler = {
  formatSize(bytes){
    if(!bytes||bytes<1024) return (bytes||0)+' Б';
    if(bytes<1048576) return (bytes/1024).toFixed(1)+' КБ';
    if(bytes<1073741824) return (bytes/1048576).toFixed(2)+' МБ';
    return (bytes/1073741824).toFixed(2)+' ГБ';
  }
};

/* ==================== VIRTUAL MACHINE ==================== */
const VirtualMachine = M.VirtualMachine = {
  sessions: new Map(),
  maxSessions: 3,
  settings: { ram: 1024, cores: 2, acceleration: false },
  
  loadSettings(){ const s = U.lsGet('vmSettings', null); if(s) this.settings = Object.assign(this.settings, s); },
  saveSettings(){ U.lsSet('vmSettings', this.settings); },
  
  canCreate(){ return this.sessions.size < this.maxSessions; },
  
  createSession(appId, appData){
    if(this.sessions.has(appId)) return this.sessions.get(appId);
    if(this.sessions.size >= this.maxSessions){
      return { error: 'LIMIT', message: 'Лимит ВМ достигнут (' + this.maxSessions + '). Остановите одну из них.' };
    }
    const type = appData.appType === 'android' ? 'D' : 'E';
    const session = {
      id: 'vm_' + appId + '_' + Date.now(),
      appId,
      appData,
      type,
      state: 'stopped',
      startTime: null,
      elapsed: 0,
      ram: this.settings.ram,
      cores: this.settings.cores,
      win: null,
      timer: null,
      manifest: appData.manifest || null
    };
    this.sessions.set(appId, session);
    return session;
  },
  
  startSession(appId){
    const session = this.sessions.get(appId);
    if(!session) return;
    session.state = 'running';
    session.startTime = Date.now();
    if(!session.timer){
      session.timer = setInterval(()=>{
        if(session.state === 'running') session.elapsed++;
        this.updateStatusBar(appId);
      }, 1000);
    }
    this.updateUI(appId);
  },
  
  stopSession(appId){
    const session = this.sessions.get(appId);
    if(!session) return;
    session.state = 'stopped';
    if(session.timer){ clearInterval(session.timer); session.timer = null; }
    this.updateUI(appId);
    Notify.push('ВМ', 'Остановлена: ' + session.appData.name, '⏹');
  },
  
  pauseSession(appId){
    const session = this.sessions.get(appId);
    if(!session || session.state !== 'running') return;
    session.state = 'paused';
    this.updateUI(appId);
  },
  
  resumeSession(appId){
    const session = this.sessions.get(appId);
    if(!session || session.state !== 'paused') return;
    session.state = 'running';
    this.updateUI(appId);
  },
  
  destroySession(appId){
    const session = this.sessions.get(appId);
    if(!session) return;
    if(session.timer){ clearInterval(session.timer); session.timer = null; }
    if(session.win){
      try{ WM.close(session.win.id); }catch(e){}
    }
    this.sessions.delete(appId);
    Taskbar.render();
  },
  
  getStatus(appId){
    const s = this.sessions.get(appId);
    return s ? s.state : 'stopped';
  },
  
  updateUI(appId){
    const session = this.sessions.get(appId);
    if(!session || !session.win) return;
    const statusEl = session.win.el.querySelector('.vm-status');
    if(statusEl){
      statusEl.className = 'vm-status ' + session.state;
      const dot = statusEl.querySelector('.dot');
      let text = '';
      if(session.state === 'running') text = '▶ Running';
      else if(session.state === 'paused') text = '⏸ Paused';
      else text = '⏹ Stopped';
      statusEl.innerHTML = '<div class="dot"></div><span>' + text + '</span>';
    }
    const playBtn = session.win.el.querySelector('.vm-btn-play');
    const pauseBtn = session.win.el.querySelector('.vm-btn-pause');
    const stopBtn = session.win.el.querySelector('.vm-btn-stop');
    if(playBtn) playBtn.disabled = session.state === 'running';
    if(pauseBtn) pauseBtn.disabled = session.state !== 'running';
    if(stopBtn) stopBtn.disabled = session.state === 'stopped';
  },
  
  updateStatusBar(appId){
    const session = this.sessions.get(appId);
    if(!session || !session.win) return;
    const bar = session.win.el.querySelector('.vm-statusbar');
    if(!bar) return;
    const cpu = session.state === 'running' ? Math.round(U.rand(15, 45)) : 0;
    const ram = session.state === 'running' ? Math.round(U.rand(session.ram * 0.3, session.ram * 0.7)) : 0;
    const elapsed = this.formatTime(session.elapsed);
    bar.innerHTML = '<div class="item">CPU: <span class="val">' + cpu + '%</span></div><div class="item">ОЗУ: <span class="val">' + ram + ' МБ</span></div><div class="item">Время: <span class="val">' + elapsed + '</span></div><div class="item">Режим: <span class="val">microOS-' + session.type + '</span></div>';
  },
  
  formatTime(sec){
    const m = Math.floor(sec/60), s = sec%60;
    return m + ':' + String(s).padStart(2,'0');
  },
  
  openWindow(appId){
    const session = this.sessions.get(appId);
    if(!session) return;
    
    const title = session.type === 'D' ? 'Android-эмулятор — ' + session.appData.name : 'Виртуальная машина — ' + session.appData.name;
    const icon = session.type === 'D' ? '🤖' : '💻';
    
    const win = WM.create({
      appId: 'vm_' + appId,
      title,
      icon,
      width: 720,
      height: 540,
      className: 'vm-window',
      noDrag: false,
      build: (body, api) => {
        session.win = api;
        body.style.padding = '0';
        body.style.overflow = 'hidden';
        
        // Toolbar
        const toolbar = U.el('div','vm-toolbar');
        const playBtn = U.el('button','vm-btn vm-btn-play','▶ Play');
        const pauseBtn = U.el('button','vm-btn vm-btn-pause','⏸ Pause');
        const stopBtn = U.el('button','vm-btn vm-btn-stop danger','⏹ Stop');

        stopBtn.addEventListener('click', ()=>{ VirtualMachine.stopSession(appId); VirtualMachine.renderStopped(appId); });
        settingsBtn.addEventListener('click', ()=>{ VirtualMachine.showSettings(appId); });
        
        toolbar.append(playBtn, pauseBtn, stopBtn, settingsBtn, statusEl);

        body.appendChild(statusbar);
        
        // Начальное состояние - остановлено
        this.renderStopped(appId);

  renderStopped(appId){
    const session = this.sessions.get(appId);

    if(!screenInner) return;
    screenInner.innerHTML = '';

      <div style="font-size:16px;color:#aaa">Виртуальная машина остановлена</div>
      <div style="font-size:12px;opacity:.6">Нажмите ▶ Play для запуска</div>
    `;
    const btn = U.el('button','vm-btn primary','▶ Запустить');
    btn.style.marginTop = '12px';
    btn.addEventListener('click', ()=>{ VirtualMachine.startSession(appId); VirtualMachine.renderRunning(appId); });
    stopper.appendChild(btn);
    screenInner.appendChild(stopper);
  },
  
  renderRunning(appId){
    const session = this.sessions.get(appId);
    if(!session || !session.win) return;
    const screenInner = session.win.el.querySelector('.vm-screen-inner');
    if(!screenInner) return;
    screenInner.innerHTML = '';
    
    if(session.type === 'E'){
      this.renderE(appId, screenInner);
    } else {
      this.renderD(appId, screenInner);
    }
  },
  
  renderE(appId, container){

    const app = session.appData;
    const manifest = session.manifest;

    const header = U.el('div','vm-e-header','microOS-E · Virtual Machine · ' + (new Date()).toLocaleTimeString('ru-RU'));

    // Если есть манифест - рендерим UI из него

      appDiv.append(U.el('div','version','v' + app.version + ' · ' + app.publisher));
      appDiv.append(U.el('div','info','Режим: microOS-E (native)'));
      appDiv.append(U.el('div','info','Среда: виртуальная · RAM: ' + session.ram + ' МБ · Ядра: ' + session.cores));

      }

      appDiv.appendChild(runBtn);

        if(manifest.entry) infoDiv.innerHTML += 'Точка входа: ' + manifest.entry + '<br>';
        eScreen.appendChild(infoDiv);
      }
    } else if(app.appType === 'program'){
      // .exe без манифеста
      const appDiv = U.el('div','vm-e-app');
      const iconBox = U.el('div','app-icon');
      if(app.icon && app.icon.startsWith('data:')){
        const img = U.el('img'); img.src = app.icon; img.style.cssText = 'width:64px;height:64px;border-radius:12px';
        iconBox.appendChild(img);
      } else iconBox.textContent = app.icon || '📦';

      const warning = U.el('div','vm-e-warning');
      warning.innerHTML = '⚠️ <b>Ограничение microOS-E:</b><br>Этот .exe не содержит манифеста microOS. Полноценный запуск Windows-приложений в браузере невозможен без внешних WASM-эмуляторов. ВМ работает в демо-режиме.';
      appDiv.appendChild(warning);
      eScreen.appendChild(appDiv);
    } else {
      const appDiv = U.el('div','vm-e-app');
      appDiv.append(U.el('h2',null, app.name));
      appDiv.append(U.el('div','info','Режим microOS-E'));

    }

  },
  
  renderD(appId, container){
    const session = this.sessions.get(appId);
    const app = session.appData;
    const manifest = session.manifest;
    
    const dScreen = U.el('div','vm-d-screen');
    
    // Splash
    const splash = U.el('div','vm-d-splash');
    splash.innerHTML = '<div class="logo">🤖</div><div style="font-size:20px;font-weight:600">' + app.name + '</div><div class="ver">Android · v' + app.version + '</div><div class="spinner"></div>';
    dScreen.appendChild(splash);
    
    setTimeout(()=>{
      dScreen.innerHTML = '';
      
      // Launcher
      const launcher = U.el('div','vm-d-launcher');
      const appIcon = U.el('div','vm-d-app-icon');
      const iconBox = U.el('div','icon');
      if(app.icon && app.icon.startsWith('data:')){
        const img = U.el('img'); img.src = app.icon;
        iconBox.appendChild(img);
      } else iconBox.textContent = app.icon || '📱';
      appIcon.append(iconBox, U.el('div','label', app.name));
      appIcon.addEventListener('click', ()=>{ VirtualMachine.renderDApp(appId, container); });
      launcher.appendChild(appIcon);

      ['📞','💬','📷','⚙️','🎵','📁'].forEach((icon, i)=>{

        launcher.appendChild(d);
      });
      
      dScreen.appendChild(launcher);
      
      // Bottom bar
      const bottomBar = U.el('div','vm-d-bottom-bar');

      U.$$('span', bottomBar).forEach(sp=>{
        sp.addEventListener('click', ()=>{
          if(sp.textContent === '◀') Notify.push('Android','Назад','◀');
          else if(sp.textContent === '●') VirtualMachine.renderD(appId, container);
          else if(sp.textContent === '■') Notify.push('Android','Меню','■');
        });
      });
      dScreen.appendChild(bottomBar);
    }, 1500);
    
    container.appendChild(dScreen);
  },
  
  renderDApp(appId, container){
    const session = this.sessions.get(appId);
    const app = session.appData;
    const manifest = session.manifest;
    container.innerHTML = '';
    
    const dScreen = U.el('div','vm-d-screen');
    const appScreen = U.el('div','vm-d-app-screen');
    
    const header = U.el('div','vm-d-app-header');
    header.innerHTML = '<span class="back">←</span><span class="title">' + app.name + '</span><span>⋮</span>';
    header.querySelector('.back').addEventListener('click', ()=>{ VirtualMachine.renderD(appId, container); });
    
    const content = U.el('div','vm-d-app-content');
    const iconBox = U.el('div','app-icon');
    if(app.icon && app.icon.startsWith('data:')){
      const img = U.el('img'); img.src = app.icon;
      iconBox.appendChild(img);
    } else iconBox.textContent = app.icon || '📱';
    content.appendChild(iconBox);
    content.appendChild(U.el('h3',null, app.name));
    if(manifest && manifest.package) content.appendChild(U.el('div','pkg', manifest.package));
    content.appendChild(U.el('div',null,'Приложение запущено в Android-эмуляторе microOS-D'));
    
    if(manifest && manifest.permissions && manifest.permissions.length){
      const perms = U.el('div','perm-list');
      perms.innerHTML = '<div style="font-weight:600;margin-bottom:6px;color:#333">🔐 Разрешения (' + manifest.permissions.length + '):</div>';
      manifest.permissions.forEach(p=>{
        perms.innerHTML += '<div class="item">• ' + p + '</div>';
      });
      content.appendChild(perms);
    }
    
    appScreen.append(header, content);
    dScreen.appendChild(appScreen);
    
    const bottomBar = U.el('div','vm-d-bottom-bar');
    bottomBar.innerHTML = '<span>◀</span><span>●</span><span>■</span>';
    U.$$('span', bottomBar).forEach(sp=>{
      sp.addEventListener('click', ()=>{
        if(sp.textContent === '◀') VirtualMachine.renderD(appId, container);
        else if(sp.textContent === '●') VirtualMachine.renderD(appId, container);
      });
    });
    dScreen.appendChild(bottomBar);
    
    container.appendChild(dScreen);
  },
  
  showSettings(appId){
    const session = this.sessions.get(appId);
    if(!session) return;
    const bd = U.el('div');
    bd.style.display = 'block';
    bd.innerHTML = `
      <div style="margin-bottom:12px;font-size:13px"><b>Настройки виртуальной машины</b></div>

      <div style="margin-bottom:8px;font-size:12px">Тип: microOS-${session.type} (${session.type === 'D' ? 'Android эмуляция' : 'Native x86-подобная'})</div>
      <div style="margin-bottom:8px;font-size:12px">ОЗУ: ${session.ram} МБ · Ядра: ${session.cores}</div>
      <div style="margin-bottom:8px;font-size:12px">Статус: ${session.state}</div>
      <div style="margin-bottom:8px;font-size:12px">Время работы: ${this.formatTime(session.elapsed)}</div>
      <div style="font-size:11px;color:var(--dim);margin-top:12px">ВМ использует изолированную среду эмуляции. Никакой пользовательский код не исполняется через eval.</div>
    `;
    ErrorMgr.dialog({ title:'Настройки ВМ', icon:'⚙️', html: bd, buttons:[{label:'Закрыть',primary:true}] });
  }
};
