    ['✏️','🧽','／','▢','○'].forEach((ic, i)=>{
      const btn = U.el('button','tbtn'+(i===0?' on':''), ic);
      btn.addEventListener('click', ()=>{ U.$$('.tbtn',tools).forEach(x=>x.classList.remove('on')); btn.classList.add('on'); tool = ['pen','eraser','line','rect','circle'][i]; });
      tools.appendChild(btn);
    });
    tools.appendChild(U.el('div','sep'));
    ['#000000','#ffffff','#e74c3c','#3498db','#27ae60','#f39c12','#9b59b6','#1abc9c','#e67e22','#34495e'].forEach(c=>{
      const d = U.el('div','paint-color'+(c==='#000000'?' on':''));
      d.style.background = c;
      d.addEventListener('click', ()=>{ U.$$('.paint-color',tools).forEach(x=>x.classList.remove('on')); d.classList.add('on'); color = c; });
      tools.appendChild(d);
    });
    const sizeInp = U.el('input');
    sizeInp.type = 'range'; sizeInp.min = '1'; sizeInp.max = '20'; sizeInp.value = '3'; sizeInp.style.width = '80px';
    sizeInp.addEventListener('input', ()=>size = parseInt(sizeInp.value));
    tools.appendChild(sizeInp);
    const clearBtn = U.el('button','tbtn','🗑');
    const saveBtn = U.el('button','tbtn','💾');
    tools.append(clearBtn, saveBtn);
    const canvas = U.el('canvas','paint-canvas');
    const ctx = canvas.getContext('2d');
    const wrapper = U.el('div');
    wrapper.style.cssText = 'flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#888';
    wrapper.appendChild(canvas);
    b.append(tools, wrapper);
    requestAnimationFrame(()=>{
      canvas.width = Math.max(600, wrapper.clientWidth - 20);
      canvas.height = Math.max(400, wrapper.clientHeight - 20);
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    });
    let drawing = false, sx = 0, sy = 0, snap = null;
    canvas.addEventListener('mousedown', e=>{
      drawing = true;
      const r = canvas.getBoundingClientRect();
      const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
      sx = (e.clientX-r.left)*scaleX; sy = (e.clientY-r.top)*scaleY;
      snap = ctx.getImageData(0,0,canvas.width,canvas.height);
      ctx.beginPath(); ctx.moveTo(sx, sy);
    });
    canvas.addEventListener('mousemove', e=>{
      if(!drawing) return;
      const r = canvas.getBoundingClientRect();
      const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
      const x = (e.clientX-r.left)*scaleX, y = (e.clientY-r.top)*scaleY;
      if(tool === 'pen' || tool === 'eraser'){
        ctx.strokeStyle = tool === 'eraser' ? '#fff' : color;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.lineTo(x, y); ctx.stroke();
      } else {
        ctx.putImageData(snap, 0, 0);
        ctx.strokeStyle = color; ctx.lineWidth = size;
        ctx.beginPath();
        if(tool === 'line'){ ctx.moveTo(sx, sy); ctx.lineTo(x, y); }
        else if(tool === 'rect'){ ctx.rect(sx, sy, x-sx, y-sy); }
        else if(tool === 'circle'){ const rx = Math.abs(x-sx)/2, ry = Math.abs(y-sy)/2; ctx.ellipse(sx+(x-sx)/2, sy+(y-sy)/2, rx, ry, 0, 0, Math.PI*2); }
        ctx.stroke();
      }
    });
    canvas.addEventListener('mouseup', ()=>drawing = false);
    canvas.addEventListener('mouseleave', ()=>drawing = false);
    clearBtn.addEventListener('click', ()=>{ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); });
    saveBtn.addEventListener('click', ()=>{ canvas.toBlob(blob=>{ const rd = new FileReader(); rd.onload = ()=>{ FS.writeFile(['Изображения'], 'paint_'+Date.now()+'.png', rd.result); Notify.push('Paint','Сохранено','💾'); }; rd.readAsDataURL(blob); }, 'image/png'); });
  });
}});

Apps.register({ id:'mines', name:'Сапёр', icon:'💣', pinned:false, open(){
  openApp('mines','Сапёр','💣',520,600,(b)=>{
    b.classList.add('game-wrap');
    const hud = U.el('div','game-hud');
    const mines = U.el('span',null,'💣 0');
    const status = U.el('span',null,'');
    const restart = U.el('button','btn sec','Новая');
    hud.append(mines, status, restart);
    const grid = U.el('div','ms-grid');
    b.append(hud, grid);
    const SIZE = 12, MINES = 20;
    let cells = [], over = false;
    function init(){
      over = false; grid.innerHTML = '';
      grid.style.gridTemplateColumns = 'repeat('+SIZE+',26px)';
      cells = [];
      for(let i=0;i<SIZE*SIZE;i++){
        cells.push({mine:false,open:false,flag:false,n:0});
        const c = U.el('div','ms-cell');
        c.dataset.i = i;
        c.addEventListener('click', ()=>openCell(i));
        c.addEventListener('contextmenu', e=>{ e.preventDefault(); if(!over && !cells[i].open){ cells[i].flag = !cells[i].flag; updateFlags(); draw(); } });
        grid.appendChild(c);
      }
      let placed = 0;
      while(placed < MINES){ const p = Math.floor(Math.random()*SIZE*SIZE); if(!cells[p].mine){ cells[p].mine = true; placed++; } }
      for(let i=0;i<SIZE*SIZE;i++){ cells[i].n = neighbors(i).filter(j=>cells[j].mine).length; }
      draw();
    }
    function neighbors(i){ const r = Math.floor(i/SIZE), c = i%SIZE, out = []; for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ if(!dr && !dc) continue; const nr=r+dr, nc=c+dc; if(nr>=0 && nr<SIZE && nc>=0 && nc<SIZE) out.push(nr*SIZE+nc); } return out; }
    function openCell(i){ if(over || cells[i].open) return; if(cells[i].flag) return; if(cells[i].mine){ over = true; cells.forEach((c,k)=>{ if(c.mine){ grid.children[k].classList.add('open','mine'); grid.children[k].textContent = '💣'; } }); grid.children[i].style.background = '#ff0000'; status.textContent = '💥 Проиграли'; return; } flood(i); draw(); checkWin(); }
    function flood(i){ const stack = [i]; while(stack.length){ const k = stack.pop(); const c = cells[k]; if(c.open || c.flag) continue; c.open = true; if(c.n === 0){ neighbors(k).forEach(j=>{ if(!cells[j].open) stack.push(j); }); } } }
    function draw(){ cells.forEach((c,i)=>{ const e = grid.children[i]; e.className = 'ms-cell'; if(c.open){ e.classList.add('open'); if(c.n > 0) e.textContent = c.n; } else if(c.flag){ e.classList.add('flag'); e.textContent = '🚩'; } else e.textContent = ''; }); }
    function checkWin(){ const opened = cells.filter(c=>c.open).length; if(opened === SIZE*SIZE - MINES){ over = true; status.textContent = '🏆 Победа!'; } }
    function updateFlags(){ mines.textContent = '💣 ' + (MINES - cells.filter(c=>c.flag).length); }
    restart.addEventListener('click', init);
    init();
  });
}});

Apps.register({ id:'snake', name:'Змейка', icon:'🐍', pinned:false, open(){
  openApp('snake','Змейка','🐍',520,600,(b)=>{
    b.classList.add('game-wrap');
    const hud = U.el('div','game-hud');
    const scoreLbl = U.el('span',null,'Счёт: 0');
    const restart = U.el('button','btn sec','Заново');
    hud.append(scoreLbl, restart);
    const canvas = U.el('canvas','snake-cv');
    const CS = 20, COLS = 22, ROWS = 20;
    canvas.width = COLS*CS; canvas.height = ROWS*CS;
    b.append(hud, canvas);
    const ctx = canvas.getContext('2d');
    let snake, dir, nextDir, food, score, alive, loop;
    function reset(){
      snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      dir = {x:1,y:0}; nextDir = {x:1,y:0};
      score = 0; alive = true;
      scoreLbl.textContent = 'Счёт: 0';
      placeFood(); draw();
      clearInterval(loop); loop = setInterval(tick, 110);
    }
    function placeFood(){ let ok = false; while(!ok){ food = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; ok = !snake.some(s=>s.x===food.x && s.y===food.y); } }
    function tick(){
      if(!alive) return;
      dir = nextDir;
      const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
      if(head.x<0 || head.x>=COLS || head.y<0 || head.y>=ROWS || snake.some(s=>s.x===head.x && s.y===head.y)){ alive = false; clearInterval(loop); return; }
      snake.unshift(head);
      if(head.x === food.x && head.y === food.y){ score += 10; scoreLbl.textContent = 'Счёт: '+score; placeFood(); } else snake.pop();
      draw();
    }
    function draw(){
      ctx.fillStyle = '#0d1a0d'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#ff5f5f'; ctx.beginPath(); ctx.arc(food.x*CS+CS/2, food.y*CS+CS/2, CS/2-3, 0, Math.PI*2); ctx.fill();
      snake.forEach((s,i)=>{ ctx.fillStyle = i===0?'#7cf07c':'rgba(90,200,90,'+(1-i/(snake.length*1.6))+')'; ctx.fillRect(s.x*CS+1, s.y*CS+1, CS-2, CS-2); });
    }
    function onKey(e){
      const k = e.key.toLowerCase();
      if((k==='arrowup'||k==='w') && dir.y===0) nextDir = {x:0,y:-1};
      else if((k==='arrowdown'||k==='s') && dir.y===0) nextDir = {x:0,y:1};
      else if((k==='arrowleft'||k==='a') && dir.x===0) nextDir = {x:-1,y:0};
      else if((k==='arrowright'||k==='d') && dir.x===0) nextDir = {x:1,y:0};
    }
    document.addEventListener('keydown', onKey);
    const win = WM.wins[WM.wins.length-1];
    if(win) win._cleanup = ()=>{ clearInterval(loop); document.removeEventListener('keydown', onKey); };
    restart.addEventListener('click', reset);
    reset();
  });
}});

Apps.register({ id:'g2048', name:'2048', icon:'🎲', pinned:false, open(){
  openApp('g2048','2048','🎲',420,540,(b)=>{
    b.classList.add('game-wrap');
    const hud = U.el('div','game-hud');
    const scoreLbl = U.el('span',null,'Счёт: 0');
    const restart = U.el('button','btn sec','Заново');
    hud.append(scoreLbl, restart);
    const grid = U.el('div','g2048');
    b.append(hud, grid);
    let board, score;
    function init(){
      board = Array(4).fill(null).map(()=>Array(4).fill(0));
      score = 0;
      addRandom(); addRandom();
      draw();
    }
    function addRandom(){
      const empty = [];
      for(let i=0;i<4;i++) for(let j=0;j<4;j++) if(!board[i][j]) empty.push([i,j]);
      if(!empty.length) return;
      const [i,j] = empty[Math.floor(Math.random()*empty.length)];
      board[i][j] = Math.random() < 0.9 ? 2 : 4;
    }
    function draw(){
      grid.innerHTML = '';
      for(let i=0;i<4;i++) for(let j=0;j<4;j++){
        const c = U.el('div','c');
        c.textContent = board[i][j] || '';
        if(board[i][j]) c.dataset.v = board[i][j];
        grid.appendChild(c);
      }
      scoreLbl.textContent = 'Счёт: '+score;
    }
    function move(dx, dy){
      const old = JSON.stringify(board);
      const slide = (row)=>{
        let arr = row.filter(v=>v);
        for(let i=0;i<arr.length-1;i++){ if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr[i+1]=0; } }
        arr = arr.filter(v=>v);
        while(arr.length<4) arr.push(0);
        return arr;
      };
      // Транспонирование для вертикали
      if(dx !== 0){
        for(let i=0;i<4;i++){
          let row = board[i].slice();
          if(dx > 0) row.reverse();
          row = slide(row);
          if(dx > 0) row.reverse();
          board[i] = row;
        }
      } else {
        for(let j=0;j<4;j++){
          let col = [board[0][j], board[1][j], board[2][j], board[3][j]];
          if(dy > 0) col.reverse();
          col = slide(col);
          if(dy > 0) col.reverse();
          for(let i=0;i<4;i++) board[i][j] = col[i];
        }
      }
      if(JSON.stringify(board) !== old){ addRandom(); draw(); }
    }
    function onKey(e){
      if(e.key === 'ArrowLeft'){ move(-1,0); e.preventDefault(); }
      else if(e.key === 'ArrowRight'){ move(1,0); e.preventDefault(); }
      else if(e.key === 'ArrowUp'){ move(0,-1); e.preventDefault(); }
      else if(e.key === 'ArrowDown'){ move(0,1); e.preventDefault(); }
    }
    document.addEventListener('keydown', onKey);
    const win = WM.wins[WM.wins.length-1];
    if(win) win._cleanup = ()=>{ document.removeEventListener('keydown', onKey); };
    restart.addEventListener('click', init);
    init();
  });
}});

Apps.register({ id:'tictactoe', name:'Крестики-нолики', icon:'⭕', pinned:false, open(){
  openApp('tictactoe','Крестики-нолики','⭕',420,500,(b)=>{
    b.style.cssText = 'padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px';
    const status = U.el('div'); status.style.cssText = 'font-size:16px;font-weight:600';
    const grid = U.el('div'); grid.style.cssText = 'display:grid;grid-template-columns:repeat(3,90px);gap:6px';
    const restart = U.el('button','btn sec','Заново');
    b.append(status, grid, restart);
    let board, cur, over;
    function init(){
      board = Array(9).fill(''); cur = 'X'; over = false;
      status.textContent = 'Ход: X';
      grid.innerHTML = '';
      for(let i=0;i<9;i++){
        const c = U.el('div');
        c.style.cssText = 'aspect-ratio:1;background:var(--input);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;cursor:pointer;color:var(--accent)';
        c.addEventListener('click', ()=>play(i, c));
        grid.appendChild(c);
      }
    }
    function play(i, c){
      if(over || board[i]) return;
      board[i] = cur;
      c.textContent = cur;
      if(checkWin()){ status.textContent = cur + ' победил!'; over = true; }
      else if(board.every(x=>x)){ status.textContent = 'Ничья!'; over = true; }
      else { cur = cur === 'X' ? 'O' : 'X'; status.textContent = 'Ход: '+cur; }
    }
    function checkWin(){
      const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      return lines.some(([a,b,c])=> board[a] && board[a] === board[b] && board[a] === board[c]);
    }
    restart.addEventListener('click', init);
    init();
  });
}});

const INCIDENTS = M.INCIDENTS = [
  {id:'cpuFire',cat:'hardware',em:'🔥',name:'Пожар CPU'},
  {id:'ramFill',cat:'hardware',em:'🧠',name:'Заполнение ОЗУ'},
  {id:'diskFill',cat:'hardware',em:'💾',name:'Заполнение диска'},
  {id:'freeze',cat:'hardware',em:'🧊',name:'Заморозка'},
  {id:'virus',cat:'security',em:'🦠',name:'Вирус'},
  {id:'hacker',cat:'security',em:'🔐',name:'Атака хакеров'},
  {id:'netLoss',cat:'network',em:'🌐',name:'Потеря сети'},
  {id:'ddos',cat:'network',em:'📡',name:'DDoS'},
  {id:'kernelCrash',cat:'system',em:'🧨',name:'Сбой ядра'},
  {id:'bootLoop',cat:'system',em:'🔄',name:'Boot loop'},
  {id:'registryCrash',cat:'system',em:'🗄',name:'Сбой реестра'},
  {id:'slowBoot',cat:'system',em:'⏳',name:'Долгая загрузка'}
];

const Disasters = M.Disasters = {
  mounted:false, active:new Set(), timers:new Map(),
  isMounted(){ return this.mounted; },
  toggle(){ this.mounted ? this.unmount() : this.mount(); },
  mount(){
    if(this.mounted) return;
    if(!License.canUseDisasters()){ ErrorMgr.dialog({title:'Доступ запрещён', icon:'🔒', message:'Требуется администраторская лицензия.'}); return; }
    const panel = document.createElement('div');
    panel.className = 'cp';
    panel.innerHTML = '<div class="cp-head"><div class="cp-status" id="cpStatus"></div><h3>Панель сбоев</h3><button id="cpClose" style="padding:4px 10px;background:var(--input);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px">✕</button></div><div class="cp-body" id="cpBody"></div>';
    document.body.appendChild(panel);
    this.mounted = true;
    this.render();
    document.getElementById('cpClose').addEventListener('click', ()=>this.unmount());
    SystemState.onChange(()=>{ if(this.mounted) this.updateStatus(); });
    this.updateStatus();
  },
  unmount(){ const p = document.querySelector('.cp'); if(p) p.remove(); this.mounted = false; },
  render(){
    const body = document.getElementById('cpBody'); if(!body) return;
    body.innerHTML = '';
    body.appendChild(U.el('div','cp-section','Аппаратные'));
    const hw = INCIDENTS.filter(i=>i.cat === 'hardware');
    hw.forEach(inc => body.appendChild(this.makeBtn(inc)));
    body.appendChild(U.el('div','cp-section','Безопасность'));
    const sec = INCIDENTS.filter(i=>i.cat === 'security');
    sec.forEach(inc => body.appendChild(this.makeBtn(inc)));
    body.appendChild(U.el('div','cp-section','Сетевые'));
    const net = INCIDENTS.filter(i=>i.cat === 'network');
    net.forEach(inc => body.appendChild(this.makeBtn(inc)));
    body.appendChild(U.el('div','cp-section','Системные'));
    const sys = INCIDENTS.filter(i=>i.cat === 'system');
    sys.forEach(inc => body.appendChild(this.makeBtn(inc)));
    body.appendChild(U.el('div','cp-section','Управление'));
    const normalize = U.el('button','cp-btn success');
    normalize.innerHTML = '<span class="em">✅</span><span class="lbl">Нормализовать</span>';
    normalize.addEventListener('click', ()=>this.normalize());
    body.appendChild(normalize);
  },
  makeBtn(inc){
    const btn = U.el('button','cp-btn' + (this.active.has(inc.id)?' danger':''));
    btn.innerHTML = '<span class="em">'+inc.em+'</span><span class="lbl">'+inc.name+'</span>';
    btn.addEventListener('click', ()=>{ if(this.active.has(inc.id)) this.stop(inc.id); else this.start(inc.id); });
    return btn;
  },
  start(id){
    if(this.active.has(id)) return;
    const inc = INCIDENTS.find(i=>i.id === id); if(!inc) return;
    this.active.add(id);
    Notify.push('⚠️ Сбой', inc.name, inc.em);
    AudioMgr.alert();
    if(id === 'cpuFire'){
      document.body.style.filter = 'hue-rotate(-30deg)';
      let t = 0;
      const int = setInterval(()=>{ t++; SystemState.tempC = Math.min(105, SystemState.tempC + 5); SystemState.cpu = Math.min(100, SystemState.cpu + 5); if(t >= 10){ this.stop(id); ErrorMgr.bsod('CRITICAL_PROCESSOR_HEAT', {onComplete:()=>{ document.body.style.filter = ''; }}); } }, 500);
      this.timers.set(id, int);
    } else if(id === 'ramFill'){
      let t = 0;
      const int = setInterval(()=>{ t++; SystemState.ramMB = Math.min(SystemState.ramMaxMB, SystemState.ramMB + 500); if(t >= 8){ this.stop(id); ErrorMgr.bsod('OUT_OF_MEMORY', {onComplete:()=>{ SystemState.ramMB = 2400; }}); } }, 800);
      this.timers.set(id, int);
    } else if(id === 'virus'){
      SystemState.viruses++;
      Notify.push('🦠', 'Обнаружен вирус!', '🦠');
    } else if(id === 'netLoss'){
      const w = document.getElementById('trayWifi'); if(w){ w.textContent = '📵'; w.style.color = '#ff5555'; }
      ErrorMgr.dialog({title:'Сеть', icon:'🌐', message:'Нет подключения к интернету.'});
    } else if(id === 'ddos'){
      let p = 0;
      const int = setInterval(()=>{ p += 200000; if(p >= 1000000){ this.stop(id); ErrorMgr.dialog({title:'Сеть', icon:'📡', message:'DDoS-атака обнаружена!'}); } }, 1000);
      this.timers.set(id, int);
    } else if(id === 'kernelCrash'){
      setTimeout(()=>{ this.stop(id); ErrorMgr.bsod('KERNEL_SECURITY_CHECK_FAILURE'); }, 800);
    } else if(id === 'bootLoop'){
      setTimeout(()=>{ this.stop(id); ErrorMgr.bsod('BOOT_LOOP_DETECTED', {onComplete:()=>location.reload()}); }, 2000);
    } else if(id === 'hacker'){
      ErrorMgr.dialog({title:'🔐 ВЗЛОМ', icon:'🔐', message:'Все ваши файлы зашифрованы!', buttons:[{label:'Расшифровать', primary:true, action:()=>{ setTimeout(()=>ErrorMgr.dialog({title:'😄', icon:'😄', message:'Это симуляция :)', onClose:()=>this.stop(id)}), 500); }}]});
    } else {
      setTimeout(()=>this.stop(id), 3000);
    }
    this.render();
  },
  stop(id){
    this.active.delete(id);
    const int = this.timers.get(id);
    if(int){ clearInterval(int); this.timers.delete(id); }
    if(id === 'netLoss'){ const w = document.getElementById('trayWifi'); if(w){ w.textContent = '📶'; w.style.color = ''; } }
    this.render();
  },
  normalize(){
    this.active.forEach(id=>{ const int = this.timers.get(id); if(int) clearInterval(int); });
    this.active.clear(); this.timers.clear();
    SystemState.cpu = 12; SystemState.ramMB = 2400; SystemState.tempC = 42; SystemState.viruses = 0;
    SystemState.recalcStability();
    document.body.style.filter = '';
    const w = document.getElementById('trayWifi'); if(w){ w.textContent = '📶'; w.style.color = ''; }
    this.render();
    Notify.push('✅', 'Система нормализована', '✔');
  },
  updateStatus(){
    const s = document.getElementById('cpStatus'); if(!s) return;
    s.style.background = SystemState.stability > 70 ? '#2ecc71' : SystemState.stability > 40 ? '#f39c12' : '#e74c3c';
  }
};

const Desktop = M.Desktop = {
  positions:{},
  baseIcons:[
    {key:'explorer', label:'Проводник', icon:'📁', action:()=>Apps.open('explorer')},
    {key:'notepad', label:'Блокнот', icon:'📝', action:()=>Apps.open('notepad')},
    {key:'calculator', label:'Калькулятор', icon:'🧮', action:()=>Apps.open('calculator')},
    {key:'terminal', label:'Терминал', icon:'⌨️', action:()=>Apps.open('terminal')},
    {key:'settings', label:'Настройки', icon:'⚙️', action:()=>Apps.open('settings')},
    {key:'paint', label:'Paint', icon:'🎨', action:()=>Apps.open('paint')}
  ],
  render(){
    const box = document.getElementById('icons'); if(!box) return;
    box.innerHTML = '';
    this.positions = U.lsGet('iconPos',{});
    this.baseIcons.forEach((ic, i)=>{
      const pos = this.positions[ic.key] || {x:18 + Math.floor(i/6)*96, y:18 + (i%6)*104};
      const d = U.el('div','dicon');
      d.dataset.key = ic.key;
      d.style.left = pos.x+'px'; d.style.top = pos.y+'px';
      d.innerHTML = '<div class="em">'+ic.icon+'</div><div class="lb">'+ic.label+'</div>';
      d.addEventListener('click', e=>{ e.stopPropagation(); U.$$('.dicon').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); });
      d.addEventListener('dblclick', ic.action);
      d.addEventListener('mousedown', e=>this.startDrag(e, d, ic.key));
      box.appendChild(d);
    });
    DB.getAllApps().then(apps=>{
      apps.forEach((app, i)=>{
        const key = 'inst_'+app.id;
        const idx = this.baseIcons.length + i;
        const pos = this.positions[key] || {x:18 + Math.floor(idx/6)*96 + 480, y:18 + (idx%6)*104};
        const d = U.el('div','dicon');
        d.dataset.key = key; d.dataset.appId = key;
        d.style.left = pos.x+'px'; d.style.top = pos.y+'px';
        const em = U.el('div','em');
        if(app.icon){ const img = U.el('img'); img.src = app.icon; em.appendChild(img); }
        else em.textContent = app.kind === 'apk' ? '🤖' : '💻';
        d.append(em, U.el('div','lb', app.name));
        d.addEventListener('click', e=>{ e.stopPropagation(); U.$$('.dicon').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); });
        d.addEventListener('dblclick', ()=>VM.open(key));
        d.addEventListener('mousedown', e=>this.startDrag(e, d, key));
        d.addEventListener('contextmenu', e=>{
          e.preventDefault(); e.stopPropagation();
          const menu = U.el('div');
          menu.style.cssText = 'position:fixed;left:'+e.clientX+'px;top:'+e.clientY+'px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:5px;z-index:10000;min-width:180px';
          const open = U.el('div',null,'🚀 Открыть'); open.style.cssText = 'padding:8px 12px;font-size:13px;cursor:pointer;border-radius:5px';
          open.addEventListener('click', ()=>{ menu.remove(); VM.open(key); });
          const del = U.el('div',null,'🗑 Удалить'); del.style.cssText = 'padding:8px 12px;font-size:13px;cursor:pointer;border-radius:5px;color:#e74c3c';
          del.addEventListener('click', async ()=>{ menu.remove(); if(confirm('Удалить?')){ await Boot.uninstallApp(key); } });
          menu.append(open, del);
          document.body.appendChild(menu);
          setTimeout(()=>{ document.addEventListener('click', function h(ev){ if(!menu.contains(ev.target)){ menu.remove(); document.removeEventListener('click', h); } }); }, 10);
        });
        box.appendChild(d);
      });
    });
  },
  startDrag(e, d, key){
    if(e.button !== 0) return;
    let dragging = false;
    const sx = e.clientX, sy = e.clientY;
    const ox = parseFloat(d.style.left), oy = parseFloat(d.style.top);
    const move = ev=>{ const dx = ev.clientX - sx, dy = ev.clientY - sy; if(!dragging && Math.hypot(dx,dy) > 5) dragging = true; if(dragging){ d.style.left = Math.max(0, ox+dx)+'px'; d.style.top = Math.max(0, oy+dy)+'px'; } };
    const up = ()=>{ document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); if(dragging){ this.positions[key] = {x:parseFloat(d.style.left), y:parseFloat(d.style.top)}; U.lsSet('iconPos', this.positions); } };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }
};

        <div class="oobe-center">

    document.querySelectorAll('.oobe-dot').forEach(d=>{ d.classList.toggle('active', parseInt(d.dataset.i) === step); d.classList.toggle('done', parseInt(d.dataset.i) < step); });

    document.getElementById('oobeNext').textContent = step === this.maxStep ? 'Готово' : 'Далее →';

  quickSetup(){

    if(this.onDone) this.onDone();

    U.lsSet('user', {name});

    if(this.onDone) this.onDone();
  }
};

/* ==================== BOOTFLOW ==================== */
const BootFlow = M.BootFlow = {
  start(onComplete){
    this.onComplete = onComplete;
    const activated = U.lsGet('activated', false);
    const hasLicense = License.load();
    if(activated && hasLicense){
      this.showBootloader(()=>{
        if(U.lsGet('installed', false)) LockScreen.show();
        else if(onComplete) onComplete();
      });
    } else {
      this.showBootloader(()=> this.showActivationKey('first'));
    }
  },
  showBootloader(onDone){
    const boot = document.getElementById('bootloader');
    document.getElementById('activationFlow').classList.add('hidden');
    boot.classList.remove('hidden');
    AudioMgr.beep(880, 0.08, 'square', 0.04);
    const fill = document.getElementById('bootFill');
    fill.style.width = '0%';
    let p = 0;
    const int = setInterval(()=>{
      p += 2;
      if(p >= 100){ p = 100; clearInterval(int); fill.style.width = '100%'; setTimeout(()=>{ boot.classList.add('hidden'); if(onDone) onDone(); }, 250); }
      else fill.style.width = p + '%';
    }, 30);
  },
  showActivationKey(phase){
    const act = document.getElementById('activationFlow');
    act.classList.remove('hidden');
    act.innerHTML = '';
    const screen = U.el('div','act-screen');
    screen.innerHTML = `
      <div class="act-icon">🔑</div>
      <div class="act-title">Активация microOSPASTON</div>
      <div class="act-subtitle">Введите ключ активации</div>
      <input type="text" class="act-input" id="actInput" placeholder="Ключ активации" autocomplete="off">
      <button class="act-btn" id="actBtn">Активировать</button>
      <div class="act-error" id="actErr"></div>
      <div style="font-size:11px;color:#555;margin-top:20px;line-height:1.6">
        <div>👑 Админ: paykey1234567890adminopen</div>
        <div>🏠 Home: paykey1234567890homeopen</div>
      </div>
    `;
    act.appendChild(screen);
    const input = document.getElementById('actInput');
    const btn = document.getElementById('actBtn');
    const err = document.getElementById('actErr');
    const submit = ()=>{
      const val = input.value.trim();
      if(!val){ err.textContent = 'Введите ключ'; return; }
      const type = License.validate(val);
      if(type){
        License.activate(type, val);
        AudioMgr.beep(880, 0.1, 'sine', 0.06);
        btn.disabled = true; input.disabled = true;
        if(phase === 'first') this.showVerifying(type);
        else this.showVersionSelect();
      } else {
        err.textContent = 'Неверный ключ активации';
        input.classList.add('err');
        setTimeout(()=>input.classList.remove('err'), 500);
        AudioMgr.error();
        input.select();
      }
    };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', e=>{ if(e.key === 'Enter') submit(); });
    setTimeout(()=>input.focus(), 200);
  },
  showVerifying(type){
    const act = document.getElementById('activationFlow');
    act.innerHTML = '';
    const screen = U.el('div','act-verify');
    screen.innerHTML = `
      <div class="act-icon">🛡️</div>
      <div style="font-size:20px;font-weight:300;margin-bottom:24px">Проверка ключа…</div>
      <div class="act-verify-progress"><div id="vFill"></div></div>
      <div class="act-verify-pct" id="vPct">0%</div>
      <div class="act-verify-msg" id="vMsg">Соединение…</div>
    `;
    act.appendChild(screen);
    const fill = document.getElementById('vFill');
    const pct = document.getElementById('vPct');
    const msg = document.getElementById('vMsg');
    const messages = ['Соединение с сервером…','Проверка подписи…','Верификация лицензии…','Загрузка конфигурации…','Готово'];
    const start = Date.now();
    let mi = 0;
    const int = setInterval(()=>{
      const p = Math.min(100, (Date.now()-start)/3000*100);
      fill.style.width = p+'%'; pct.textContent = Math.floor(p)+'%';
      const ni = Math.min(messages.length-1, Math.floor(p/100*messages.length));
      if(ni !== mi){ mi = ni; msg.textContent = messages[ni]; }
      if(p >= 100){ clearInterval(int); msg.textContent = '✓ Ключ подтверждён: '+License.getLabel(); msg.classList.add('done'); setTimeout(()=>this.showGreeting(type), 800); }
    }, 50);
  },
  showGreeting(type){
    const act = document.getElementById('activationFlow');
    act.innerHTML = '<div style="width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;color:#4ec9b0;font-family:monospace;font-size:14px">Завершение работы…</div>';
    setTimeout(()=>{
      act.innerHTML = '';
      const screen = U.el('div','act-greeting');
      screen.innerHTML = '<div class="act-greeting-title">Добрый день!</div><div class="act-greeting-sub">Добро пожаловать в microOS</div><div style="font-size:14px;opacity:.7;margin-top:12px">Лицензия: '+License.getLabel()+'</div>';
      act.appendChild(screen);
      setTimeout(()=>{
        const btn = U.el('button','act-btn','Продолжить');
        btn.style.maxWidth = '300px';
        btn.style.margin = '20px auto 0';
        screen.appendChild(btn);
        btn.addEventListener('click', ()=>{
          if(type === 'home'){
            // Home — сразу к OOBE, минуя выбор версии
            Version.set('v11-home');
            U.lsSet('version','v11-home');
            act.classList.add('hidden');
            if(!U.lsGet('installed', false)){ OOBE.start(()=>{ U.lsSet('activated', true); if(this.onComplete) this.onComplete(); }); }
            else { U.lsSet('activated', true); if(this.onComplete) this.onComplete(); }
          } else {
            this.showVersionSelect();
          }
        });
      }, 800);
    }, 1500);
  },
  showVersionSelect(){
    const act = document.getElementById('activationFlow');
    act.innerHTML = '';
    const screen = U.el('div','version-screen');
    screen.innerHTML = `
      <div class="version-header">
        <div class="version-step">ШАГ 1 ИЗ 2</div>
        <div class="version-title">Выберите версию microOS</div>
        <div class="version-sub">${License.getIcon()} Лицензия: ${License.getLabel()}</div>
      </div>
    `;
    const tabs = U.el('div','version-tabs');
    let currentLine = 10;
    const grid = U.el('div','version-grid');
    let selectedId = U.lsGet('version','v11-pro');
    if(!License.canUseVersion(selectedId)) selectedId = License.allowedVersions()[0];
    function renderGrid(){
      grid.innerHTML = '';
      VERSIONS.filter(v=>v.line === currentLine).forEach(v=>{
        const can = License.canUseVersion(v.id);
        const card = U.el('div','version-card' + (v.id === selectedId ? ' selected':'') + (can ? '' : ' locked'));
        const preview = U.el('div','version-preview');
        preview.style.background = v.accent + '15';
        preview.style.borderColor = v.accent + '40';
        const tb = U.el('div','version-ptb');
        tb.style.cssText = `background:${v.accent}30;border-top:1px solid ${v.accent}50`;
        const win = U.el('div','version-pwin');
        win.style.cssText = `background:${v.accent}20;border:1px solid ${v.accent}40`;
        preview.append(tb, win);
        card.appendChild(preview);
        const nameDiv = U.el('div','version-name', v.name);
        card.appendChild(nameDiv);
        card.appendChild(U.el('div','version-model', v.model));
        card.appendChild(U.el('div','version-desc', v.description));
        const tags = U.el('div','version-tags');
        v.tags.forEach(t=>{
          const tag = U.el('span','version-tag', t);
          tag.style.background = v.accent + '25';
          tag.style.color = v.accent;
          tags.appendChild(tag);
        });
        card.appendChild(tags);
        if(can && v.id === selectedId){ const ch = U.el('div','version-check','✓'); card.appendChild(ch); }
        card.addEventListener('click', ()=>{
          if(!can){ ErrorMgr.dialog({title:'Заблокировано', icon:'🔒', message:'Эта версия требует Pro-лицензию или админ-ключ. Введите ключ paykey1234567890adminopen для доступа.'}); return; }
          selectedId = v.id;
          renderGrid();
          nextBtn.textContent = 'Выбрать: ' + v.name;
        });
        grid.appendChild(card);
      });
    }
    [10,11].forEach(ln=>{
      const tab = U.el('button','version-tab' + (ln === currentLine ? ' active':''), ln === 10 ? '🪟 microOS 10' : '✨ microOS 11');
      tab.addEventListener('click', ()=>{ currentLine = ln; U.$$('.version-tab', tabs).forEach(x=>x.classList.toggle('active', x.textContent.includes(ln === 10 ? 'microOS 10' : 'microOS 11'))); renderGrid(); });
      tabs.appendChild(tab);
    });
    screen.append(tabs, grid);
    const footer = U.el('div','version-footer');
    const nextBtn = U.el('button','version-btn primary','Выбрать: ' + (VERSIONS.find(x=>x.id === selectedId) || {}).name);
    nextBtn.addEventListener('click', ()=>{
      Version.set(selectedId);
      U.lsSet('version', selectedId);
      U.lsSet('activated', true);
      act.classList.add('hidden');
      if(!U.lsGet('installed', false)){
        OOBE.start(()=>{ if(this.onComplete) this.onComplete(); });
      } else if(this.onComplete) this.onComplete();
    });
    footer.appendChild(nextBtn);
    screen.appendChild(footer);
    act.appendChild(screen);
    renderGrid();
  }
};

/* ==================== BOOT ==================== */
const Boot = M.Boot = {
  async init(){
    Settings.load();
    Version.load();
    FS.load();
    applyWallpaper();
    document.documentElement.dataset.theme = Settings.get('theme');
    
    Desktop.render();
    Taskbar.render();
    StartMenu.init();
    LockScreen.init();
    OOBE.init();
    this.initInstaller();
    
    await DB.init().catch(e=>console.warn('DB:', e));
    await this.loadApps();
    
    this.updateClock();
    setInterval(()=>this.updateClock(), 1000);
    
    // BootFlow
    BootFlow.start(()=>{
      this.showDesktop();
      Notify.push('microOS', 'Добро пожаловать! Лицензия: '+License.getLabel(), License.getIcon());
    });
  },
  async loadApps(){
    try{
      const apps = await DB.getAllApps();
      apps.forEach(app=>this.registerInstalledApp(app.id, app, true));
    }catch(e){ console.warn(e); }
  },
  async registerInstalledApp(appId, app, skipUI){
    const id = 'inst_'+appId;
    if(Apps.get(id)) return;
    Apps.register({ id, name:app.name, icon:app.icon, open(){ VM.open(id); } });
    if(!skipUI){ Desktop.render(); StartMenu.render(); Taskbar.render(); }
  },
  async uninstallApp(appId){
    try{
      const numericId = String(appId).startsWith('inst_') ? parseInt(appId.slice(5),10) : appId;
      const app = await DB.getApp(numericId);
      if(app){ if(app.fileId) await DB.deleteFile(app.fileId).catch(()=>{}); await DB.deleteApp(numericId); }
      try{ delete Apps.registry[appId]; }catch(e){}
      await AppData.deleteAll(numericId).catch(()=>{});
      const win = WM.findApp('vm_'+appId);
      if(win) WM.close(win.id);
      Desktop.render(); StartMenu.render(); Taskbar.render();
      Notify.push('🗑 Удалено', app ? app.name : appId, '🗑');
    }catch(e){ console.error(e); }
  },
  initInstaller(){
    const btn = document.getElementById('trayInstall');
    const input = document.getElementById('fileInput');
    if(btn) btn.addEventListener('click', ()=>{ input.value = ''; input.click(); });
    if(input) input.addEventListener('change', async ()=>{
      const file = input.files[0]; if(!file) return;
      try{ await Installer.start(file); }catch(e){ alert('Ошибка: '+e.message); console.error(e); }
    });
    document.addEventListener('dragover', e=>e.preventDefault());
    document.addEventListener('drop', async e=>{
      e.preventDefault();
      const files = e.dataTransfer && e.dataTransfer.files;
      if(!files) return;
      for(const f of files){ try{ await Installer.start(f); }catch(err){ console.error(err); } }
    });
  },
  updateClock(){
    const now = new Date();
    const cl = document.getElementById('trayClock');
    if(cl){
      cl.querySelector('.t').textContent = U.pad(now.getHours())+':'+U.pad(now.getMinutes());
      cl.querySelector('.d').textContent = U.pad(now.getDate())+'.'+U.pad(now.getMonth()+1)+'.'+now.getFullYear();
    }
    LockScreen.updateClock();
  },
  showDesktop(){
    SystemState.start();
    Desktop.render(); Taskbar.render(); StartMenu.render();
  }
};

/* ==================== START ==================== */
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ()=>Boot.init());
else Boot.init();

})(window.microOS);
</script>
